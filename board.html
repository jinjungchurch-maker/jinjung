<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>게시판 · 진중교회</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="img/favicon.png?v=2">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#16335c">
<meta name="apple-mobile-web-app-title" content="진중교회">
<style>
@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css');
:root{
  --ink:#10151c;--ink2:#3a4654;--soft:#6b7888;--paper:#f6f8fb;--card:#fff;
  --navy:#16335c;--navy-d:#0d2240;--gold:#e0a93c;--green:#1fa463;--red:#e3242b;--sky:#2f8fd6;--line:rgba(16,21,28,.09);
  --font:"Pretendard","Apple SD Gothic Neo","Noto Sans KR",sans-serif;--r:22px;
}
*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{font-family:var(--font);color:var(--ink);background:var(--paper);line-height:1.7;-webkit-font-smoothing:antialiased;}
a{color:inherit;text-decoration:none;}
img{display:block;max-width:100%;}

.nav{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(255,255,255,.95);backdrop-filter:blur(14px);box-shadow:0 6px 26px -20px rgba(0,0,0,.4);}
.nav-inner{max-width:1240px;margin:0 auto;padding:12px 24px;display:flex;align-items:center;justify-content:space-between;gap:18px;}
.brand img{height:40px;}
.nav-links{display:flex;gap:2px;font-size:14.5px;font-weight:600;flex-wrap:wrap;align-items:center;}
.nav-links > a{padding:8px 12px;border-radius:30px;color:var(--ink2);transition:.2s;}
.dropdown{position:relative;}
.dropdown > .dbtn{padding:8px 12px;border-radius:30px;color:var(--ink2);background:none;border:none;font:inherit;font-weight:600;cursor:pointer;transition:.2s;}
.dropdown > .dbtn:hover,.nav-links > a:hover{background:var(--paper);color:var(--navy);}
.dropdown .menu{position:absolute;top:100%;left:0;margin-top:6px;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 20px 46px -26px rgba(0,0,0,.5);padding:6px;min-width:150px;opacity:0;visibility:hidden;transform:translateY(-6px);transition:.2s;z-index:10;}
.dropdown:hover .menu,.dropdown:focus-within .menu{opacity:1;visibility:visible;transform:none;}
.dropdown .menu a{display:block;padding:10px 14px;border-radius:9px;font-size:14px;font-weight:600;color:var(--ink2);}
.dropdown .menu a:hover{background:var(--paper);color:var(--navy);}
.nav-links a:hover,.nav-links a.active{background:var(--paper);color:var(--navy);}
.menu-btn{display:none;background:none;border:none;cursor:pointer;color:var(--ink);}
.menu-btn svg{width:28px;height:28px;}
@media(max-width:980px){
  .nav-links{position:fixed;inset:0 0 0 auto;width:78%;max-width:340px;background:#fff;flex-direction:column;align-items:stretch;padding:84px 20px 30px;gap:2px;transform:translateX(100%);transition:.35s;box-shadow:-20px 0 60px -30px rgba(0,0,0,.5);overflow-y:auto;}
  .nav-links.open{transform:none;}
  .nav-links a{font-size:16px;padding:13px 16px;}
  .nav-links > a,.dropdown > .dbtn{font-size:16px;padding:13px 16px;width:100%;text-align:left;}
  .dropdown .menu{position:static;opacity:1;visibility:visible;transform:none;box-shadow:none;border:none;padding:0 0 6px 14px;margin:0;min-width:0;}
  .dropdown .menu a{padding:9px 14px;font-size:14.5px;}
  .menu-btn{display:block;}
}

.phead{padding:120px 24px 50px;text-align:center;color:#fff;position:relative;overflow:hidden;background:linear-gradient(135deg,var(--navy),var(--navy-d));}
.phead::after{content:"";position:absolute;inset:0;background:radial-gradient(closest-side,rgba(47,143,214,.35),transparent) 80% -20%/500px 500px no-repeat;}
.phead .in{position:relative;max-width:760px;margin:0 auto;}
.phead .kick{font-size:13px;font-weight:800;letter-spacing:.16em;color:#ffd98a;text-transform:uppercase;}
.phead h1{font-size:clamp(30px,6vw,48px);font-weight:800;margin-top:8px;}

/* 카테고리 탭 */
.tabs{max-width:1000px;margin:0 auto;padding:0 24px;display:flex;gap:8px;flex-wrap:wrap;justify-content:center;transform:translateY(-22px);}
.tabs a{padding:10px 18px;border-radius:30px;font-size:14px;font-weight:700;background:#fff;border:1px solid var(--line);color:var(--ink2);box-shadow:0 10px 24px -18px rgba(0,0,0,.4);transition:.2s;}
.tabs a:hover{color:var(--navy);}
.tabs a.active{background:var(--navy);color:#fff;border-color:var(--navy);}

.wrap{max-width:1000px;margin:0 auto;padding:30px 24px 90px;}
.list{display:flex;flex-direction:column;gap:14px;}
.post{display:flex;align-items:center;gap:18px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px 24px;transition:.22s;}
.post-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 26px;transition:.22s;}
.post-card:hover{box-shadow:0 20px 44px -32px rgba(16,21,28,.5);}
.post-head .cat{display:inline-block;font-size:11.5px;font-weight:700;color:var(--sky);background:#eaf4fc;padding:2px 9px;border-radius:20px;margin-bottom:6px;}
.post-head .t{font-size:20px;font-weight:700;color:var(--ink);}
.post-head .meta{font-size:14.5px;color:var(--soft);margin-top:4px;}
.post-text{margin-top:16px;padding-top:16px;border-top:1px dashed var(--line);font-size:18.5px;color:var(--ink2);line-height:1.9;white-space:normal;}
.post-files{margin-top:14px;display:flex;flex-wrap:wrap;gap:8px;}
.filelink{display:inline-flex;align-items:center;gap:7px;font-size:13.5px;font-weight:600;color:var(--navy);background:#eef4fb;padding:8px 14px;border-radius:10px;transition:.18s;}
.filelink:hover{background:#dceafa;}
.filelink svg{width:16px;height:16px;}
/* 최신 글 강조 + 첨부 인라인 미리보기 */
.post-card.featured{border-color:var(--sky);box-shadow:0 24px 54px -34px rgba(47,143,214,.55);}
.post-card.featured .post-head{display:flex;flex-direction:column;}
.newtag{align-self:flex-start;font-size:11px;font-weight:800;letter-spacing:.04em;color:#fff;background:linear-gradient(135deg,var(--navy),var(--sky));padding:3px 10px;border-radius:20px;margin-bottom:8px;}
.preview{margin-top:16px;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:#0d1117;}
.preview img{width:100%;height:auto;display:block;background:#fff;}
.preview iframe{width:100%;height:78vh;min-height:460px;border:0;display:block;background:#fff;}
.preview.video iframe{height:auto;aspect-ratio:16/9;min-height:0;}
/* HTML 첨부(가정예배지)는 테두리·내부 스크롤 없이 페이지에 자연스럽게 — 높이 자동 맞춤 */
.preview-html{margin-top:18px;}
.preview-html .hframe{width:100%;border:0;display:block;background:transparent;min-height:300px;}
/* 이미지 갤러리 (주보 등 여러 장 좌우 넘김) */
.gallery{position:relative;margin-top:16px;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:#0d1117;}
.gallery .gal-track img{width:100%;height:auto;display:block;background:#fff;}
.gal-nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border:0;border-radius:50%;background:rgba(0,0,0,.45);color:#fff;font-size:28px;line-height:1;cursor:pointer;display:grid;place-items:center;padding:0;transition:background .2s;}
.gal-nav:hover{background:rgba(0,0,0,.68);}
.gal-nav.prev{left:10px;} .gal-nav.next{right:10px;}
.gal-count{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.55);color:#fff;font-size:12.5px;font-weight:700;padding:4px 13px;border-radius:20px;}
.post:hover{transform:translateY(-3px);border-color:var(--sky);box-shadow:0 20px 44px -32px rgba(16,21,28,.5);}
.post .ic{width:46px;height:46px;border-radius:13px;flex:none;display:grid;place-items:center;background:#eef4fb;color:var(--navy);}
.post .ic svg{width:22px;height:22px;}
.post .body{flex:1;min-width:0;}
.post .cat{display:inline-block;font-size:11.5px;font-weight:700;color:var(--sky);background:#eaf4fc;padding:2px 9px;border-radius:20px;margin-bottom:5px;}
.post .t{font-size:16.5px;font-weight:700;color:var(--ink);}
.post .meta{font-size:13px;color:var(--soft);margin-top:3px;}
.post .arrow{flex:none;color:var(--soft);}
.post .arrow svg{width:20px;height:20px;}

.empty{text-align:center;padding:70px 24px;color:var(--soft);}
.empty .ic{width:64px;height:64px;border-radius:18px;margin:0 auto 18px;display:grid;place-items:center;background:#eef4fb;color:var(--navy);}
.empty .ic svg{width:30px;height:30px;}
.empty h3{font-size:19px;font-weight:800;color:var(--ink2);margin-bottom:8px;}
.empty p{font-size:14.5px;line-height:1.7;}

.back{display:inline-flex;align-items:center;gap:8px;margin-top:30px;font-weight:700;color:var(--sky);}
.back svg{width:18px;height:18px;}
.footer{background:var(--navy-d);color:#aebfd4;padding:36px 24px;text-align:center;font-size:13px;}
.footer a{color:#cfe0f5;}
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <a class="brand" href="index.html"><img src="img/logo-color.png" alt="진중교회"></a>
    <button class="menu-btn" id="menuBtn" aria-label="메뉴"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
    <div class="nav-links" id="navLinks">
      <div class="dropdown">
        <button class="dbtn">소개 ▾</button>
        <div class="menu">
          <a href="index.html#about">교회소개</a>
          <a href="pastor.html">담임목사</a>
          <a href="history.html">교회역사</a>
          <a href="bylaws.html">정관</a>
        </div>
      </div>
      <a href="board.html?cat=설교">설교</a>
      <a href="board.html?cat=찬양">찬양</a>
      <div class="dropdown">
        <button class="dbtn">소그룹 ▾</button>
        <div class="menu">
          <a href="board.html?cat=구역모임">구역모임</a>
          <a href="board.html?cat=가정예배">가정예배</a>
        </div>
      </div>
      <a href="board.html?cat=주보">주보</a>
    </div>
  </div>
</nav>

<header class="phead">
  <div class="in">
    <p class="kick">Board</p>
    <h1 id="board-title">게시판</h1>
  </div>
</header>

<nav class="tabs" id="tabs"></nav>

<main class="wrap">
  <div class="list" id="list"></div>
  <a class="back" href="index.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>홈으로 돌아가기</a>
</main>

<footer class="footer">
  © 2026 진중교회 · Since 1964 · (12281) 경기도 남양주시 조안면 운길산로 35 · <a href="tel:031-576-8511">031-576-8511</a>
</footer>

<script>
const mb=document.getElementById('menuBtn'), nl=document.getElementById('navLinks');
mb.addEventListener('click',(e)=>{ e.stopPropagation(); nl.classList.toggle('open'); });
// 메뉴 밖(바탕) 클릭 시 닫기 + 메뉴 안 링크 클릭 시 닫기
document.addEventListener('click',(e)=>{ if(nl.classList.contains('open') && !nl.contains(e.target) && !mb.contains(e.target)) nl.classList.remove('open'); });
nl.querySelectorAll('a').forEach((a)=>a.addEventListener('click',()=>nl.classList.remove('open')));

const CATS=["설교","찬양","구역모임","가정예배","주보"];
const params=new URLSearchParams(location.search);
let cur=params.get('cat'); if(!CATS.includes(cur)) cur=CATS[0];
document.getElementById('board-title').textContent=cur;

// 탭
const tabs=document.getElementById('tabs');
CATS.forEach(c=>{
  const a=document.createElement('a');
  a.href="board.html?cat="+encodeURIComponent(c);
  a.textContent=c; if(c===cur)a.className="active";
  tabs.appendChild(a);
});

function fmtDate(d){ if(!d)return""; try{const t=new Date(d);return t.getFullYear()+". "+(t.getMonth()+1)+". "+t.getDate()+".";}catch(e){return d;} }
const fileIcon='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>';
const arrow='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>';

function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
// **굵게** 마커를 <strong>으로 변환 (esc로 안전하게 이스케이프한 뒤 적용)
function mdInline(s){ return s.replace(/\*\*([^*\n]+?)\*\*/g,'<strong>$1</strong>'); }

// 이미지 갤러리 (여러 장이면 좌우 넘김, 1장이면 그대로)
function galleryHTML(imgs){
  if(imgs.length===1) return '<div class="preview"><img src="'+imgs[0]+'" alt="" loading="lazy"></div>';
  const slides=imgs.map((u,k)=>'<img src="'+u+'" alt="" loading="lazy" style="display:'+(k===0?'block':'none')+'">').join('');
  return '<div class="gallery" data-i="0">'
    +'<div class="gal-track">'+slides+'</div>'
    +'<button class="gal-nav prev" onclick="galStep(this,-1)" aria-label="이전">\u2039</button>'
    +'<button class="gal-nav next" onclick="galStep(this,1)" aria-label="다음">\u203a</button>'
    +'<div class="gal-count"><span class="cur">1</span> / '+imgs.length+'</div>'
    +'</div>';
}
function galStep(btn,dir){
  const g=btn.closest('.gallery'); if(!g)return;
  const imgs=g.querySelectorAll('.gal-track img');
  const i=(parseInt(g.dataset.i,10)+dir+imgs.length)%imgs.length;
  for(let k=0;k<imgs.length;k++) imgs[k].style.display=(k===i?'block':'none');
  g.dataset.i=i;
  g.querySelector('.gal-count .cur').textContent=i+1;
}
// 모바일 스와이프
let _galX=0;
document.addEventListener('touchstart',function(e){ const t=e.target.closest&&e.target.closest('.gallery'); if(t)_galX=e.changedTouches[0].clientX; },{passive:true});
document.addEventListener('touchend',function(e){ const g=e.target.closest&&e.target.closest('.gallery'); if(!g)return; const dx=e.changedTouches[0].clientX-_galX; if(Math.abs(dx)>40){ const n=g.querySelector(dx<0?'.gal-nav.next':'.gal-nav.prev'); if(n)galStep(n,dx<0?1:-1); } },{passive:true});

// HTML 첨부(가정예배지) 높이를 내용에 맞춰 늘려 프레임/내부 스크롤 제거
// HTML 첨부(가정예배지) 표시 보정: 하늘색 배경 제거→흰 배경, 카드 전체폭, 높이 자동
function fitFrame(f){
  try{
    var d=f.contentDocument||f.contentWindow.document;
    if(!d.getElementById('board-fit')){
      var st=d.createElement('style'); st.id='board-fit';
      st.textContent=
        'html,body{background:#fff !important;margin:0 !important;padding:0 !important;}'+
        '.sheet{max-width:none !important;margin:0 !important;box-shadow:none !important;border:none !important;}'+
        '.wrap{padding-left:0 !important;padding-right:0 !important;}'+   /* 본문을 파란박스와 같은 가로폭으로 (좌우 여백 제거) */
        '.dlbar{max-width:none !important;margin:0 0 10px !important;padding:0 clamp(16px,4.5vw,46px) !important;}'+
        /* 본문 글자 크기 키워 게시판(구역모임) 글과 맞춤. 지시어(.note 기울임)는 그대로 유지 */
        '.sec p,.scripture,.summary p,.card p,.prayer,.mission p,.dcard .q,.lyrics .t,.bless{font-size:18px !important;line-height:1.72 !important;}'+
        '.summary .lead{font-size:19px !important;}'+
        '.passage-ref{font-size:18px !important;}'+
        '.head{border-radius:18px !important;}'+
        /* 지시어(.note)는 작게 + 기울임 유지 (본문 키움 규칙에 안 휩쓸리게 높은 우선순위) */
        '.sheet p.note{font-size:13px !important;font-style:italic !important;line-height:1.55 !important;}';
      (d.head||d.documentElement).appendChild(st);
    }
    function setH(){ try{ f.style.height=(d.body.scrollHeight+8)+'px'; }catch(e){} }
    setH(); setTimeout(setH,120); setTimeout(setH,900);   // 폰트 로딩 후 보정
  }catch(e){ f.style.height='85vh'; }
}
window.addEventListener('resize',function(){ document.querySelectorAll('.hframe').forEach(fitFrame); });

// 유튜브 영상 ID 추출 (링크가 본문·첨부 어디에 있든 인식)
function ytId(u){ const m=(u||'').match(/(?:youtu\.be\/|[?&]v=|embed\/|shorts\/)([\w-]{11})/); return m?m[1]:''; }
function ytEmbed(id){ return '<div class="preview video"><iframe src="https://www.youtube-nocookie.com/embed/'+id+'?rel=0" title="영상" allow="accelerometer; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe></div>'; }
function findYt(p){
  for(const u of (p.attachments||[])){ const id=ytId(u); if(id) return id; }
  return ytId(p.content||'') || ytId(p.url||'');
}

// 파일 1개를 화면에 바로 펼쳐 보여줌 (이미지·PDF·HTML)
function preview(u){
  const ext=(u.split('?')[0].split('.').pop()||'').toLowerCase();
  const yi=ytId(u); if(yi) return ytEmbed(yi);
  if(['jpg','jpeg','png','gif','webp','svg'].includes(ext)) return '<div class="preview"><img src="'+u+'" alt="" loading="lazy"></div>';
  if(ext==='pdf') return '<div class="preview"><iframe src="'+u+'#view=FitH" title="첨부 미리보기"></iframe></div>';
  if(ext==='html'||ext==='htm') return '<div class="preview-html"><iframe class="hframe" src="'+u+'" title="가정예배지" onload="fitFrame(this)" sandbox="allow-scripts allow-same-origin allow-popups allow-modals allow-downloads"></iframe></div>';
  return '';
}

// 카드 하나의 HTML 생성 (i===0 이면 '최신' 강조)
function cardHTML(p, i){
  const newest=(i===0);
  const yi=findYt(p);
  const isImg=(u)=>/\.(jpe?g|png|gif|webp|svg)(\?|$)/i.test(u);
  const atts=p.attachments||[];
  const imgs=atts.filter(isImg);                          // 이미지(주보 등)
  const others=atts.filter(u=>!isImg(u)&&!ytId(u));       // 그 외 파일(PDF·HTML 등)
  const meta=[fmtDate(p.date)].filter(Boolean).join(" · ");
  let text=(p.content||'');
  if(yi) text=text.replace(/https?:\/\/\S*(?:youtu\.be|youtube\.com)\/\S+/g,'').replace(/\n{3,}/g,'\n\n').trim();
  const hasText=text.length>0;

  let media="";
  if(yi) media+=ytEmbed(yi);                              // 유튜브 바로보기
  if(imgs.length) media+=galleryHTML(imgs);              // 이미지: 모든 글에서 갤러리(좌우 넘김)
  if(newest && others.length){                            // 최신 글: HTML(가정예배지)/PDF 인라인
    const htmlAtt=others.find(u=>/\.html?(\?|$)/i.test(u));
    media+=preview(htmlAtt||others[0]);
  }
  let bodyExtra= hasText ? '<div class="post-text">'+mdInline(esc(text)).replace(/\n/g,'<br>')+'</div>' : '';
  // 다운로드 링크는 이미지 외 파일만 (이미지는 갤러리로 보여주므로 새창 안 열림)
  let fileLinks= others.length ? '<div class="post-files">'+others.map((u,k)=>{
      const name=decodeURIComponent(u.split('/').pop().split('?')[0])||('첨부'+(k+1));
      return '<a class="filelink" href="'+u+'" target="_blank" rel="noopener">'+fileIcon+' '+esc(name)+'</a>';
    }).join('')+'</div>' : '';

  const head='<div class="post-head">'+(newest?'<span class="newtag">최신</span>':'')+'<span class="cat">'+p.category+'</span><div class="t">'+esc(p.title||'제목 없음')+'</div>'+(meta?'<div class="meta">'+meta+'</div>':'')+'</div>';
  return '<div class="post-card'+(newest?' featured':'')+'">'+head+media+bodyExtra+fileLinks+'</div>';
}

const BATCH=3;   // 처음 3개, 스크롤 시 3개씩 추가

function render(posts){
  const list=document.getElementById('list');
  const items=(posts||[]).filter(p=>p.category===cur);
  // 날짜 최신순 정렬 (날짜 없으면 작성시각 보조)
  items.sort(function(a,b){
    var ka=(a.date||a.created||''), kb=(b.date||b.created||'');
    if(ka!==kb) return kb.localeCompare(ka);
    return (b.created||'').localeCompare(a.created||'');
  });
  if(!items.length){
    list.innerHTML='<div class="empty"><div class="ic">'+fileIcon+'</div><h3>아직 등록된 글이 없습니다</h3><p>노션에 글을 올리고 \u201C공개\u201D를 체크한 뒤 사이트를 다시 배포하면<br>이곳에 자동으로 나타납니다.</p></div>';
    return;
  }

  let shown=0;
  list.innerHTML='';
  // 스크롤 감지용 센티넬
  const sentinel=document.createElement('div');
  sentinel.style.height='1px';
  list.after(sentinel);

  function appendBatch(){
    const slice=items.slice(shown, shown+BATCH);
    list.insertAdjacentHTML('beforeend', slice.map((p,k)=>cardHTML(p, shown+k)).join(''));
    shown+=slice.length;
  }
  function topUp(){
    // 센티넬이 화면 근처에 보이는 동안 계속 채움 (짧은 화면 대비)
    while(shown<items.length && sentinel.getBoundingClientRect().top <= window.innerHeight+300){
      appendBatch();
    }
    if(shown>=items.length){ obs.disconnect(); sentinel.remove(); }
  }
  const obs=new IntersectionObserver(function(es){ if(es[0].isIntersecting) topUp(); }, {rootMargin:'300px'});
  obs.observe(sentinel);

  appendBatch();   // 최초 3개만 표시 (스크롤하면 3개씩 더)
}

// 유튜브 영상 → 게시판 글로 자동 변환 (설교/찬양). 노션 입력 없이 자동 목록화.
//  - 제목에 '목사/설교/주일예배/말씀' → 설교, '찬양대/특송/찬양' → 찬양 (그 외 영상은 제외)
//  - 노션에 이미 같은 영상을 올린 경우엔 중복 방지(노션 글 우선)
function ytPosts(ytData, notionPosts){
  const vids=(ytData && ytData.videos)||[];
  const taken={};
  (notionPosts||[]).forEach(function(p){ const id=findYt(p); if(id) taken[id]=1; });
  const isSermon=function(t){ return /목사|설교|주일\s*예배|말씀/.test(t||''); };
  const isPraise=function(t){ return /찬양대|특송|찬양/.test(t||''); };
  const out=[];
  vids.forEach(function(v){
    if(!v.id || taken[v.id]) return;
    let cat=null;
    if(isSermon(v.title)) cat='설교';
    else if(isPraise(v.title)) cat='찬양';
    else return;
    out.push({ category:cat, title:v.title, date:v.date||'',
               url:'https://www.youtube.com/watch?v='+v.id, content:'', attachments:[], _auto:true });
  });
  return out;
}

// 노션 게시판(board-data.json) + 유튜브 자동목록(youtube-data.json)을 함께 읽어 렌더.
Promise.all([
  fetch('board-data.json?t='+Date.now(),{cache:'no-store'}).then(function(r){return r.ok?r.json():[];}).catch(function(){return [];}),
  fetch('youtube-data.json?t='+Date.now(),{cache:'no-store'}).then(function(r){return r.ok?r.json():null;}).catch(function(){return null;})
]).then(function(res){
  const notion = Array.isArray(res[0]) ? res[0] : ((res[0]&&res[0].posts)||[]);
  render(notion.concat(ytPosts(res[1], notion)));
});
</script>
