<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>온세대 예배 · 진중교회</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@600;700&display=swap">
<style>
  :root{--bg:#f7f5f0;--paper:#fff;--ink:#1f2a2b;--muted:#6b756f;--line:#e3ded3;--soft:#f0ece4;--accent:#2f6b6f;--accent-soft:#e3eeee;--warn:#b5451b;--warn-soft:#fbe9e0;--lyr-bg:#e3eeee;--lyr-ink:#2f6b6f;--lyr-line:#c3dada;--scr-bg:#f6ecdc;--scr-ink:#8a5a1c;--scr-line:#e6d2b0;--rd-bg:#ece8f4;--rd-ink:#5b4a86;--rd-line:#d6cfe6;--fs:16px;
    --sans:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;--serif:'Noto Serif KR','Apple Myungjo',serif}
  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#15191a;--paper:#1d2324;--ink:#ece7dc;--muted:#9aa5a3;--line:#2f3739;--soft:#242c2d;--accent:#7fc2c5;--accent-soft:#1f2f30;--warn:#f0a074;--warn-soft:#362820;--lyr-bg:#1f3031;--lyr-ink:#8fcdd0;--lyr-line:#2f4a4b;--scr-bg:#33291c;--scr-ink:#e2b879;--scr-line:#4d3d27;--rd-bg:#2a2536;--rd-ink:#c3b4ea;--rd-line:#3f3752}}
  :root[data-theme="dark"]{--bg:#15191a;--paper:#1d2324;--ink:#ece7dc;--muted:#9aa5a3;--line:#2f3739;--soft:#242c2d;--accent:#7fc2c5;--accent-soft:#1f2f30;--warn:#f0a074;--warn-soft:#362820;--lyr-bg:#1f3031;--lyr-ink:#8fcdd0;--lyr-line:#2f4a4b;--scr-bg:#33291c;--scr-ink:#e2b879;--scr-line:#4d3d27;--rd-bg:#2a2536;--rd-ink:#c3b4ea;--rd-line:#3f3752}
  html,body{background:var(--bg);color:var(--ink)} body{margin:0;font-family:var(--sans);font-size:var(--fs);line-height:1.7;-webkit-font-smoothing:antialiased}
  body.big{--fs:19px}
  a{color:var(--accent)} a:hover{color:var(--ink)}
  .wrap{max-width:680px;margin:0 auto;padding-block:0 72px;padding-inline:18px}
  .cover{padding-block:26px 18px;display:flex;flex-direction:column;gap:10px}
  .cover .row{display:flex;justify-content:space-between;align-items:center;gap:12px}
  .cover img.logo{height:46px;width:auto;max-width:62%} .cover .logolink{display:inline-flex;max-width:62%} .cover .logos{display:inline-flex;max-width:62%} .cover .logos img.logo{max-width:100%} .cover img.logo-dark{display:none} @media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .cover img.logo-light{display:none} :root:not([data-theme="light"]) .cover img.logo-dark{display:inline-block}} :root[data-theme="dark"] .cover img.logo-light{display:none} :root[data-theme="dark"] .cover img.logo-dark{display:inline-block} .cover .no{font-size:12px;color:var(--muted);text-align:right;line-height:1.4}
  .cover h1{font-family:var(--serif);font-size:1.5em;margin:0;line-height:1.3} .cover .date{color:var(--muted);font-size:.9em}
  .motto{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 16px;font-size:.95em;text-align:center}
  .motto b{font-family:var(--serif);font-size:1.05em}
  .motto small{color:var(--muted);display:block;margin-top:2px}
  .tools{display:flex;justify-content:flex-end;gap:8px}
  .tbtn{appearance:none;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;min-height:36px;padding:0 14px;font:inherit;font-size:.85em;cursor:pointer}
  .tbtn[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}

  .nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px 10px;border-bottom:1px solid var(--line);display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
  .nav::-webkit-scrollbar{display:none}
  .nav a{flex:none;text-decoration:none;color:var(--muted);border:1.5px solid var(--line);background:var(--paper);border-radius:999px;min-height:38px;display:inline-flex;align-items:center;padding:0 14px;font-size:.9em;font-weight:500}
  .nav a.on{color:var(--accent);border-color:var(--accent);background:var(--accent-soft);font-weight:700}

  section{padding-block:26px 6px;scroll-margin-top:72px}
  .sdate{color:var(--ink);font-weight:700;font-size:.95em;margin-bottom:2px}
  h2{font-size:1.15em;margin:0 0 12px;display:flex;align-items:center;gap:10px}
  h2 small{font-size:.75em;color:var(--muted);font-weight:500}
  .card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
  .card h3{margin:0;font-size:1em;font-weight:700} .card h3 small{color:var(--muted);font-weight:500;font-size:.85em;margin-left:6px}

  .order{margin:0;padding:0;list-style:none;display:flex;flex-direction:column}
  .order li{display:grid;grid-template-columns:5.2em minmax(0,1fr);gap:10px;padding:9px 0;border-top:1px solid var(--line)}
  .order li:first-child{border-top:0}
  .order .k{color:var(--muted);font-size:.92em;padding-top:2px}
  .order .v{min-width:0} .order .v b{font-weight:700} .order .v .who{color:var(--muted);font-size:.9em} .order .v b.ref{font-size:.9em;color:var(--ink);white-space:nowrap}
  .order .v .parts{display:flex;flex-direction:column;gap:2px;font-size:.92em}
  .order .v .parts span b{font-weight:500;color:var(--muted);margin-right:6px}
  .hymn{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 8px} .hymn .n{font-weight:700;color:var(--accent);white-space:nowrap} .hymn a{white-space:nowrap}
  .hymn a{font-size:.85em;text-decoration:none;border:1px dashed var(--line);border-radius:6px;padding:0 6px;color:var(--muted)}
  .hymn a:hover,.hymn button:hover{color:var(--accent);border-color:var(--accent)}
  .hymn button{appearance:none;font:inherit;font-size:.85em;background:var(--paper);border:1px dashed var(--line);border-radius:6px;padding:0 6px;color:var(--muted);cursor:pointer;white-space:nowrap;min-height:26px}
  .hymn button[aria-expanded="true"]{color:var(--accent);border-color:var(--accent);border-style:solid}
  .hymn button[data-kind="lyrics"]{background:var(--lyr-bg);color:var(--lyr-ink);border:1px solid var(--lyr-line);font-weight:600}
  .hymn button[data-kind="score"]{background:var(--scr-bg);color:var(--scr-ink);border:1px solid var(--scr-line);font-weight:600}
  .hymn button[data-kind="lyrics"][aria-expanded="true"]{background:var(--lyr-ink);color:var(--paper);border-color:var(--lyr-ink)}
  .hymn button[data-kind="score"][aria-expanded="true"]{background:var(--scr-ink);color:var(--paper);border-color:var(--scr-ink)}
  button[data-kind="reading"]{background:var(--rd-bg);color:var(--rd-ink);border:1px solid var(--rd-line);border-style:solid;font-weight:600}
  button[data-kind="reading"][aria-expanded="true"]{background:var(--rd-ink);color:var(--paper);border-color:var(--rd-ink)}
  .hymn-body{grid-column:1 / -1;margin-top:8px;background:var(--soft);border-radius:10px;padding:12px 14px} .hymn-body .scripture{background:transparent;padding:0}
  .hymn-body .verse{white-space:pre-line;font-size:.95em;line-height:1.75;margin:0 0 .7em} .hymn-body .verse:last-child{margin:0}
  .hymn-body .vn{color:var(--accent);font-weight:700;margin-right:6px}
  .hymn-body img{max-width:100%;display:block;border-radius:6px;background:#fff}
  .hymn-body .src{display:block;font-size:.75em;color:var(--muted);margin-top:6px;text-align:right}

  .reading{display:flex;flex-direction:column;gap:6px;font-size:.98em;line-height:1.7}
  .reading .rd-title{font-weight:700;margin-bottom:4px} .reading .rd-title small{color:var(--muted);font-weight:500}
  .reading .rd{display:grid;grid-template-columns:3.4em minmax(0,1fr);gap:8px} .reading .rd .role{color:var(--muted);font-size:.85em;padding-top:2px}
  .reading .rd.all{font-weight:700} .reading .rd.all .role{font-weight:500}
  .reading .src{display:block;font-size:.75em;color:var(--muted);text-align:right;margin-top:4px}
  .scripture{background:var(--soft);border-radius:12px;padding:14px 16px;font-family:var(--serif);font-size:1.02em;line-height:1.95}
  .scripture .v{font-family:var(--sans);font-size:.65em;font-weight:700;color:var(--accent);vertical-align:super;margin-right:3px}
  .scripture .src{display:block;text-align:right;font-family:var(--sans);font-size:.75em;color:var(--muted);margin-top:8px}
  .sermon-title{font-family:var(--serif);font-size:1.3em;font-weight:700;line-height:1.35}
  .summary p{margin:0 0 .8em} .summary p:last-child{margin:0}
  .qs{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
  .qs li{display:grid;grid-template-columns:26px minmax(0,1fr);gap:6px}
  .qs .n{width:24px;height:24px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-size:.75em;font-weight:700;display:inline-flex;align-items:center;justify-content:center;margin-top:4px}

  .news{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:12px}
  .news li{padding-left:14px;position:relative} .news li::before{content:"";position:absolute;left:0;top:.72em;width:6px;height:6px;border-radius:50%;background:var(--accent)}
  .news li b{font-weight:700} .news .sub{color:var(--muted);font-size:.92em;display:block}
  .news li.hot{background:var(--accent-soft);border-radius:10px;padding:10px 12px 10px 26px} .news li.hot::before{left:12px;top:1.35em}
  .tag{font-size:.75em;padding:2px 8px;border-radius:6px;background:var(--accent-soft);color:var(--accent);font-weight:600;vertical-align:middle;margin-left:4px}

  table{width:100%;border-collapse:collapse;font-size:.92em} th,td{text-align:left;padding:7px 6px;border-top:1px solid var(--line);vertical-align:top} th{color:var(--muted);font-weight:500;border-top:0;font-size:.85em}
  td:first-child,th:first-child{padding-left:0} .tw{overflow-x:auto}
  .tnum{font-variant-numeric:tabular-nums} td.span{vertical-align:middle;border-left:1px solid var(--line);padding-left:10px;color:var(--muted);line-height:1.5}
  table.servers th,table.servers td{white-space:nowrap;text-align:center;padding-left:8px;padding-right:8px} table.servers{min-width:100%;width:max-content}
  table.servers td.span{color:var(--ink)}
  table.dawn td:nth-child(-n+3),table.dawn th{white-space:nowrap}
  .pray{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px} .pray li{padding-left:14px;position:relative} .pray li::before{content:"•";position:absolute;left:0;color:var(--accent)}
  .numbered{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px;counter-reset:n} .numbered li{padding-left:22px;position:relative;counter-increment:n} .numbered li::before{content:counter(n) ".";position:absolute;left:0;color:var(--accent);font-weight:700;font-variant-numeric:tabular-nums}
  .grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;font-size:.95em} .kv b{color:var(--muted);font-weight:500}
  .kv strong{font-weight:700} .kv strong.ref{font-size:.9em;color:var(--ink);white-space:nowrap} .kv .who2{display:block;color:var(--muted);font-size:.9em}
  .qr{display:flex;gap:14px;align-items:center} .qr img{width:96px;height:96px;border-radius:8px;border:1px solid var(--line)}
  .foot{margin-top:36px;font-size:.8em;color:var(--muted);text-align:center;line-height:1.7}
  .card.res{background:linear-gradient(160deg,var(--accent-soft),var(--paper) 90%);border-color:var(--accent);gap:8px}
  .card.res h3{color:var(--accent)} .card.res h3 small{color:var(--muted)}
  .res-list{display:flex;flex-direction:column;gap:8px}
  .res-list a{display:grid;grid-template-columns:44px minmax(0,1fr) auto;align-items:center;gap:12px;text-decoration:none;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 14px;min-height:56px}
  .res-list a:hover{border-color:var(--accent)}
  .res-list .ico{font-size:26px;line-height:1;text-align:center} .res-list .t{font-weight:700} .res-list .s{display:block;color:var(--muted);font-size:.85em;font-weight:400}
  .res-list .go{color:var(--accent);font-weight:700}
  .muted{color:var(--muted)}
  @media (max-width:480px){.grid2{grid-template-columns:1fr}.order li{grid-template-columns:4.6em minmax(0,1fr)}}
  @media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
</style>

: "역대상 16:28–29", "source": "개역개정", "verses": [{"v": 28, "text": "여러 나라의 종족들아 영광과 권능을 여호와께 돌릴지어다 여호와께 돌릴지어다"}, {"v": 29, "text": "여호와의 이름에 합당한 영광을 그에게 돌릴지어다 제물을 들고 그 앞에 들어갈지어다 아름답고 거룩한 것으로 여호와께 경배할지어다"}]}}, {"label": "신앙고백", "text": "사도신경"}, {"label": "경배찬양", "text": "슬픈 마음 있는 사람 · 예수 열방의 소망 · 저 바다보다 더 넓고 · 천국은 마치 · 함께 지어져 가네", "note": "다같이"}, {"label": "기도", "text": "김기석 집사"}, {"label": "찬송", "hymn": 516}, {"label": "봉헌", "text": "다같이"}, {"label": "교회소식", "text": "인도자"}, {"label": "축하", "text": "생일 축하", "note": "다같이"}, {"label": "성도교제", "text": "사랑하는 자여"}, {"label": "설교", "kind": "sermon"}, {"label": "찬양", "text": "지금 우리가", "note": "다같이"}, {"label": "축도", "text": "안창진 목사"}], "praise": [], "praise_note": null, "sermon": {"title": "“함께 지어져 가느니라”", "ref": "에베소서 2:20–22", "passage_ref": "엡 2:20-22", "passage": {"ref": "엡 2:20-22", "label": "에베소서 2:20–22", "source": "개역개정", "verses": [{"v": 20, "text": "너희는 사도들과 선지자들의 터 위에 세우심을 입은 자라 그리스도 예수께서 친히 모퉁잇돌이 되셨느니라"}, {"v": 21, "text": "그의 안에서 건물마다 서로 연결하여 주 안에서 성전이 되어 가고"}, {"v": 22, "text": "너희도 성령 안에서 하나님이 거하실 처소가 되기 위하여 그리스도 예수 안에서 함께 지어져 가느니라"}]}, "preacher": "안창진 목사", "summary": ["이어령 교수는 나다움을 벽돌담과 돌담으로 설명합니다. 벽돌은 같은 규격으로 대체할 수 있지만, 돌멩이는 똑같이 생긴 것이 없습니다. 제주도 돌담은 서로 다른 돌이 맞물려 태풍에도 무너지지 않습니다.", "교회다움은 무엇일까요? 바울은 “예수 안에서 함께 지어져 가느니라”(22) 말합니다. 교회의 크기나 사업의 양이 교회다움을 말하지 않습니다. 예수님을 빼면 교회라 부를 수 없습니다.", "어려운 대목은 ‘함께’입니다. 우리는 벽돌처럼 똑같이 만들어지지 않았습니다. 생각도 성격도 은사도 다릅니다. 바울과 바나바도 생각이 달라 다투었습니다. 에베소교회는 유대인과 이방인이 함께 예배했습니다. 서로 말도 섞지 않던 사람들입니다.", "그런데도 교회가 함께 지어져 가는 이유는 예수님이 모퉁잇돌이시기 때문입니다(20). 모퉁잇돌이 건물의 방향과 기준을 정합니다. 우리 생각이 기준이면 교회는 동호회와 다르지 않습니다.", "성경은 우리의 노력만 말하지 않습니다. 하나님께서 지으십니다. 우리는 돌 하나입니다. 하나님께서 우리의 자리를 아시고, 성령 안에서 우리를 한 성전으로 이어 가십니다.", "교회는 완성된 채로 주어지지 않았습니다. 하나님께서 영광스러운 교회로 세워 가십니다(5:27). 모자람이 보여도 그것이 교회의 마지막 모습이 아닙니다. 예수님 안에서 함께 지어져 가는 성도가 되시기 바랍니다."], "questions": ["교회의 모퉁잇돌은 누구인가요?(20)", "교회는 예수 안에서 함께 지어져 갑니다. 이 일은 누가 이루어 가시나요?(22)", "내가 생각하는 교회다움은 무엇이며, 그것을 위해 내가 할 수 있는 일은 무엇인가요?", "오늘 말씀을 통해 받은 은혜나 새롭게 깨달은 것은 무엇입니까?"]}, "li const LYR = DATA.hymn_lyrics || {}, SCR = DATA.hymn_scores || {};
const hymn = (n, id) => {
  if(!n) return ""; const t = HYMNS[String(n)] || ""; const url = DATA.hymn_link ? hymnUrl(n) : "";
  const ext = url ? `<a href="${url}" target="_blank" rel="noopener">${esc(DATA.hymn_link_label||"악보·가사 보기")}</a>` : "";
  const bL = LYR[String(n)] ? `<button data-h="${id}" data-kind="lyrics" aria-expanded="false">가사</button>` : "";
  const bS = SCR[String(n)] ? `<button data-h="${id}" data-kind="score" aria-expanded="false">악보</button>` : (url ? `<a href="${url}" target="_blank" rel="noopener">악보</a>` : "");
  return `<span class="hymn"><span class="n">${n}장</span><span>${esc(t)}</span>${bL}${bS}${(bL||bS)?"":ext}</span>`;
};
const readingBody = r => { const rows = r.lines.map((t,i)=>{ let role = i%2===0 ? "인도자" : "회중"; let txt=t; if (/^\(다같이\)/.test(t)) { role="다같이"; txt=t.replace(/^\(다같이\)\s*/,""); } return `<div class="rd ${role==="인도자"?"":"all"}"><span class="role">${role}</span><span>${esc(txt)}</span></div>`; }).join(""); return `<div class="reading"><div class="rd-title">교독문 ${r.no} · ${esc(r.title)}${r.ref?` <small>(${esc(r.ref)})</small>`:""}</div>${rows}<span class="src">21세기 찬송가 교독문</span></div>`; };
const passageBody = p => `<div class="scripture" style="font-size:.98em"><p style="margin:0">${p.verses.map(v=>`<span class="v">${v.v}</span>${esc(v.text)} `).join("")}</p><span class="src">${esc(p.source==="개역개정"?"성경전서 개역개정판 © 대한성서공회":p.source)}</span></div>`;
const hymnBody = (n, kind) => {
  if (kind === "lyrics") { const v = LYR[String(n)] || []; return v.map((x,i)=>`<p class="verse"><span class="vn">${i+1}</span>${esc(x)}</p>`).join("") + `<span class="src">${esc(DATA.hymn_notice||"")}</span>`; }
  return `<img src="${SCR[String(n)]}" alt="${n}장 악보"><span class="src">${esc(DATA.hymn_notice||"")}</span>`;
};
const parts = arr => arr && arr.length ? `<div class="parts">${arr.map(p=>`<span><b>${esc(p.part)}</b>${esc(p.name)}</span>`).join("")}</div>` : "";

function orderItem(it, idx){
  let v = "";
  if (it.hymn) v = hymn(it.hymn, "h"+idx) + (it.note ? ` <span class="who">${esc(it.note)}</span>` : "");
  else if (it.kind === "responsive") { v = `<b>${esc(it.ref)}</b>` + (it.note ? ` <span class="who">${esc(it.note)}</span>` : ""); if (it.reading_data || (it.passage && it.passage.verses)) v = `<span class="hymn">${v}<button data-kind="${it.reading_data?"reading":"passage"}" aria-expanded="false">보기</button></span>`; }
  else if (it.kind === "sermon") v = `<b>${esc(DATA.sermon.title)}</b> <b class="ref">(${esc(DATA.sermon.ref)})</b>${DATA.sermon.preacher ? `<div class="who">${esc(DATA.sermon.preacher)}</div>` : ""}`;
  else { v = (it.text ? `<b>${esc(it.text)}</b>` : "") + (it.note ? ` <span class="who">${esc(it.note)}</span>` : ""); if (it.lyrics && it.lyrics.length) v = `<span class="hymn">${v}<button data-kind="text" aria-expanded="false">가사</button></span>`; }
  return `<li data-n="${it.hymn||""}" data-i="${idx}"><span class="k">${esc(it.label)}</span><span class="v">${v}${parts(it.parts)}</span></li>`;
}

function render(){
  const d = DATA; const s = d.sermon; const sec = [];
  // 표지
  let cover = `<header class="cover">
    <div class="row">${d.logo ? `${(l => d.web ? `<a class="logolink" href="${esc(d.web)}" aria-label="${esc(d.church)} 홈페이지">${l}</a>` : l)(`${d.logo_dark ? `<span class="logos"><img class="logo logo-light" src="${d.logo}" alt="${esc(d.church)}"><img class="logo logo-dark" src="${d.logo_dark}" alt="${esc(d.church)}"></span>` : `<img class="logo" src="${d.logo}" alt="${esc(d.church)}">`}`)}` : `<b>${esc(d.church)}</b>`}<div class="no">${esc(d.issue||"")}<br>${d.founded ? "교회설립 "+esc(d.founded) : ""}</div></div>
        ${d.motto ? `<div class="motto"><b>${esc(d.motto.text)}</b><small>${esc(d.motto.ref||"")}</small></div>` : ""}
    <div class="tools"><button class="tbtn" id="big" aria-pressed="false">글자 크게</button></div>
  </header>`;
  const tabs = [["order","예배 순서"],["word","말씀 나눔"],["devotion","말씀묵상"],["week","예배와 기도"],["news","교회소식"]].filter(t=>t[0]!=="devotion"||(d.links&&d.links.length));
  let nav = `<nav class="nav" id="nav">${tabs.map(([id,l],i)=>`<a href="#${id}" class="${i===0?"on":""}">${l}</a>`).join("")}</nav>`;

  // 1 예배 순서
  let order = `<section id="order"><div class="sdate">${esc(d.date)}</div><h2>${esc(d.title)} 순서 <small>${esc(d.services||"")}</small></h2><div class="card"><ol class="order">${d.order.map((it,i)=>orderItem(it,i)).join("")}</ol></div>`;
  if (s.passage && s.passage.verses) order += `<div class="card"><h3>설교 본문 <small>${esc(s.passage.label)}</small></h3><div class="scripture"><p style="margin:0">${s.passage.verses.map(v=>`<span class="v">${v.v}</span>${esc(v.text)} `).join("")}</p><span class="src">${esc(s.passage.source==="개역개정"?"성경전서 개역개정판 © 대한성서공회":s.passage.source)}</span></div></div>`;
  if (d.praise && d.praise.length) order += `<div class="card"><h3>찬양 <small>${esc(d.praise_note||"")}</small></h3><div>${d.praise.map(esc).join(" · ")}</div></div>`;
  order += `</section>`;

  // 2 말씀 나눔
  let word = `<section id="word"><h2>말씀 나눔 <small>구역·가정에서</small></h2><div class="card"><div class="sermon-title">${esc(s.title)}</div><div class="muted">${esc(s.ref)}</div>
    <div class="summary">${(s.summary||[]).map(p=>`<p>${rich(p)}</p>`).join("")}</div></div>`;
  if (s.questions && s.questions.length) word += `<div class="card"><h3>나눔 질문</h3><ol class="qs">${s.questions.map((q,i)=>`<li><span class="n">${i+1}</span><span>${rich(q)}</span></li>`).join("")}</ol></div>`;
  const ICON = l => l.icon || (/QT|묵상/.test(l.label) ? "🌿" : /카드/.test(l.label) ? "🖼️" : /가정/.test(l.label) ? "🏠" : "📎");
  word += `</section>`;

  // 2.5 말씀묵상
  let devo = "";
  if (d.links && d.links.length) devo = `<section id="devotion"><h2>이번 주 말씀 묵상 <small>${esc(d.links_note||"눌러서 열어 보세요")}</small></h2><div class="card res"><div class="res-list">${d.links.map(l=>`<a href="${l.url||"#"}" ${l.url?'target="_blank" rel="noopener"':""}><span class="ico">${ICON(l)}</span><span><span class="t">${esc(l.label)}</span>${l.sub?`<span class="s">${esc(l.sub)}</span>`:""}</span><span class="go">${l.url?"열기 →":"준비 중"}</span></a>`).join("")}</div></div></section>`;

  // 3 예배와 기도
  let week = `<section id="week"><h2>예배와 기도</h2>`;
  if (d.wednesday) week += `<div class="card"><h3>수요기도회 <small>${esc(d.wednesday.time||"")}</small></h3><div class="kv">${d.wednesday.items.map(i=> i.title
      ? `<b>${esc(i.k)}</b><span><strong>${esc(i.title)}</strong>${i.ref?` <strong class="ref">(${esc(i.ref)})</strong>`:""}${i.who?`<span class="who2">${esc(i.who)}</span>`:""}</span>`
      : `<b>${esc(i.k)}</b><span>${rich(i.v)}</span>`).join("")}</div>${d.wednesday.passage&&d.wednesday.passage.verses?`<div class="scripture" style="font-size:.98em"><p style="margin:0">${d.wednesday.passage.verses.map(v=>`<span class="v">${v.v}</span>${esc(v.text)} `).join("")}</p><span class="src">${esc(d.wednesday.passage.source==="개역개정"?"성경전서 개역개정판 © 대한성서공회":d.wednesday.passage.source)}</span></div>`:""}</div>`;
  if (d.dawn && d.dawn.length) week += `<div class="card"><h3>새벽기도회 <small>${esc(d.dawn_time||"")}</small></h3><div class="tw"><table class="dawn"><tr><th>날짜</th><th>찬송</th><th>말씀</th><th>기도 제목</th></tr>${d.dawn.map(r=>`<tr><td class="tnum">${esc(r.date)} ${esc(r.dow)}</td><td class="tnum">${r.hymn?esc(r.hymn)+"장":""}</td><td>${esc(r.text)}</td><td class="muted">${esc(r.pray)}</td></tr>`).join("")}</table></div></div>`;
  if (d.servers && d.servers.length) {
    const span = new Set((d.servers_rowspan||[]).map(c => d.servers_cols.indexOf(c)).filter(i=>i>=0));
    const rows = d.servers.map((r,ri)=>`<tr>${r.map((c,i)=>{ if (span.has(i)) return ri===0 ? `<td rowspan="${d.servers.length}" class="span">${esc(c).split(/\s+/).join("<br>")}</td>` : ""; return `<td class="${i===0?"tnum":""}">${esc(c)}</td>`; }).join("")}</tr>`).join("");
    week += `<div class="card"><h3>예배·봉사위원 <small>옆으로 밀어 보세요</small></h3><div class="tw"><table class="servers"><tr>${d.servers_cols.map(c=>`<th>${esc(c)}</th>`).join("")}</tr>${rows}</table></div></div>`;
  }
  if (d.districts && d.districts.length) week += `<div class="card"><h3>구역모임 <small>${esc(d.districts_note||"")}</small></h3><div class="tw"><table><tr><th>구역</th><th>인도</th><th>시간·장소</th></tr>${d.districts.map(r=>`<tr><td class="tnum">${esc(r.no)}</td><td>${esc(r.leader)}</td><td class="muted">${esc(r.where||"")}</td></tr>`).join("")}</table></div></div>`;
  if (d.offering_note) week += `<div class="card"><h3>향기로운 예물</h3><div class="muted">${rich(d.offering_note)}</div></div>`;
  week += `</section>`;

  // 4 교회소식
  let news = `<section id="news"><h2>교회소식</h2>`;
  if (d.welcome) news += `<div class="card"><div>${rich(d.welcome)}</div></div>`;
  news += `<div class="card"><ul class="news">${d.news.map(n=>`<li class="${n.hot?"hot":""}"><b>${esc(n.title)}</b>${n.when?` <span class="muted">– ${esc(n.when)}</span>`:""}${n.tag?`<span class="tag">${esc(n.tag)}</span>`:""}${n.sub?`<span class="sub">${rich(n.sub)}</span>`:""}</li>`).join("")}</ul></div>`;
  if (d.giving) news += `<div class="card"><h3>온라인 헌금</h3><div class="kv"><b>${esc(d.giving.bank)}</b><span><button class="copy tnum" id="copyAcct" data-acct="${esc(d.giving.account.replace(/[^0-9-]/g,""))}">${esc(d.giving.account)} <small>복사</small></button>${d.giving.holder?` <span class="muted">${esc(d.giving.holder)}</span>`:""}</span><b>표기</b><span>${esc(d.giving.how)}</span></div>${d.giving.pay_links&&d.giving.pay_links.length?`<div class="cta">${d.giving.pay_links.map(l=>`<a href="${l.url}" target="_blank" rel="noopener">${esc(l.label)}</a>`).join("")}</div>`:""}<div class="muted" style="font-size:.85em">계좌번호를 누르면 복사됩니다. 은행 앱에서 붙여 넣어 송금하세요.</div></div>`;
  if (d.prayers && d.prayers.length) news += `<div class="card"><h3>공동기도제목</h3><ol class="numbered">${d.prayers.map(p=>`<li>${esc(p)}</li>`).join("")}</ol></div>`;
  news += `<div class="grid2">`;
  if (d.calendar && d.calendar.length) news += `<div class="card"><h3>${esc(d.calendar_title||"목회일정")}</h3><div class="kv">${d.calendar.map(c=>`<b class="tnum">${esc(c.d)}</b><span>${esc(c.t)}</span>`).join("")}</div></div>`;
  if (d.missions && d.missions.length) news += `<div class="card"><h3>협력선교</h3><ul class="pray">${d.missions.map(m=>`<li>${esc(m)}</li>`).join("")}</ul></div>`;
  news += `</div>`;
  if (d.qr) news += `<div class="card"><div class="qr"><img src="${d.qr.image}" alt="${esc(d.qr.label)}"><div><b>${esc(d.qr.label)}</b><div class="muted">${esc(d.qr.note||"")}</div>${d.qr.url?`<div><a href="${d.qr.url}">바로 열기 →</a></div>`:""}</div></div></div>`;
  if (d.staff && d.staff.length) news += `<div class="card"><h3>섬김이</h3><div class="muted">${d.staff.map(esc).join(" · ")}</div></div>`;
  if (d.vision && d.vision.length) news += `<div class="card"><h3>목회 비전</h3><ul class="pray">${d.vision.map(v=>`<li>${esc(v)}</li>`).join("")}</ul></div>`;
  if (d.times && d.times.length) news += `<div class="card"><h3>예배 시간</h3><div class="kv">${d.times.map(t=>`<b>${esc(t.k)}</b><span>${esc(t.v)}</span>`).join("")}</div></div>`;
  news += `<div class="foot">${esc(d.church)}${d.address?" · "+esc(d.address):""}${d.phone?" · "+esc(d.phone):""}${d.web?`<br><a href="${d.web}">${esc(d.web.replace(/^https?:\/\//,""))}</a>`:""}</div></section>`;

  document.getElementById("app").innerHTML = cover + nav + order + word + devo + week + news;
  document.title = d.title + " · " + d.church;

  document.querySelector(".order").addEventListener("click", e => {
    const b = e.target.closest("button[data-kind]"); if (!b) return;
    const li = b.closest("li"); const n = li.dataset.n; const kind = b.dataset.kind;
    const open = b.getAttribute("aria-expanded") === "true";
    li.querySelectorAll("button[data-kind]").forEach(x => x.setAttribute("aria-expanded","false"));
    li.querySelector(".hymn-body")?.remove();
    if (!open) { b.setAttribute("aria-expanded","true"); const div = document.createElement("div"); div.className = "hymn-body"; div.innerHTML = kind === "passage" ? passageBody(DATA.order[+li.dataset.i].passage) : kind === "reading" ? readingBody(DATA.order[+li.dataset.i].reading_data) : kind === "text" ? DATA.order[+li.dataset.i].lyrics.map(x=>`<p class="verse">${esc(x)}</p>`).join("") : hymnBody(n, kind); li.appendChild(div); }
  });
  const ca = document.getElementById("copyAcct");
  if (ca) ca.addEventListener("click", async () => { const t = ca.dataset.acct; try { await navigator.clipboard.writeText(t); } catch(e) { const ta=document.createElement("textarea"); ta.value=t; document.body.appendChild(ta); ta.select(); try{document.execCommand("copy")}catch(_){}; ta.remove(); } const sm = ca.querySelector("small"); sm.textContent="복사됨 ✓"; ca.classList.add("done"); setTimeout(()=>{sm.textContent="복사"; ca.classList.remove("done")}, 1800); });
  const big = document.getElementById("big");
  const setBig = on => { document.body.classList.toggle("big", on); big.setAttribute("aria-pressed", on); try{localStorage.setItem("bulletin-big", on?"1":"0")}catch(e){} };
  try{ setBig(localStorage.getItem("bulletin-big")==="1"); }catch(e){}
  big.addEventListener("click", () => setBig(!document.body.classList.contains("big")));
  const links=[...document.querySelectorAll("#nav a")]; const secs=tabs.map(t=>document.getElementById(t[0]));
  const io = new IntersectionObserver(es => { es.forEach(e => { if (e.isIntersecting) links.forEach(a => a.classList.toggle("on", a.getAttribute("href")==="#"+e.target.id)); }); }, {rootMargin:"-40% 0px -55% 0px"});
  secs.forEach(s=>io.observe(s));
}
render();
</script>

</body>
</html>
