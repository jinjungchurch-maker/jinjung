<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>낮은 데서 드리는 감사</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@500;700&display=swap">
<style>
  :root {
    --bg: #f9f7f2; --paper: #ffffff; --ink: #1e2a2b; --muted: #66716f; --line: #e4dfd4; --soft: #f1ede4;
    --a-adult: #2f6b6f; --a-youth: #4b5ea8; --a-kids: #c9612e;
    --a-adult-soft: #e6f0f0; --a-youth-soft: #e9ecf8; --a-kids-soft: #fbeae0;
    --sans: 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    --serif: 'Noto Serif KR', 'Apple Myungjo', 'Batang', serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #15191a; --paper: #1d2324; --ink: #ece7dc; --muted: #9aa5a3; --line: #2f3739; --soft: #242c2d;
      --a-adult: #7fc2c5; --a-youth: #a4b0ee; --a-kids: #f0a074;
      --a-adult-soft: #1f2f30; --a-youth-soft: #23283b; --a-kids-soft: #362820;
    }
  }
  :root[data-theme="dark"] {
    --bg: #15191a; --paper: #1d2324; --ink: #ece7dc; --muted: #9aa5a3; --line: #2f3739; --soft: #242c2d;
    --a-adult: #7fc2c5; --a-youth: #a4b0ee; --a-kids: #f0a074;
    --a-adult-soft: #1f2f30; --a-youth-soft: #23283b; --a-kids-soft: #362820;
  }
  html, body { background: var(--bg); color: var(--ink); }
  body { margin: 0; font-family: var(--sans); font-size: 16px; line-height: 1.75; -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 720px; margin: 0 auto; padding-block: 0 64px; padding-inline: 18px; }
  .top { padding-block: 26px 14px; display: flex; flex-direction: column; gap: 6px; }
  .top .eyebrow { font-size: 12px; letter-spacing: .12em; color: var(--muted); font-weight: 500; }
  .top h1 { font-family: var(--serif); font-size: 24px; font-weight: 700; margin: 0; line-height: 1.3; text-wrap: balance; }
  .top .sermon { font-size: 14px; color: var(--muted); }
  .top .sermon b { color: var(--ink); font-weight: 500; }

  .sticky { position: sticky; top: env(safe-area-inset-top, 0px); background: var(--bg); z-index: 5; padding-block: 10px 12px; display: flex; flex-direction: column; gap: 10px; border-bottom: 1px solid var(--line); }
  .seg { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0; border: 1.5px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--paper); }
  .seg button { appearance: none; border: 0; background: transparent; color: var(--muted); font: inherit; font-size: 15px; font-weight: 500; min-height: 44px; cursor: pointer; }
  .seg button + button { border-left: 1.5px solid var(--line); }
  .seg button[aria-selected="true"] { color: #fff; background: var(--accent); }
  .seg button:focus-visible { outline: 2px solid var(--accent); outline-offset: -3px; }
  .days { display: flex; gap: 8px; }
  .days button { appearance: none; flex: 1; border: 1.5px solid var(--line); background: var(--paper); color: var(--muted); border-radius: 10px; min-height: 44px; font: inherit; font-size: 14px; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.2; gap: 2px; padding: 4px 6px; }
  .days button small { font-size: 11px; opacity: .8; }
  .days button[aria-selected="true"] { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); font-weight: 700; }
  .days button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .panel { display: flex; flex-direction: column; gap: 22px; padding-block: 26px 0; }
  .head { display: flex; flex-direction: column; gap: 8px; }
  .head .ref { display: inline-flex; align-self: flex-start; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; color: var(--accent); background: var(--accent-soft); padding: 4px 12px; border-radius: 999px; }
  .head h2 { font-family: var(--serif); font-size: 28px; line-height: 1.25; margin: 0; font-weight: 700; text-wrap: balance; }
  .head .lead { font-size: 15px; color: var(--muted); }

  .scripture { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 20px 22px; font-family: var(--serif); font-size: 17px; line-height: 1.95; }
  .scripture p { margin: 0; }
  .scripture .v { font-family: var(--sans); font-size: 11px; font-weight: 700; color: var(--accent); vertical-align: super; margin-right: 3px; }
  .scripture .src { display: block; margin-top: 12px; font-family: var(--sans); font-size: 12px; color: var(--muted); text-align: right; }
  .ask2 { display: flex; flex-wrap: wrap; gap: 4px 16px; padding: 0 4px; font-size: 14.5px; line-height: 1.6; color: var(--muted); }
  .ask2 .lbl { width: 100%; font-size: 12px; font-weight: 700; color: var(--accent); letter-spacing: .06em; }
  .ask2 .q::before { content: "○ "; color: var(--accent); }
  .retell { background: var(--accent-soft); border-radius: 14px; padding: 18px 20px; font-size: 16px; }
  .retell .lbl { font-size: 12px; font-weight: 700; color: var(--accent); letter-spacing: .08em; display: block; margin-bottom: 6px; }
  .retell p { margin: 0 0 8px; } .retell p:last-child { margin-bottom: 0; }

  .sec { display: grid; grid-template-columns: 84px minmax(0, 1fr); gap: 14px; padding-block: 18px; border-top: 1px solid var(--line); }
  .sec .lbl { font-size: 13px; font-weight: 700; color: var(--accent); letter-spacing: .06em; padding-top: 3px; }
  .sec .body { display: flex; flex-direction: column; gap: 10px; }
  .sec p { margin: 0; }
  .sec .k { font-weight: 700; color: var(--accent); margin-right: 6px; }
  .qs { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px; }
  .qs li { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 6px; }
  .qs li .n { width: 24px; height: 24px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); font-size: 12px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; margin-top: 4px; }
  .fill { border-bottom: 1.5px dashed var(--line); min-height: 34px; }
  .apply { background: var(--soft); border-radius: 12px; padding: 14px 16px; }
  .prayer { font-family: var(--serif); font-size: 16.5px; line-height: 1.9; }
  .prayer .blank { display: inline-block; min-width: 140px; border-bottom: 1.5px solid var(--line); }
  .nav { display: flex; justify-content: space-between; gap: 12px; padding-top: 10px; }
  .nav button { appearance: none; border: 1.5px solid var(--line); background: var(--paper); color: var(--ink); border-radius: 999px; min-height: 44px; padding: 0 18px; font: inherit; font-size: 14px; cursor: pointer; }
  .nav button:disabled { opacity: .35; cursor: default; }
  .foot { margin-top: 40px; font-size: 12px; color: var(--muted); text-align: center; line-height: 1.6; }
  @media (max-width: 480px) {
    .sec { grid-template-columns: 1fr; gap: 6px; }
    .head h2 { font-size: 24px; }
    .scripture { padding: 16px 18px; font-size: 16px; }
  }
  @media (prefers-reduced-motion: no-preference) { .panel { animation: in .25s ease; } @keyframes in { from { opacity: .4; transform: translateY(4px); } to { opacity: 1; transform: none; } } }
</style>
</head>
<body>

<div class="wrap" id="app">
  <header class="top">
    <div class="eyebrow" id="eyebrow"></div>
    <h1 id="setTitle"></h1>
    <div class="sermon" id="sermonLine"></div>
  </header>
  <div class="sticky">
    <div class="seg" role="tablist" aria-label="대상" id="ageTabs"></div>
    <div class="days" role="tablist" aria-label="날" id="dayTabs"></div>
  </div>
  <main class="panel" id="panel"></main>
  <footer class="foot" id="foot"></footer>
</div>

<script>
const DATA = {"set_title": "낮은 데서 드리는 감사", "eyebrow": "이번 주 QT · 11월 셋째 주", "sermon": {"title": "주 앞에서 낮추라", "ref": "야고보서 4:8-10", "date": "2026. 11. 15"}, "footer": "성경전서 개역개정판 © 대한성서공회 · 진중교회", "days": [{"day_label": "월요일", "ref": "욜 2:12-14", "passage": {"ref": "욜 2:12-14", "label": "요엘 2:12–14", "source": "개역개정", "verses": [{"v": 12, "text": "여호와의 말씀에 너희는 이제라도 금식하고 울며 애통하고 마음을 다하여 내게로 돌아오라 하셨나니"}, {"v": 13, "text": "너희는 옷을 찢지 말고 마음을 찢고 너희 하나님 여호와께로 돌아올지어다 그는 은혜로우시며 자비로우시며 노하기를 더디하시며 인애가 크시사 뜻을 돌이켜 재앙을 내리지 아니하시나니"}, {"v": 14, "text": "주께서 혹시 마음과 뜻을 돌이키시고 그 뒤에 복을 내리사 너희 하나님 여호와께 소제와 전제를 드리게 하지 아니하실는지 누가 알겠느냐"}]}, "adult": {"title": "옷이 아니라 마음을 찢으라", "lead": "야고보의 「울라」는 요엘이 먼저 외친 「돌아오라」에 뿌리를 둡니다.", "explain": [{"k": "배경", "t": "요엘이 예언할 때 유다 땅에 메뚜기 떼가 덮쳤습니다. 메뚜기 떼는 포도나무와 무화과나무를 갉아 먹었습니다(욜 1:4–7). 성전에 드릴 소제와 전제도 끊어졌습니다(욜 1:9). 요엘은 이 재앙 앞에서 「여호와의 날」이 가까웠다고 외쳤습니다(욜 2:1)."}, {"k": "12–13절", "t": "하나님은 「이제라도」 돌아오라고 부르십니다. 재앙이 왔어도 돌아올 길은 닫히지 않았습니다. 그때 백성은 슬픔과 회개를 드러내려고 겉옷을 찢었습니다. 요엘은 「옷을 찢지 말고 마음을 찢으라」고 말합니다. 「찢다(קָרַע)」는 옷을 찢을 때 쓰는 낱말입니다. 요엘은 같은 낱말을 마음에 씁니다. 하나님은 겉으로 보이는 몸짓보다 마음이 어디를 향하는지 보십니다."}, {"k": "13–14절", "t": "요엘은 돌아올 까닭을 하나님의 성품에서 찾습니다. 하나님은 은혜로우시고 자비로우십니다. 노하기를 더디 하시고 인애가 크십니다. 요엘은 출애굽기 34:6에서 모세에게 알려 주신 하나님의 이름을 그대로 부릅니다. 14절의 「누가 알겠느냐」는 하나님을 조종하려 들지 않는 겸손한 기대입니다."}, {"k": "오늘 읽는 법", "t": "주일 설교는 야고보서 4:9의 「슬퍼하며 애통하며 울지어다」를 요엘과 겹쳐 읽었습니다. 울라는 말씀은 우리를 불행하게 하려는 명령이 아닙니다. 하나님을 떠난 마음을 하나님께 되돌리라는 초대입니다. 내 신앙에 겉옷만 찢은 일은 없는지 살피며 읽으십시오."}], "questions": ["나는 신앙생활에서 무엇을 「겉옷 찢기」처럼 하고 있습니까?", "요엘이 부른 하나님의 이름(13절) 가운데 오늘 내 마음에 가장 필요한 이름은 무엇입니까?"], "apply": "오늘 하루 중 십 분을 따로 떼어, 하나님께 멀어진 마음 한 가지를 말씀드립니다. 핑계를 붙이지 않고 그대로 말씀드립니다.", "prayer": "은혜로우시고 자비로우신 하나님, 저는 겉옷만 찢고 마음은 그대로 둘 때가 많았습니다. 오늘 제 마음을 찢고 주님께 돌아갑니다. 노하기를 더디 하시는 주님의 인애를 의지합니다. 예수님 이름으로 기도합니다. 아멘."}, "youth": {"title": "보여 주기 말고 돌아오기", "lead": "하나님은 겉으로 보이는 회개보다 하나님께 돌아오는 마음을 바라세요.", "explain": [{"k": "", "t": "요엘 시대에 메뚜기 떼가 유다 땅의 곡식과 나무를 다 갉아 먹었어요. 그때 하나님이 말씀하셨습니다. 「이제라도 마음을 다하여 내게로 돌아오라」(12절). 하나님은 늦었다고 하지 않으셨어요."}, {"k": "", "t": "그 시절 사람들은 슬프거나 회개할 때 옷을 찢었어요. 옷을 찢으면 남들이 다 알아봅니다. 그런데 하나님은 「옷을 찢지 말고 마음을 찢으라」고 하셨어요(13절). 남에게 보이는 회개보다 하나님께 돌아오는 마음이 중요해요."}, {"k": "", "t": "주일 설교에서 목사님은 야고보서의 「울라」는 말씀을 이 본문과 함께 읽으셨어요. 하나님이 울라고 하신 까닭은 우리를 슬프게 하려는 데 있지 않아요. 하나님은 우리 마음이 하나님께 돌아오기를 바라세요. 요엘은 하나님이 「은혜로우시며 자비로우시며 노하기를 더디하시는」 분이라고 말해요(13절). 그래서 돌아갈 용기가 생깁니다."}], "questions": ["남에게 보여 주려고 한 신앙 행동이 있었나요? 그때 마음은 어땠나요?", "하나님이 「이제라도 돌아오라」고 하신다면, 나는 무엇에서 돌아와야 할까요?"], "apply": "오늘 자기 전에 휴대폰을 내려놓고, 하나님께 솔직한 마음을 한 문장으로 말씀드려요.", "prayer": "하나님, 저도 남에게 보이려고 신앙생활을 할 때가 있어요. 제 마음이 하나님께 돌아가게 해 주세요. 늦었다고 하지 않으시는 하나님께 감사합니다. 예수님 이름으로 기도합니다. 아멘."}, "kids": {"title": "마음을 하나님께", "lead": "하나님은 우리 마음이 하나님께 돌아오기를 기다리세요.", "retell": ["옛날 유다 땅에 메뚜기가 아주 많이 날아왔어요. 메뚜기들이 곡식과 나무를 다 먹어 버렸어요. 사람들은 먹을 것이 없어 슬퍼했어요. 사람들은 하나님을 잊고 살았어요.", "하나님이 요엘을 통해 말씀하셨어요. “이제라도 내게 돌아오너라. 옷을 찢지 말고 마음을 찢어라.” 하나님은 화를 천천히 내시고 사랑이 아주 많은 분이세요. 하나님은 사람들이 돌아오기를 기다리셨어요."], "explain": [{"k": "찾아보세요", "t": "하나님은 무엇을 찢지 말라고 하셨나요? 13절에서 찾아 ○표를 해 보세요. 「돌아오라」는 말에 밑줄을 그어 보세요."}, {"k": "생각해 보세요", "t": "친구와 다투고 “미안해” 하고 말만 하면 친구 마음이 풀릴까요? 정말 미안한 마음이 있어야 해요. 하나님도 우리의 진짜 마음을 보세요."}, {"k": "한 가지 더", "t": "주일에 목사님은 하나님께 가까이 가라는 말씀을 전하셨어요. 하나님께 가까이 가는 첫걸음은 마음을 하나님께 돌리는 일이에요."}], "questions": ["하나님은 어떤 분이라고 했나요? (13절에서 찾아보세요)", "나는 하나님께 어떤 일을 솔직하게 말씀드리고 싶나요?"], "apply": "오늘 잘못한 일이 있으면 하나님과 가족에게 진짜 마음으로 미안하다고 말해요.", "prayer": "하나님, 제 마음을 하나님께 드려요. 저는 ___ 때문에 하나님을 잊을 때가 있어요. 사랑이 많으신 하나님께 돌아가게 해 주세요. 예수님 이름으로 기도합니다. 아멘."}}, {"day_label": "수요일", "ref": "빌 2:5-11", "passage": {"ref": "빌 2:5-11", "label": "빌립보서 2:5–11", "source": "개역개정", "verses": [{"v": 5, "text": "너희 안에 이 마음을 품으라 곧 그리스도 예수의 마음이니"}, {"v": 6, "text": "그는 근본 하나님의 본체시나 하나님과 동등됨을 취할 것으로 여기지 아니하시고"}, {"v": 7, "text": "오히려 자기를 비워 종의 형체를 가지사 사람들과 같이 되셨고"}, {"v": 8, "text": "사람의 모양으로 나타나사 자기를 낮추시고 죽기까지 복종하셨으니 곧 십자가에 죽으심이라"}, {"v": 9, "text": "이러므로 하나님이 그를 지극히 높여 모든 이름 위에 뛰어난 이름을 주사"}, {"v": 10, "text": "하늘에 있는 자들과 땅에 있는 자들과 땅 아래에 있는 자들로 모든 무릎을 예수의 이름에 꿇게 하시고"}, {"v": 11, "text": "모든 입으로 예수 그리스도를 주라 시인하여 하나님 아버지께 영광을 돌리게 하셨느니라"}]}, "adult": {"title": "자기를 비우신 분을 높이시다", "lead": "「주 앞에서 낮추라 그리하면 높이시리라」는 말씀을 예수님이 몸으로 보여 주셨습니다.", "explain": [{"k": "배경(5절)", "t": "바울은 감옥에서 빌립보 교회에 편지를 썼습니다(빌 1:13). 빌립보 교회 안에는 다툼이 있었습니다. 유오디아와 순두게는 서로 마음을 같이하지 못했습니다(빌 4:2). 바울은 앞서 「겸손한 마음으로 각각 자기보다 남을 낫게 여기라」고 권했습니다(빌 2:3). 그리고 겸손의 본으로 예수님을 보여 줍니다."}, {"k": "6–8절", "t": "예수님은 하나님의 본체이셨습니다. 그러나 하나님과 동등됨을 붙들지 않으셨습니다. 「자기를 비워」 종의 형체를 입으셨습니다. 「비우다(κενόω)」는 그릇을 비울 때 쓰는 낱말입니다. 예수님은 사람이 되셨습니다. 거기서 멈추지 않고 십자가에 죽기까지 복종하셨습니다. 바울은 계단을 내려가듯 예수님이 낮아지신 길을 하나씩 짚습니다."}, {"k": "9–11절", "t": "9절은 「이러므로」로 시작합니다. 낮아지신 예수님을 하나님이 지극히 높이셨습니다. 모든 무릎이 예수님의 이름 앞에 꿇고, 모든 입이 예수 그리스도를 주라 고백합니다. 높이신 분은 하나님이십니다. 예수님은 스스로 높아지려 하지 않으셨습니다."}, {"k": "오늘 읽는 법", "t": "야고보서 4:10과 빌립보서 2장은 같은 순서를 말합니다. 먼저 낮추고, 높이는 일은 하나님께 맡깁니다. 이 본문은 「낮아지면 출세한다」는 처세술이 아닙니다. 그리스도의 마음을 품으라는 부름입니다(5절)."}], "questions": ["나는 무엇을 「취할 것으로」 붙들고 놓지 못합니까?", "나를 높이는 일을 하나님께 맡기지 못하고 내가 하려 했던 때는 언제입니까?"], "apply": "오늘 가정이나 일터에서 내 공을 드러낼 기회가 오면 한 번 내려놓습니다. 다른 사람의 수고를 먼저 말해 줍니다.", "prayer": "자기를 비우신 주 예수님, 저는 제 이름을 높이려 애쓸 때가 많았습니다. 주님의 마음을 제 안에 품게 하소서. 저를 높이는 일은 하나님께 맡기고 이웃을 섬기게 하소서. 예수님 이름으로 기도합니다. 아멘."}, "youth": {"title": "내려가신 예수님", "lead": "예수님은 높은 곳에서 가장 낮은 곳까지 내려오셨어요.", "explain": [{"k": "", "t": "빌립보 교회 사람들은 서로 다투었어요. 바울은 다투는 성도들에게 「예수님의 마음을 품으라」고 썼습니다(5절). 그리고 예수님이 어떻게 사셨는지 보여 줍니다. 다툼은 서로 높아지려는 마음에서 시작돼요. 바울은 자기보다 남을 낫게 여기라고 권했어요(3절)."}, {"k": "", "t": "예수님은 하나님과 같은 분이셨어요. 그런데 그 자리를 붙잡지 않으셨어요. 사람이 되셨고 종처럼 섬기셨어요. 마지막에는 십자가에서 죽으셨어요(8절). 예수님은 한 계단씩 가장 낮은 곳으로 내려오셨습니다."}, {"k": "", "t": "하나님은 그 예수님을 가장 높이셨어요(9절). 야고보도 「주 앞에서 낮추라 그리하면 주께서 너희를 높이시리라」고 말했어요. 높이는 일은 하나님이 하세요. 우리가 할 일은 예수님처럼 낮아지는 일이에요."}], "questions": ["SNS나 친구들 앞에서 나를 높이고 싶었던 적이 있나요?", "예수님처럼 낮아진다는 말은 오늘 내 생활에서 어떤 행동일까요?"], "apply": "오늘 친구가 잘한 일을 찾아 진심으로 칭찬해 줘요.", "prayer": "예수님, 저를 위해 낮은 곳까지 내려오셔서 감사해요. 저도 예수님의 마음을 품게 해 주세요. 친구들을 섬기며 살게 해 주세요. 예수님 이름으로 기도합니다. 아멘."}, "kids": {"title": "낮아지신 예수님", "lead": "예수님은 우리를 위해 가장 낮은 곳으로 오셨어요.", "retell": ["예수님은 하나님과 똑같은 분이세요. 하늘에서 가장 높은 분이세요. 그런데 예수님은 높은 곳에만 계시지 않았어요. 사람이 되어 이 땅에 오셨어요. 다른 사람을 섬기는 종처럼 사셨어요. 예수님은 아픈 사람을 고쳐 주시고 제자들의 발을 씻겨 주셨어요.", "예수님은 우리를 위해 십자가에서 돌아가셨어요. 하나님은 그 예수님을 가장 높이셨어요. 그래서 모든 사람이 예수님 앞에 무릎을 꿇고 “예수님은 주님이세요” 하고 고백해요."], "explain": [{"k": "찾아보세요", "t": "예수님은 무엇의 모습을 가지셨나요? 7절에서 찾아 ○표를 해 보세요. 「낮추시고」라는 말을 8절에서 찾아 밑줄을 그어 보세요."}, {"k": "생각해 보세요", "t": "형이나 언니가 동생 키에 맞추려고 무릎을 꿇고 이야기해 주면 동생은 어떤 마음일까요? 예수님은 우리를 사랑하셔서 우리에게 내려오셨어요."}, {"k": "한 가지 더", "t": "주일 말씀은 「주 앞에서 낮추라」였어요. 자기를 낮춘 예수님을 하나님이 높이셨어요."}], "questions": ["하나님은 낮아지신 예수님을 어떻게 하셨나요? (9절에서 찾아보세요)", "나는 누구를 섬길 수 있을까요?"], "apply": "오늘 가족을 위해 내가 먼저 한 가지 일을 도와요.", "prayer": "예수님, 저에게 내려와 주셔서 감사해요. 저도 ___을(를) 섬기고 싶어요. 예수님처럼 겸손하게 해 주세요. 예수님 이름으로 기도합니다. 아멘."}}, {"day_label": "금요일", "ref": "삼상 7:7-12", "passage": {"ref": "삼상 7:7-12", "label": "사무엘상 7:7–12", "source": "개역개정", "verses": [{"v": 7, "text": "이스라엘 자손이 미스바에 모였다 함을 블레셋 사람들이 듣고 그들의 방백들이 이스라엘을 치러 올라온지라 이스라엘 자손들이 듣고 블레셋 사람들을 두려워하여"}, {"v": 8, "text": "이스라엘 자손이 사무엘에게 이르되 당신은 우리를 위하여 우리 하나님 여호와께 쉬지 말고 부르짖어 우리를 블레셋 사람들의 손에서 구원하시게 하소서 하니"}, {"v": 9, "text": "사무엘이 젖 먹는 어린 양 하나를 가져다가 온전한 번제를 여호와께 드리고 이스라엘을 위하여 여호와께 부르짖으매 여호와께서 응답하셨더라"}, {"v": 10, "text": "사무엘이 번제를 드릴 때에 블레셋 사람이 이스라엘과 싸우려고 가까이 오매 그 날에 여호와께서 블레셋 사람에게 큰 우레를 발하여 그들을 어지럽게 하시니 그들이 이스라엘 앞에 패한지라"}, {"v": 11, "text": "이스라엘 사람들이 미스바에서 나가서 블레셋 사람들을 추격하여 벧갈 아래에 이르기까지 쳤더라"}, {"v": 12, "text": "사무엘이 돌을 취하여 미스바와 센 사이에 세워 이르되 여호와께서 여기까지 우리를 도우셨다 하고 그 이름을 에벤에셀이라 하니라"}]}, "adult": {"title": "여기까지 도우신 하나님", "lead": "사무엘은 승리의 기념비에 자기 이름이 아니라 하나님의 도우심을 새겼습니다.", "explain": [{"k": "배경", "t": "이스라엘은 블레셋과 싸우다 언약궤를 빼앗겼습니다(삼상 4장). 언약궤는 돌아왔지만 기럇여아림에 이십 년 동안 머물렀습니다(7:2). 그동안 백성은 하나님을 사모하며 슬퍼했습니다. 사무엘은 이방 신들을 버리고 마음을 다해 여호와께 돌아오라고 외쳤습니다(7:3). 백성은 미스바에 모여 금식하고 「우리가 여호와께 범죄하였나이다」라고 고백했습니다(7:6)."}, {"k": "7–10절", "t": "백성이 회개하려고 모이자 블레셋이 쳐들어왔습니다. 이스라엘은 두려워 사무엘에게 「쉬지 말고 부르짖어」 달라고 청했습니다. 사무엘은 어린 양을 번제로 드리며 부르짖었습니다. 여호와께서 응답하셨습니다. 여호와께서 큰 우레로 블레셋을 어지럽게 하셨습니다(10절). 이스라엘의 무기가 이긴 싸움이 아니었습니다."}, {"k": "12절", "t": "사무엘은 미스바와 센 사이에 돌을 세웠습니다. 그 이름을 「에벤에셀(אֶבֶן הָעֵזֶר)」이라 했습니다. 「에벤」은 돌, 「에셀」은 도움입니다. 사무엘은 「여호와께서 여기까지 우리를 도우셨다」고 고백했습니다. 「여기까지」는 언약궤를 잃은 날부터 미스바의 회개를 거쳐 오늘에 이른 길 전체입니다."}, {"k": "오늘 읽는 법", "t": "주일 설교는 사울의 기념비(삼상 15:12)와 사무엘의 에벤에셀을 나란히 놓았습니다. 사울은 자기를 위해 돌을 세웠고, 사무엘은 하나님의 도우심을 새겼습니다. 추수감사는 거둔 것을 세는 일입니다. 그 셈 끝에 누구의 이름을 적는지 살피며 읽으십시오."}], "questions": ["올해 내 삶에서 「여기까지 도우셨다」고 고백할 일은 무엇입니까?", "잘된 일 앞에서 나는 내 이름과 하나님의 이름 가운데 무엇을 먼저 말합니까?"], "apply": "올해 하나님이 도우신 일 세 가지를 적습니다. 그중 하나를 가족이나 구역 식구에게 이야기합니다.", "prayer": "에벤에셀 하나님, 여기까지 저를 도우셨습니다. 제가 이룬 것을 자랑하던 마음을 내려놓습니다. 올해 거둔 열매마다 주님의 도우심을 고백하게 하소서. 받은 은혜를 이웃과 나누게 하소서. 예수님 이름으로 기도합니다. 아멘."}, "youth": {"title": "내 돌에 새길 이름", "lead": "감사는 「하나님이 여기까지 도우셨다」고 고백하는 일이에요.", "explain": [{"k": "", "t": "이스라엘은 블레셋에게 지고 하나님의 언약궤까지 빼앗긴 적이 있어요. 오랜 시간이 지나 백성은 미스바에 모여 하나님께 잘못을 고백했어요. 그때 블레셋이 다시 쳐들어왔습니다. 백성은 겁이 났지만 이번에는 다른 길을 택했어요. 자기 힘을 믿지 않고 하나님께 부르짖었습니다."}, {"k": "", "t": "사무엘은 하나님께 부르짖었어요. 하나님이 큰 천둥으로 블레셋을 어지럽게 하셨어요(10절). 이스라엘이 힘이 세서 이긴 싸움이 아니었어요. 하나님이 이기게 하셨습니다."}, {"k": "", "t": "사무엘은 돌을 세우고 「에벤에셀」이라 불렀어요. 「도움의 돌」이라는 뜻이에요. 사울 왕도 승리한 뒤 기념비를 세웠지만, 사울은 자기를 자랑했어요. 같은 돌이라도 어떤 이름을 새기느냐가 달랐습니다."}], "questions": ["올해 시험이나 일에서 잘된 일이 있었다면, 누구 덕분이라고 말했나요?", "나에게 「여기까지 도우셨다」고 말할 수 있는 일은 무엇인가요?"], "apply": "올해 하나님이 도와주신 일 하나를 휴대폰 메모에 적고, 그 일로 하나님께 감사 기도를 해요.", "prayer": "하나님, 올해도 여기까지 저를 도와주셨어요. 잘된 일을 제 자랑으로 삼지 않게 해 주세요. 하나님의 도우심을 고백하는 사람이 되게 해 주세요. 예수님 이름으로 기도합니다. 아멘."}, "kids": {"title": "도움의 돌", "lead": "하나님은 여기까지 우리를 도와주셨어요.", "retell": ["이스라엘 사람들이 미스바에 모여 하나님께 기도했어요. 그때 블레셋 군대가 싸우러 왔어요. 사람들은 무서워서 사무엘에게 부탁했어요. “하나님께 쉬지 말고 기도해 주세요.” 사무엘은 하나님께 기도했어요.", "하나님이 하늘에서 큰 천둥소리를 내셨어요. 블레셋 군대는 놀라서 도망쳤어요. 사무엘은 큰 돌을 세우고 이름을 “에벤에셀”이라고 지었어요. “하나님이 여기까지 우리를 도우셨다”는 뜻이에요."], "explain": [{"k": "찾아보세요", "t": "사무엘이 세운 돌의 이름은 무엇인가요? 12절에서 찾아 ○표를 해 보세요. 「도우셨다」는 말에 밑줄을 그어 보세요."}, {"k": "생각해 보세요", "t": "키를 잴 때 벽에 줄을 그으면 지난번보다 얼마나 컸는지 알 수 있어요. 에벤에셀 돌을 보면 하나님이 얼마나 도와주셨는지 기억할 수 있어요."}, {"k": "한 가지 더", "t": "지난 주일은 추수감사주일이었어요. 감사는 하나님이 도와주신 일을 기억하고 말하는 일이에요."}], "questions": ["사무엘이 기도하자 하나님은 무엇을 하셨나요? (10절에서 찾아보세요)", "올해 하나님이 나를 도와주신 일은 무엇인가요?"], "apply": "종이에 돌을 그리고 그 안에 하나님이 도와주신 일 하나를 적어요.", "prayer": "하나님, 여기까지 저를 도와주셔서 감사해요. 올해 하나님이 ___ 일을 도와주셨어요. 앞으로도 하나님을 기억하게 해 주세요. 예수님 이름으로 기도합니다. 아멘."}}]};
const AGES = [["adult","청장년"],["youth","청소년"],["kids","어린이"]];
const state = { age: "adult", day: 0 };
const esc = s => String(s ?? "").replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const rich = s => esc(s).replace(/&lt;b&gt;/g,"<b>").replace(/&lt;\/b&gt;/g,"</b>");

function readHash(){
  const m = location.hash.match(/^#(adult|youth|kids)-(\d)$/);
  if (m) { state.age = m[1]; state.day = Math.min(DATA.days.length-1, Math.max(0, +m[2]-1)); return; }
  try { const s = JSON.parse(localStorage.getItem("qt-set-last")||"null"); if (s && AGES.some(a=>a[0]===s.age)) { state.age = s.age; state.day = Math.min(DATA.days.length-1, s.day|0); } } catch(e){}
}
function remember(){ try { localStorage.setItem("qt-set-last", JSON.stringify(state)); } catch(e){} history.replaceState(null,"",`#${state.age}-${state.day+1}`); }
function setAccent(){
  const r = document.documentElement.style;
  r.setProperty("--accent", `var(--a-${state.age})`); r.setProperty("--accent-soft", `var(--a-${state.age}-soft)`);
}
function renderTabs(){
  document.getElementById("ageTabs").innerHTML = AGES.map(([k,l]) => `<button role="tab" id="age-${k}" aria-selected="${state.age===k}" data-age="${k}">${l}</button>`).join("");
  document.getElementById("dayTabs").innerHTML = DATA.days.map((d,i) => `<button role="tab" id="day-${i}" aria-selected="${state.day===i}" data-day="${i}"><span>${esc(d.day_label)}</span><small>${esc(d.ref)}</small></button>`).join("");
}
function section(lbl, inner){ return `<section class="sec"><div class="lbl">${lbl}</div><div class="body">${inner}</div></section>`; }
function renderPanel(){
  const d = DATA.days[state.day]; const c = d[state.age];
  const verses = d.passage.verses.map(v => `<span class="v">${v.v}</span>${esc(v.text)} `).join("");
  let html = `<div class="head"><span class="ref">${esc(d.passage.label)}</span><h2>${esc(c.title)}</h2>${c.lead ? `<div class="lead">${rich(c.lead)}</div>` : ""}</div>`;
  html += `<div class="scripture"><p>${verses}</p><span class="src">${esc(d.passage.source)}</span></div>`;
  // 매일성경처럼 본문을 읽으며 붙드는 두 질문 — 매주 같다(2026-10-24 사용자 요청). 어린이는 쉬운 말로
  const ASK2 = state.age === "kids" ? ["하나님은 어떤 분이세요?", "나에게 무엇을 가르쳐 주세요?"] : ["하나님은 어떤 분이신가?", "나(우리)에게 주시는 교훈은 무엇인가?"];
  html += `<div class="ask2"><span class="lbl">본문을 읽으며</span>${ASK2.map(q=>`<span class="q">${q}</span>`).join("")}</div>`;
  if (c.retell && c.retell.length) html += `<div class="retell"><span class="lbl">쉽게 읽기</span>${c.retell.map(p=>`<p>${rich(p)}</p>`).join("")}</div>`;
  html += section("설명", c.explain.map(p => `<p>${p.k ? `<span class="k">${esc(p.k)}</span>` : ""}${rich(p.t)}</p>`).join(""));
  html += section("묵상 질문", `<ol class="qs">${c.questions.map((q,i)=>`<li><span class="n">${i+1}</span><div>${rich(q)}<div class="fill"></div></div></li>`).join("")}</ol>`);
  html += section("적용", `<div class="apply">${rich(c.apply)}</div>`);
  html += section("기도", `<div class="prayer">${rich(c.prayer).replace(/___+/g,'<span class="blank"></span>')}</div>`);
  const last = state.day === DATA.days.length-1;
  html += `<div class="nav"><button id="prev" ${state.day===0?"disabled":""}>← 이전</button><button id="next" ${last?"disabled":""}>다음 →</button></div>`;
  document.getElementById("panel").innerHTML = html;
}
function render(){ setAccent(); renderTabs(); renderPanel(); remember(); document.title = `${DATA.set_title} · ${AGES.find(a=>a[0]===state.age)[1]}`; }
document.getElementById("eyebrow").textContent = DATA.eyebrow || "";
document.getElementById("setTitle").textContent = DATA.set_title;
document.getElementById("sermonLine").innerHTML = DATA.sermon ? `이번 주 설교 <b>${esc(DATA.sermon.title)}</b> · ${esc(DATA.sermon.ref)}${DATA.sermon.date ? ` · ${esc(DATA.sermon.date)}` : ""}` : "";
document.getElementById("foot").innerHTML = rich(DATA.footer || "");
document.getElementById("app").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.age) state.age = b.dataset.age;
  else if (b.dataset.day) state.day = +b.dataset.day;
  else if (b.id === "prev") state.day--; else if (b.id === "next") state.day++; else return;
  render(); if (b.dataset.day !== undefined || b.id === "prev" || b.id === "next") document.getElementById("panel").scrollIntoView({block:"start", behavior:"smooth"});
});
window.addEventListener("hashchange", () => { readHash(); render(); });
readHash(); render();
</script>

</body>
</html>
