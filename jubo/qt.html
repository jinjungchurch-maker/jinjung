<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>구하는 기도에서 사귐의 기도로</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@500;700&display=swap">
<style>
  :root {
    --bg: #f9f7f2; --paper: #ffffff; --ink: #1e2a2b; --muted: #66716f; --line: #e4dfd4; --soft: #f1ede4;
    --a-adult: #2f6b6f; --a-youth: #4b5ea8; --a-kids: #c9612e;
    --a-adult-soft: #e6f0f0; --a-youth-soft: #e9ecf8; --a-kids-soft: #fbeae0;
    --sans: 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    --serif: 'Noto Serif KR', 'Apple Myungjo', 'Batang', serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #15191a; --paper: #1d2324; --ink: #ece7dc; --muted: #9aa5a3; --line: #2f3739; --soft: #242c2d;
      --a-adult: #7fc2c5; --a-youth: #a4b0ee; --a-kids: #f0a074;
      --a-adult-soft: #1f2f30; --a-youth-soft: #23283b; --a-kids-soft: #362820;
    }
  }
  :root[data-theme="dark"] {
    --bg: #15191a; --paper: #1d2324; --ink: #ece7dc; --muted: #9aa5a3; --line: #2f3739; --soft: #242c2d;
    --a-adult: #7fc2c5; --a-youth: #a4b0ee; --a-kids: #f0a074;
    --a-adult-soft: #1f2f30; --a-youth-soft: #23283b; --a-kids-soft: #362820;
  }
  html, body { background: var(--bg); color: var(--ink); }
  body { margin: 0; font-family: var(--sans); font-size: 16px; line-height: 1.75; -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 720px; margin: 0 auto; padding-block: 0 64px; padding-inline: 18px; }
  .top { padding-block: 26px 14px; display: flex; flex-direction: column; gap: 6px; }
  .top .eyebrow { font-size: 12px; letter-spacing: .12em; color: var(--muted); font-weight: 500; }
  .top h1 { font-family: var(--serif); font-size: 24px; font-weight: 700; margin: 0; line-height: 1.3; text-wrap: balance; }
  .top .sermon { font-size: 14px; color: var(--muted); }
  .top .sermon b { color: var(--ink); font-weight: 500; }

  .sticky { position: sticky; top: env(safe-area-inset-top, 0px); background: var(--bg); z-index: 5; padding-block: 10px 12px; display: flex; flex-direction: column; gap: 10px; border-bottom: 1px solid var(--line); }
  .seg { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0; border: 1.5px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--paper); }
  .seg button { appearance: none; border: 0; background: transparent; color: var(--muted); font: inherit; font-size: 15px; font-weight: 500; min-height: 44px; cursor: pointer; }
  .seg button + button { border-left: 1.5px solid var(--line); }
  .seg button[aria-selected="true"] { color: #fff; background: var(--accent); }
  .seg button:focus-visible { outline: 2px solid var(--accent); outline-offset: -3px; }
  .days { display: flex; gap: 8px; }
  .days button { appearance: none; flex: 1; border: 1.5px solid var(--line); background: var(--paper); color: var(--muted); border-radius: 10px; min-height: 44px; font: inherit; font-size: 14px; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.2; gap: 2px; padding: 4px 6px; }
  .days button small { font-size: 11px; opacity: .8; }
  .days button[aria-selected="true"] { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); font-weight: 700; }
  .days button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .panel { display: flex; flex-direction: column; gap: 22px; padding-block: 26px 0; }
  .head { display: flex; flex-direction: column; gap: 8px; }
  .head .ref { display: inline-flex; align-self: flex-start; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; color: var(--accent); background: var(--accent-soft); padding: 4px 12px; border-radius: 999px; }
  .head h2 { font-family: var(--serif); font-size: 28px; line-height: 1.25; margin: 0; font-weight: 700; text-wrap: balance; }
  .head .lead { font-size: 15px; color: var(--muted); }

  .scripture { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 20px 22px; font-family: var(--serif); font-size: 17px; line-height: 1.95; }
  .scripture p { margin: 0; }
  .scripture .v { font-family: var(--sans); font-size: 11px; font-weight: 700; color: var(--accent); vertical-align: super; margin-right: 3px; }
  .scripture .src { display: block; margin-top: 12px; font-family: var(--sans); font-size: 12px; color: var(--muted); text-align: right; }
  .retell { background: var(--accent-soft); border-radius: 14px; padding: 18px 20px; font-size: 16px; }
  .retell .lbl { font-size: 12px; font-weight: 700; color: var(--accent); letter-spacing: .08em; display: block; margin-bottom: 6px; }
  .retell p { margin: 0 0 8px; } .retell p:last-child { margin-bottom: 0; }

  .sec { display: grid; grid-template-columns: 84px minmax(0, 1fr); gap: 14px; padding-block: 18px; border-top: 1px solid var(--line); }
  .sec .lbl { font-size: 13px; font-weight: 700; color: var(--accent); letter-spacing: .06em; padding-top: 3px; }
  .sec .body { display: flex; flex-direction: column; gap: 10px; }
  .sec p { margin: 0; }
  .sec .k { font-weight: 700; color: var(--accent); margin-right: 6px; }
  .qs { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px; }
  .qs li { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 6px; }
  .qs li .n { width: 24px; height: 24px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); font-size: 12px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; margin-top: 4px; }
  .fill { border-bottom: 1.5px dashed var(--line); min-height: 34px; }
  .apply { background: var(--soft); border-radius: 12px; padding: 14px 16px; }
  .prayer { font-family: var(--serif); font-size: 16.5px; line-height: 1.9; }
  .prayer .blank { display: inline-block; min-width: 140px; border-bottom: 1.5px solid var(--line); }
  .nav { display: flex; justify-content: space-between; gap: 12px; padding-top: 10px; }
  .nav button { appearance: none; border: 1.5px solid var(--line); background: var(--paper); color: var(--ink); border-radius: 999px; min-height: 44px; padding: 0 18px; font: inherit; font-size: 14px; cursor: pointer; }
  .nav button:disabled { opacity: .35; cursor: default; }
  .foot { margin-top: 40px; font-size: 12px; color: var(--muted); text-align: center; line-height: 1.6; }
  @media (max-width: 480px) {
    .sec { grid-template-columns: 1fr; gap: 6px; }
    .head h2 { font-size: 24px; }
    .scripture { padding: 16px 18px; font-size: 16px; }
  }
  @media (prefers-reduced-motion: no-preference) { .panel { animation: in .25s ease; } @keyframes in { from { opacity: .4; transform: translateY(4px); } to { opacity: 1; transform: none; } } }
</style>
</head>
<body>

<div class="wrap" id="app">
  <header class="top">
    <div class="eyebrow" id="eyebrow"></div>
    <h1 id="setTitle"></h1>
    <div class="sermon" id="sermonLine"></div>
  </header>
  <div class="sticky">
    <div class="seg" role="tablist" aria-label="대상" id="ageTabs"></div>
    <div class="days" role="tablist" aria-label="날" id="dayTabs"></div>
  </div>
  <main class="panel" id="panel"></main>
  <footer class="foot" id="foot"></footer>
</div>

<script>
const DATA = {"set_title": "구하는 기도에서 사귐의 기도로", "eyebrow": "이번 주 QT · 10월 둘째 주", "sermon": {"title": "잘못 구하기 때문이라", "ref": "야고보서 4:1–3", "date": "2026. 10. 11"}, "footer": "성경전서 개역개정판 © 대한성서공회 · 진중교회", "days": [{"day_label": "월요일", "ref": "시 42:1-5", "passage": {"ref": "시 42:1-5", "label": "시편 42:1–5", "source": "개역개정", "verses": [{"v": 1, "text": "하나님이여 사슴이 시냇물을 찾기에 갈급함 같이 내 영혼이 주를 찾기에 갈급하니이다"}, {"v": 2, "text": "내 영혼이 하나님 곧 살아 계시는 하나님을 갈망하나니 내가 어느 때에 나아가서 하나님의 얼굴을 뵈올까"}, {"v": 3, "text": "사람들이 종일 내게 하는 말이 네 하나님이 어디 있느뇨 하오니 내 눈물이 주야로 내 음식이 되었도다"}, {"v": 4, "text": "내가 전에 성일을 지키는 무리와 동행하여 기쁨과 감사의 소리를 내며 그들을 하나님의 집으로 인도하였더니 이제 이 일을 기억하고 내 마음이 상하는도다"}, {"v": 5, "text": "내 영혼아 네가 어찌하여 낙심하며 어찌하여 내 속에서 불안해 하는가 너는 하나님께 소망을 두라 그가 나타나 도우심으로 말미암아 내가 여전히 찬송하리로다"}]}, "adult": {"title": "내 영혼이 하나님을 갈망하나니", "lead": "시인은 결핍 속에서 응답보다 먼저 하나님의 얼굴을 구합니다.", "explain": [{"k": "1–2절", "t": "시편 42편은 「고라 자손의 마스길」입니다. 고라 자손은 성전에서 하나님을 찬송하던 레위 사람들입니다(대하 20:19). 1절의 「갈급하다」는 아라그(עָרַג)입니다. 목이 말라 헐떡이며 간절히 바란다는 뜻의 동사입니다. 구약에서 이 동사는 시 42:1에 두 번, 욜 1:20에 한 번 나옵니다. 요엘서에서는 시내가 말라 들짐승이 하나님을 향해 헐떡입니다. 시인은 그 짐승처럼 하나님을 찾습니다. 2절에서 시인이 바라는 대상은 물도 음식도 아닙니다. 「내가 어느 때에 나아가서 하나님의 얼굴을 뵈올까.」"}, {"k": "3–4절", "t": "시인의 형편은 어렵습니다. 사람들이 종일 묻습니다. 「네 하나님이 어디 있느뇨.」 시인은 밤낮 울어서 눈물이 음식이 되었습니다. 4절에서 시인은 지난날을 떠올립니다. 전에는 절기를 지키는 무리를 이끌고 기뻐하며 하나님의 집으로 올라갔습니다. 6절에 요단 땅과 헤르몬이 나옵니다. 시인은 예루살렘 성전에서 멀리 떨어진 북쪽 땅에 있습니다."}, {"k": "5절", "t": "시인은 자기 영혼에게 말을 겁니다. 「내 영혼아 네가 어찌하여 낙심하며 어찌하여 내 속에서 불안해 하는가.」 그리고 스스로 답합니다. 「너는 하나님께 소망을 두라.」 형편은 하나도 바뀌지 않았습니다. 그런데도 시인은 「내가 여전히 찬송하리로다」라고 고백합니다. 같은 고백이 11절과 43:5에 다시 나옵니다. 탄식에서 신뢰로 가는 길이 한 번에 끝나지 않았다는 뜻입니다."}, {"k": "오늘 읽는 법", "t": "시편은 기도의 노래입니다. 시인은 눈물과 낙심을 숨기지 않습니다. 주일 설교는 고난 한복판의 기도가 시편이라고 했습니다. 시인에게는 결핍이 많았습니다. 조롱하는 사람들이 있었고, 예배하던 성전이 멀었습니다. 그러나 시인이 가장 목말라한 대상은 하나님 자신이었습니다. 오늘 내 기도 제목을 펼쳐 보십시오. 하나님께 무엇을 구하는지 보고, 하나님을 구하는지도 보십시오."}], "questions": ["요즘 내 기도의 대부분을 차지하는 결핍은 무엇입니까? 그 기도 속에 하나님 자신을 찾는 마음이 있습니까?", "시인은 낙심한 자기 영혼에게 「하나님께 소망을 두라」고 말합니다. 오늘 나는 내 영혼에게 무엇이라고 말하겠습니까?"], "apply": "오늘 기도 시간의 처음 5분은 아무것도 구하지 않습니다. 시 42:1–2를 천천히 소리 내어 읽고 하나님께 지금 내 마음을 그대로 말씀드립니다. 필요한 것은 그다음에 구합니다.", "prayer": "하나님, 사슴이 시냇물을 찾듯 제 영혼이 주님을 찾게 하소서. 필요한 것만 들고 오는 기도에서 주님의 얼굴을 구하는 기도로 이끌어 주소서. 낙심할 때에도 주님께 소망을 두게 하소서. 예수님 이름으로 기도합니다. 아멘."}, "youth": {"title": "목마른 사슴처럼", "lead": "시인이 가장 목말라한 대상은 하나님 자신이었습니다.", "explain": [{"k": "", "t": "사슴이 시냇물을 찾아 헐떡입니다. 물을 찾지 못하면 사슴은 살 수 없어요. 시인은 「내 영혼이 주를 찾기에 갈급하니이다」라고 고백합니다. 하나님 없이는 살 수 없다는 말입니다. 시인이 바란 것은 「하나님의 얼굴을 뵈올」 날이었습니다(2절)."}, {"k": "", "t": "시인의 형편은 힘들었습니다. 사람들이 「네 하나님이 어디 있느냐」 하고 놀렸습니다(3절). 시인은 밤낮 울었습니다. 예전에 사람들과 함께 기뻐하며 예배하러 가던 날을 떠올리면 마음이 더 아팠어요(4절)."}, {"k": "", "t": "5절에서 시인은 자기 마음에게 묻습니다. 「내 영혼아 네가 어찌하여 낙심하며.」 그리고 「하나님께 소망을 두라」고 답합니다. 우리는 성적, 진로, 친구 문제로 기도할 때가 많지요. 하나님은 그 기도도 들으십니다. 시인은 거기서 한 걸음 더 나아갔습니다. 문제를 푸는 길보다 하나님을 더 찾았습니다."}], "questions": ["요즘 내가 가장 자주 기도하는 제목은 무엇인가요?", "힘들 때 나는 하나님을 먼저 찾나요, 다른 것을 먼저 찾나요? (폰, 게임, 친구)"], "apply": "오늘 잠들기 전에 폰을 내려놓고 5절을 소리 내어 한 번 읽어 봅니다. 그리고 하나님께 오늘 하루를 솔직하게 말씀드려요.", "prayer": "하나님, 힘들 때 다른 것보다 하나님을 먼저 찾게 해 주세요. 낙심이 될 때 하나님께 소망을 두게 해 주세요. 예수님 이름으로 기도합니다. 아멘."}, "kids": {"title": "사슴이 시냇물을 찾듯이", "lead": "시편을 쓴 사람은 하나님을 아주 많이 만나고 싶어 했어요.", "retell": ["목마른 사슴이 시냇물을 찾아 헐떡거려요. 물을 마시지 못하면 사슴은 살 수 없어요. 시편을 쓴 사람이 기도했어요. “하나님, 사슴이 시냇물을 찾듯이 내 마음이 하나님을 찾아요. 언제 하나님을 뵈올 수 있을까요?”", "사람들은 이 사람에게 “네 하나님이 어디 있느냐?” 하고 놀렸어요. 이 사람은 밤에도 낮에도 울었어요. 예전에 사람들과 함께 기뻐하며 하나님의 집에 가던 날이 생각나서 더 슬펐어요. 그래도 이 사람은 자기 마음에게 말했어요. “내 영혼아, 왜 낙심하니? 하나님께 소망을 두어라. 나는 여전히 하나님을 찬송할 거야.”"], "explain": [{"k": "찾아보세요", "t": "시인이 무엇을 찾는다고 했나요? 1절에서 찾아 ○표를 해 보세요. 사람들이 시인에게 한 말을 3절에서 찾아 밑줄을 그어 보세요."}, {"k": "생각해 보세요", "t": "목이 아주 마를 때를 떠올려 보세요. 물 생각밖에 나지 않지요? 시인은 그만큼 하나님을 만나고 싶었어요. 시인은 장난감이나 간식보다 하나님을 더 찾았어요."}, {"k": "한 가지 더", "t": "기도는 필요한 것을 하나님께 말하는 시간이에요. 하나님과 이야기를 나누는 시간이기도 해요. 오늘은 갖고 싶은 것을 말하기 전에 하나님께 고맙다는 말부터 해 봐요."}], "questions": ["시인은 낙심한 마음에게 누구에게 소망을 두라고 했나요? (5절에서 찾아보세요)", "나는 슬플 때 누구를 먼저 찾나요?"], "apply": "오늘 기도할 때 갖고 싶은 것을 말하기 전에 “하나님, 사랑해요.” 하고 먼저 말해요.", "prayer": "하나님, 사슴이 물을 찾듯 제가 하나님을 찾게 해 주세요. 오늘 ___ 때문에 마음이 힘들어요. 그때에도 하나님께 소망을 두게 해 주세요. 예수님 이름으로 기도합니다. 아멘."}}, {"day_label": "수요일", "ref": "마 6:7-13", "passage": {"ref": "마 6:7-13", "label": "마태복음 6:7–13", "source": "개역개정", "verses": [{"v": 7, "text": "또 기도할 때에 이방인과 같이 중언부언하지 말라 그들은 말을 많이 하여야 들으실 줄 생각하느니라"}, {"v": 8, "text": "그러므로 그들을 본받지 말라 구하기 전에 너희에게 있어야 할 것을 하나님 너희 아버지께서 아시느니라"}, {"v": 9, "text": "그러므로 너희는 이렇게 기도하라 하늘에 계신 우리 아버지여 이름이 거룩히 여김을 받으시오며"}, {"v": 10, "text": "나라가 임하시오며 뜻이 하늘에서 이루어진 것 같이 땅에서도 이루어지이다"}, {"v": 11, "text": "오늘 우리에게 일용할 양식을 주시옵고"}, {"v": 12, "text": "우리가 우리에게 죄 지은 자를 사하여 준 것 같이 우리 죄를 사하여 주시옵고"}, {"v": 13, "text": "우리를 시험에 들게 하지 마시옵고 다만 악에서 구하시옵소서 (나라와 권세와 영광이 아버지께 영원히 있사옵나이다 아멘"}]}, "adult": {"title": "구하기 전에 아버지께서 아시느니라", "lead": "예수님은 일용할 양식을 구하라 하시면서, 그 기도를 아버지의 이름과 나라와 뜻 다음에 두셨습니다.", "explain": [{"k": "7–8절", "t": "마태복음 6장은 구제와 기도와 금식을 차례로 다룹니다. 5–6절은 사람에게 보이려는 기도를 경계합니다. 7절은 이방인처럼 「중언부언하지 말라」고 하십니다. 「중언부언하다」는 바탈로게오(βατταλογέω)입니다. 뜻 없이 같은 말을 되풀이한다는 말입니다. 같은 절의 「말을 많이 함」(폴뤼로기아, πολυλογία)이 이 기도를 설명합니다. 이방인은 말을 많이 해야 신이 들어준다고 생각했습니다. 말의 양으로 신을 움직이려 했습니다. 예수님은 다른 이유를 대십니다. 「구하기 전에 너희에게 있어야 할 것을 하나님 너희 아버지께서 아시느니라.」"}, {"k": "9–10절", "t": "그래서 예수님이 가르치신 기도는 「하늘에 계신 우리 아버지여」로 시작합니다. 처음 세 간구는 모두 하나님에 관한 간구입니다. 아버지의 이름이 거룩히 여김을 받고, 아버지의 나라가 오고, 아버지의 뜻이 땅에서도 이루어지기를 구합니다. 제자는 자기 필요를 말하기 전에 아버지가 누구신지 먼저 부릅니다."}, {"k": "11–13절", "t": "그다음에 「오늘 우리에게 일용할 양식을 주시옵고」가 나옵니다. 예수님은 몸의 필요를 하찮게 여기지 않으셨습니다. 주일 설교도 결핍 자체는 잘못이 아니라고 했습니다. 「일용할」 양식은 오늘 하루치 양식입니다. 이어서 죄 용서와 시험에서 지켜 주시기를 구합니다. 양식과 용서와 보호, 곧 몸과 이웃 관계와 영혼의 필요가 한 기도 안에 들어 있습니다."}, {"k": "오늘 읽는 법", "t": "주기도문은 외우는 기도문이면서 기도의 순서를 가르칩니다. 야고보 공동체는 땅의 필요만 구했습니다(약 4:3). 예수님은 땅의 필요를 아버지의 나라 안에서 구하게 하셨습니다. 같은 양식을 구해도 아버지를 먼저 부르면 기도의 중심이 달라집니다. 내 필요에서 아버지에게로 옮겨 갑니다."}], "questions": ["내 기도는 주로 무엇으로 시작합니까? 주기도문의 순서와 견주어 보십시오.", "「구하기 전에 아버지께서 아신다」는 말씀은 오늘 나의 어떤 걱정에 답합니까?"], "apply": "오늘 기도를 주기도문 순서로 드립니다. 아버지의 이름과 나라와 뜻을 먼저 구합니다. 그다음 오늘 필요한 것 하나, 용서해야 할 사람 한 명, 피하고 싶은 시험 하나를 아룁니다.", "prayer": "하늘에 계신 아버지, 제가 구하기 전에 제게 있어야 할 것을 아시니 감사합니다. 말을 많이 해야 들으신다고 여긴 저를 용서하소서. 아버지의 이름과 나라와 뜻을 먼저 구하게 하시고, 오늘 하루치 양식을 아버지 손에서 받게 하소서. 예수님 이름으로 기도합니다. 아멘."}, "youth": {"title": "「주세요」보다 「아버지」가 먼저", "lead": "예수님은 기도를 「하늘에 계신 우리 아버지여」라는 부름으로 시작하게 하셨습니다.", "explain": [{"k": "", "t": "예수님은 말을 많이 해야 하나님이 들으신다고 생각하지 말라고 하셨어요(7절). 같은 말을 뜻 없이 되풀이하는 기도는 하나님을 설득하려는 기도입니다. 8절은 하나님이 우리가 구하기 전에 이미 아신다고 말합니다. 하나님은 정보가 모자라서 우리 기도를 기다리시지 않아요."}, {"k": "", "t": "예수님이 가르쳐 주신 기도는 「하늘에 계신 우리 아버지여」로 시작해요. 처음 세 가지는 하나님의 이름, 하나님의 나라, 하나님의 뜻입니다. 내 소원을 말하기 전에 하나님이 어떤 분인지 먼저 부릅니다."}, {"k": "", "t": "그다음에 「오늘 우리에게 일용할 양식을 주시옵고」가 나와요. 시험, 진로, 친구 문제를 놓고 기도해도 됩니다. 다만 기도가 소원 목록으로 끝나지 않게 해요. 기도는 하나님 아버지와 이야기하는 시간입니다."}], "questions": ["내 기도는 보통 「주세요」로 시작하나요, 「아버지」로 시작하나요?", "하나님이 내가 구하기 전에 다 아신다면, 나는 왜 기도할까요?"], "apply": "오늘 주기도문을 한 줄씩 천천히 읽어요. 한 줄을 읽을 때마다 내 말로 한 문장씩 기도를 덧붙여 봅니다.", "prayer": "하늘에 계신 아버지, 제 필요를 이미 아시니 감사해요. 소원만 말하는 기도가 아니라 아버지와 이야기하는 기도를 하게 해 주세요. 예수님 이름으로 기도합니다. 아멘."}, "kids": {"title": "예수님이 가르쳐 주신 기도", "lead": "예수님은 제자들에게 기도하는 법을 가르쳐 주셨어요.", "retell": ["예수님이 말씀하셨어요. “기도할 때 같은 말을 자꾸 되풀이하지 마라. 말을 많이 해야 하나님이 들으시는 게 아니란다. 너희가 구하기 전에 하나님 아버지께서 너희에게 무엇이 필요한지 다 아신단다.”", "그리고 이렇게 기도하라고 가르쳐 주셨어요. “하늘에 계신 우리 아버지, 아버지의 이름이 거룩히 여김을 받게 해 주세요. 아버지의 나라가 오게 해 주세요. 아버지의 뜻이 땅에서도 이루어지게 해 주세요. 오늘 먹을 양식을 주세요. 우리가 다른 사람을 용서한 것처럼 우리 죄도 용서해 주세요. 우리를 악에서 구해 주세요.”"], "explain": [{"k": "찾아보세요", "t": "하나님이 우리에게 필요한 것을 언제 아신다고 했나요? 8절에서 찾아 밑줄을 그어 보세요. 9절에서 예수님이 하나님을 무엇이라고 부르셨는지 찾아 ○표를 해 보세요."}, {"k": "생각해 보세요", "t": "엄마 아빠는 내가 배고프다고 말하기 전에 알아챌 때가 있어요. 하나님 아버지는 나를 더 잘 아세요. 그래서 우리는 하나님께 편하게 말씀드릴 수 있어요."}, {"k": "한 가지 더", "t": "예수님이 가르쳐 주신 기도에서는 「주세요」보다 「아버지」가 먼저 나와요. 먼저 하나님을 부르고, 그다음에 필요한 것을 말씀드려요."}], "questions": ["예수님은 기도할 때 무엇을 하지 말라고 하셨나요? (7절에서 찾아보세요)", "오늘 나에게 꼭 필요한 것 하나는 무엇인가요?"], "apply": "오늘 저녁 가족과 함께 주기도문을 천천히 한 번 따라 해요.", "prayer": "하늘에 계신 아버지, 제가 말하기 전에 다 알고 계셔서 고마워요. 오늘 ___이 필요해요. 아버지께 맡길게요. 예수님 이름으로 기도합니다. 아멘."}}, {"day_label": "금요일", "ref": "행 8:18-24", "passage": {"ref": "행 8:18-24", "label": "사도행전 8:18–24", "source": "개역개정", "verses": [{"v": 18, "text": "시몬이 사도들의 안수로 성령 받는 것을 보고 돈을 드려"}, {"v": 19, "text": "이르되 이 권능을 내게도 주어 누구든지 내가 안수하는 사람은 성령을 받게 하여 주소서 하니"}, {"v": 20, "text": "베드로가 이르되 네가 하나님의 선물을 돈 주고 살 줄로 생각하였으니 네 은과 네가 함께 망할지어다"}, {"v": 21, "text": "하나님 앞에서 네 마음이 바르지 못하니 이 도에는 네가 관계도 없고 분깃 될 것도 없느니라"}, {"v": 22, "text": "그러므로 너의 이 악함을 회개하고 주께 기도하라 혹 마음에 품은 것을 사하여 주시리라"}, {"v": 23, "text": "내가 보니 너는 악독이 가득하며 불의에 매인 바 되었도다"}, {"v": 24, "text": "시몬이 대답하여 이르되 나를 위하여 주께 기도하여 말한 것이 하나도 내게 임하지 않게 하소서 하니라"}]}, "adult": {"title": "하나님 앞에서 네 마음이 바르지 못하니", "lead": "베드로는 시몬이 구한 말이 아니라 하나님 앞에 선 시몬의 마음을 짚었습니다.", "explain": [{"k": "18–19절", "t": "빌립이 사마리아에서 복음을 전했습니다. 사마리아 사람들은 마술사 시몬을 「크다 일컫는 하나님의 능력」이라 불렀습니다(10절). 그런 시몬도 믿고 세례를 받았습니다(13절). 예루살렘에서 베드로와 요한이 내려와 안수하자 사마리아 사람들이 성령을 받았습니다. 시몬은 돈을 내밀며 구했습니다. 「이 권능을 내게도 주어.」 시몬은 성령을 받는 일보다 성령을 나누어 주는 권능에 마음을 두었습니다."}, {"k": "20절", "t": "베드로의 대답은 매우 엄합니다. 「네 은과 네가 함께 망할지어다.」 베드로는 이유를 밝힙니다. 「네가 하나님의 선물을 돈 주고 살 줄로 생각하였으니.」 「선물」은 도레아(δωρεά)입니다. 값없이 주는 선물을 뜻합니다. 사도행전은 이 낱말로 성령을 부릅니다(행 2:38, 11:17). 값을 치르고 산다면 더는 선물이 아닙니다."}, {"k": "21–23절", "t": "베드로는 시몬의 마음을 짚습니다. 「하나님 앞에서 네 마음이 바르지 못하니.」 「바르다」는 유튀스(εὐθύς)입니다. 「곧다」는 뜻입니다. 다메섹의 「직가」(곧은 거리, 행 9:11)도 같은 낱말입니다. 시몬의 마음은 하나님을 향해 곧게 서 있지 않았습니다. 그러나 베드로는 정죄로 끝내지 않았습니다. 「그러므로 너의 이 악함을 회개하고 주께 기도하라 혹 마음에 품은 것을 사하여 주시리라.」 하나님 앞에 나아갈 길은 시몬에게도 열려 있었습니다."}, {"k": "오늘 읽는 법", "t": "24절에서 시몬이 대답합니다. 「나를 위하여 주께 기도하여 말한 것이 하나도 내게 임하지 않게 하소서.」 베드로는 시몬에게 직접 주께 기도하라고 했습니다. 시몬은 사도들에게 대신 기도해 달라고 했습니다. 시몬이 바란 것은 벌을 피하는 일이었습니다. 본문은 시몬이 그 뒤에 어떻게 되었는지 말하지 않습니다. 시몬의 두 기도를 나란히 놓아 보십시오. 권능을 달라는 기도(19절)와 벌을 피하게 해 달라는 기도(24절)입니다. 두 기도 모두 시몬 자신의 유익을 구합니다. 베드로가 권한 기도는 마음을 고쳐 달라는 기도였습니다."}], "questions": ["교회 일이나 봉사를 두고 드리는 기도 가운데 나를 드러내려는 마음이 섞인 기도는 없습니까?", "베드로는 「주께 기도하라」고 했고 시몬은 「나를 위하여 기도하라」고 했습니다. 나는 하나님 앞에 직접 나아가기를 피하고 있지 않습니까?"], "apply": "오늘 내 기도 제목 하나를 골라 「나는 이 제목을 왜 구하는가?」를 종이에 적습니다. 그 동기에 내 욕심이 섞여 있다면 그 마음을 하나님께 그대로 아뢰고 바로잡아 달라고 구합니다.", "prayer": "하나님, 주님의 선물을 제 것으로 삼으려 한 마음을 고백합니다. 제 마음이 하나님 앞에서 곧게 서게 하소서. 벌을 피하려는 기도에 머물지 않고, 마음을 고치시는 주님께 직접 나아가게 하소서. 예수님 이름으로 기도합니다. 아멘."}, "youth": {"title": "돈으로 살 수 없는 선물", "lead": "시몬은 하나님의 선물을 돈으로 사려 했습니다.", "explain": [{"k": "", "t": "시몬은 원래 마술사였어요. 사람들은 시몬을 「하나님의 능력」이라 불렀습니다(10절). 시몬은 빌립의 전도를 듣고 믿고 세례를 받았어요. 그런데 사도들이 안수하자 사람들이 성령을 받았습니다. 시몬은 돈을 내밀었어요. 「이 권능을 내게도 주어.」"}, {"k": "", "t": "베드로가 답합니다. 「네가 하나님의 선물을 돈 주고 살 줄로 생각하였으니.」 성령은 하나님이 값없이 주시는 선물입니다. 시몬은 성령을 사람들 앞에서 자기를 높여 줄 능력으로 보았어요. 베드로는 「하나님 앞에서 네 마음이 바르지 못하니」라고 말합니다(21절). 하나님은 기도의 말과 함께 기도하는 마음을 보십니다."}, {"k": "", "t": "베드로는 「회개하고 주께 기도하라」고 했습니다(22절). 시몬은 「나를 위하여 기도해 달라」고 하며 벌 받지 않기만 바랐어요(24절). 우리도 인정받으려고 교회 일을 하거나 좋은 결과만 바라며 기도할 때가 있습니다. 그 마음을 하나님께 솔직하게 말씀드리면 회개가 시작됩니다."}], "questions": ["내가 기도하는 이유가 남에게 잘 보이려는 마음일 때가 있나요?", "잘못을 들켰을 때 나는 벌을 피할 생각을 먼저 하나요, 마음을 고칠 생각을 먼저 하나요?"], "apply": "오늘 내 기도 제목 하나를 골라 「내가 왜 이 일을 원할까?」 하고 스스로 물어봅니다. 폰 메모장에 답을 한 줄로 적어 봐요.", "prayer": "하나님, 하나님의 선물을 제 자랑거리로 쓰지 않게 해 주세요. 하나님 앞에서 제 마음을 바르게 고쳐 주세요. 예수님 이름으로 기도합니다. 아멘."}, "kids": {"title": "시몬이 돈을 내밀었어요", "lead": "하나님의 선물은 돈으로 살 수 없어요.", "retell": ["사마리아 사람 시몬은 빌립이 전한 예수님 이야기를 듣고 믿었어요. 베드로와 요한이 사람들 머리에 손을 얹고 기도하자 사람들이 성령을 받았어요. 시몬은 사람들이 성령을 받는 것을 보고 돈을 내밀며 말했어요. “나에게도 이 능력을 주세요. 내가 손을 얹는 사람도 성령을 받게 해 주세요.”", "베드로가 말했어요. “너는 하나님의 선물을 돈으로 살 수 있다고 생각했구나. 하나님 앞에서 네 마음이 바르지 않구나. 잘못을 뉘우치고 주님께 기도해라.” 시몬이 대답했어요. “나를 위해 주님께 기도해 주세요. 베드로님이 말한 일이 나에게 일어나지 않게 해 주세요.”"], "explain": [{"k": "찾아보세요", "t": "베드로는 성령을 무엇이라고 불렀나요? 20절에서 찾아 ○표를 해 보세요. 베드로가 시몬에게 하라고 한 일 두 가지를 22절에서 찾아 밑줄을 그어 보세요."}, {"k": "생각해 보세요", "t": "생일 선물은 돈을 내고 받는 물건이 아니에요. 주는 사람이 사랑해서 그냥 줘요. 하나님도 성령을 선물로 주세요. 돈으로도, 착한 일로도 살 수 없어요."}, {"k": "한 가지 더", "t": "시몬은 사람들에게 대단해 보이고 싶었어요. 하나님은 우리가 기도할 때 하는 말을 들으시고, 우리 마음도 보세요."}], "questions": ["베드로는 시몬의 마음이 어떻다고 했나요? (21절에서 찾아보세요)", "나는 기도할 때 무엇을 가장 많이 달라고 하나요?"], "apply": "오늘 기도할 때 “하나님, 제 마음을 바르게 해 주세요.” 하고 한 번 기도해요.", "prayer": "하나님, 하나님의 선물은 돈으로 살 수 없어요. 제가 ___ 때문에 자랑하고 싶을 때 제 마음을 바르게 해 주세요. 예수님 이름으로 기도합니다. 아멘."}}]};
const AGES = [["adult","청장년"],["youth","청소년"],["kids","어린이"]];
const state = { age: "adult", day: 0 };
const esc = s => String(s ?? "").replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const rich = s => esc(s).replace(/&lt;b&gt;/g,"<b>").replace(/&lt;\/b&gt;/g,"</b>");

function readHash(){
  const m = location.hash.match(/^#(adult|youth|kids)-(\d)$/);
  if (m) { state.age = m[1]; state.day = Math.min(DATA.days.length-1, Math.max(0, +m[2]-1)); return; }
  try { const s = JSON.parse(localStorage.getItem("qt-set-last")||"null"); if (s && AGES.some(a=>a[0]===s.age)) { state.age = s.age; state.day = Math.min(DATA.days.length-1, s.day|0); } } catch(e){}
}
function remember(){ try { localStorage.setItem("qt-set-last", JSON.stringify(state)); } catch(e){} history.replaceState(null,"",`#${state.age}-${state.day+1}`); }
function setAccent(){
  const r = document.documentElement.style;
  r.setProperty("--accent", `var(--a-${state.age})`); r.setProperty("--accent-soft", `var(--a-${state.age}-soft)`);
}
function renderTabs(){
  document.getElementById("ageTabs").innerHTML = AGES.map(([k,l]) => `<button role="tab" id="age-${k}" aria-selected="${state.age===k}" data-age="${k}">${l}</button>`).join("");
  document.getElementById("dayTabs").innerHTML = DATA.days.map((d,i) => `<button role="tab" id="day-${i}" aria-selected="${state.day===i}" data-day="${i}"><span>${esc(d.day_label)}</span><small>${esc(d.ref)}</small></button>`).join("");
}
function section(lbl, inner){ return `<section class="sec"><div class="lbl">${lbl}</div><div class="body">${inner}</div></section>`; }
function renderPanel(){
  const d = DATA.days[state.day]; const c = d[state.age];
  const verses = d.passage.verses.map(v => `<span class="v">${v.v}</span>${esc(v.text)} `).join("");
  let html = `<div class="head"><span class="ref">${esc(d.passage.label)}</span><h2>${esc(c.title)}</h2>${c.lead ? `<div class="lead">${rich(c.lead)}</div>` : ""}</div>`;
  html += `<div class="scripture"><p>${verses}</p><span class="src">${esc(d.passage.source)}</span></div>`;
  if (c.retell && c.retell.length) html += `<div class="retell"><span class="lbl">쉽게 읽기</span>${c.retell.map(p=>`<p>${rich(p)}</p>`).join("")}</div>`;
  html += section("설명", c.explain.map(p => `<p>${p.k ? `<span class="k">${esc(p.k)}</span>` : ""}${rich(p.t)}</p>`).join(""));
  html += section("묵상 질문", `<ol class="qs">${c.questions.map((q,i)=>`<li><span class="n">${i+1}</span><div>${rich(q)}<div class="fill"></div></div></li>`).join("")}</ol>`);
  html += section("적용", `<div class="apply">${rich(c.apply)}</div>`);
  html += section("기도", `<div class="prayer">${rich(c.prayer).replace(/___+/g,'<span class="blank"></span>')}</div>`);
  const last = state.day === DATA.days.length-1;
  html += `<div class="nav"><button id="prev" ${state.day===0?"disabled":""}>← 이전</button><button id="next" ${last?"disabled":""}>다음 →</button></div>`;
  document.getElementById("panel").innerHTML = html;
}
function render(){ setAccent(); renderTabs(); renderPanel(); remember(); document.title = `${DATA.set_title} · ${AGES.find(a=>a[0]===state.age)[1]}`; }
document.getElementById("eyebrow").textContent = DATA.eyebrow || "";
document.getElementById("setTitle").textContent = DATA.set_title;
document.getElementById("sermonLine").innerHTML = DATA.sermon ? `이번 주 설교 <b>${esc(DATA.sermon.title)}</b> · ${esc(DATA.sermon.ref)}${DATA.sermon.date ? ` · ${esc(DATA.sermon.date)}` : ""}` : "";
document.getElementById("foot").innerHTML = rich(DATA.footer || "");
document.getElementById("app").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.age) state.age = b.dataset.age;
  else if (b.dataset.day) state.day = +b.dataset.day;
  else if (b.id === "prev") state.day--; else if (b.id === "next") state.day++; else return;
  render(); if (b.dataset.day !== undefined || b.id === "prev" || b.id === "next") document.getElementById("panel").scrollIntoView({block:"start", behavior:"smooth"});
});
window.addEventListener("hashchange", () => { readHash(); render(); });
readHash(); render();
</script>

</body>
</html>
