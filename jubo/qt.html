<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>내일을 붙드시는 손</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@500;700&display=swap">
<style>
  :root {
    --bg: #f9f7f2; --paper: #ffffff; --ink: #1e2a2b; --muted: #66716f; --line: #e4dfd4; --soft: #f1ede4;
    --a-adult: #2f6b6f; --a-youth: #4b5ea8; --a-kids: #c9612e;
    --a-adult-soft: #e6f0f0; --a-youth-soft: #e9ecf8; --a-kids-soft: #fbeae0;
    --sans: 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    --serif: 'Noto Serif KR', 'Apple Myungjo', 'Batang', serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #15191a; --paper: #1d2324; --ink: #ece7dc; --muted: #9aa5a3; --line: #2f3739; --soft: #242c2d;
      --a-adult: #7fc2c5; --a-youth: #a4b0ee; --a-kids: #f0a074;
      --a-adult-soft: #1f2f30; --a-youth-soft: #23283b; --a-kids-soft: #362820;
    }
  }
  :root[data-theme="dark"] {
    --bg: #15191a; --paper: #1d2324; --ink: #ece7dc; --muted: #9aa5a3; --line: #2f3739; --soft: #242c2d;
    --a-adult: #7fc2c5; --a-youth: #a4b0ee; --a-kids: #f0a074;
    --a-adult-soft: #1f2f30; --a-youth-soft: #23283b; --a-kids-soft: #362820;
  }
  html, body { background: var(--bg); color: var(--ink); }
  body { margin: 0; font-family: var(--sans); font-size: 16px; line-height: 1.75; -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 720px; margin: 0 auto; padding-block: 0 64px; padding-inline: 18px; }
  .top { padding-block: 26px 14px; display: flex; flex-direction: column; gap: 6px; }
  .top .eyebrow { font-size: 12px; letter-spacing: .12em; color: var(--muted); font-weight: 500; }
  .top h1 { font-family: var(--serif); font-size: 24px; font-weight: 700; margin: 0; line-height: 1.3; text-wrap: balance; }
  .top .sermon { font-size: 14px; color: var(--muted); }
  .top .sermon b { color: var(--ink); font-weight: 500; }

  .sticky { position: sticky; top: env(safe-area-inset-top, 0px); background: var(--bg); z-index: 5; padding-block: 10px 12px; display: flex; flex-direction: column; gap: 10px; border-bottom: 1px solid var(--line); }
  .seg { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0; border: 1.5px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--paper); }
  .seg button { appearance: none; border: 0; background: transparent; color: var(--muted); font: inherit; font-size: 15px; font-weight: 500; min-height: 44px; cursor: pointer; }
  .seg button + button { border-left: 1.5px solid var(--line); }
  .seg button[aria-selected="true"] { color: #fff; background: var(--accent); }
  .seg button:focus-visible { outline: 2px solid var(--accent); outline-offset: -3px; }
  .days { display: flex; gap: 8px; }
  .days button { appearance: none; flex: 1; border: 1.5px solid var(--line); background: var(--paper); color: var(--muted); border-radius: 10px; min-height: 44px; font: inherit; font-size: 14px; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.2; gap: 2px; padding: 4px 6px; }
  .days button small { font-size: 11px; opacity: .8; }
  .days button[aria-selected="true"] { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); font-weight: 700; }
  .days button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .panel { display: flex; flex-direction: column; gap: 22px; padding-block: 26px 0; }
  .head { display: flex; flex-direction: column; gap: 8px; }
  .head .ref { display: inline-flex; align-self: flex-start; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; color: var(--accent); background: var(--accent-soft); padding: 4px 12px; border-radius: 999px; }
  .head h2 { font-family: var(--serif); font-size: 28px; line-height: 1.25; margin: 0; font-weight: 700; text-wrap: balance; }
  .head .lead { font-size: 15px; color: var(--muted); }

  .scripture { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 20px 22px; font-family: var(--serif); font-size: 17px; line-height: 1.95; }
  .scripture p { margin: 0; }
  .scripture .v { font-family: var(--sans); font-size: 11px; font-weight: 700; color: var(--accent); vertical-align: super; margin-right: 3px; }
  .scripture .src { display: block; margin-top: 12px; font-family: var(--sans); font-size: 12px; color: var(--muted); text-align: right; }
  .ask2 { display: flex; flex-wrap: wrap; gap: 4px 16px; padding: 0 4px; font-size: 14.5px; line-height: 1.6; color: var(--muted); }
  .ask2 .lbl { width: 100%; font-size: 12px; font-weight: 700; color: var(--accent); letter-spacing: .06em; }
  .ask2 .q::before { content: "○ "; color: var(--accent); }
  .retell { background: var(--accent-soft); border-radius: 14px; padding: 18px 20px; font-size: 16px; }
  .retell .lbl { font-size: 12px; font-weight: 700; color: var(--accent); letter-spacing: .08em; display: block; margin-bottom: 6px; }
  .retell p { margin: 0 0 8px; } .retell p:last-child { margin-bottom: 0; }

  .sec { display: grid; grid-template-columns: 84px minmax(0, 1fr); gap: 14px; padding-block: 18px; border-top: 1px solid var(--line); }
  .sec .lbl { font-size: 13px; font-weight: 700; color: var(--accent); letter-spacing: .06em; padding-top: 3px; }
  .sec .body { display: flex; flex-direction: column; gap: 10px; }
  .sec p { margin: 0; }
  .sec .k { font-weight: 700; color: var(--accent); margin-right: 6px; }
  .qs { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px; }
  .qs li { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 6px; }
  .qs li .n { width: 24px; height: 24px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); font-size: 12px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; margin-top: 4px; }
  .fill { border-bottom: 1.5px dashed var(--line); min-height: 34px; }
  .apply { background: var(--soft); border-radius: 12px; padding: 14px 16px; }
  .prayer { font-family: var(--serif); font-size: 16.5px; line-height: 1.9; }
  .prayer .blank { display: inline-block; min-width: 140px; border-bottom: 1.5px solid var(--line); }
  .nav { display: flex; justify-content: space-between; gap: 12px; padding-top: 10px; }
  .nav button { appearance: none; border: 1.5px solid var(--line); background: var(--paper); color: var(--ink); border-radius: 999px; min-height: 44px; padding: 0 18px; font: inherit; font-size: 14px; cursor: pointer; }
  .nav button:disabled { opacity: .35; cursor: default; }
  .foot { margin-top: 40px; font-size: 12px; color: var(--muted); text-align: center; line-height: 1.6; }
  @media (max-width: 480px) {
    .sec { grid-template-columns: 1fr; gap: 6px; }
    .head h2 { font-size: 24px; }
    .scripture { padding: 16px 18px; font-size: 16px; }
  }
  @media (prefers-reduced-motion: no-preference) { .panel { animation: in .25s ease; } @keyframes in { from { opacity: .4; transform: translateY(4px); } to { opacity: 1; transform: none; } } }
</style>
</head>
<body>

<div class="wrap" id="app">
  <header class="top">
    <div class="eyebrow" id="eyebrow"></div>
    <h1 id="setTitle"></h1>
    <div class="sermon" id="sermonLine"></div>
  </header>
  <div class="sticky">
    <div class="seg" role="tablist" aria-label="대상" id="ageTabs"></div>
    <div class="days" role="tablist" aria-label="날" id="dayTabs"></div>
  </div>
  <main class="panel" id="panel"></main>
  <footer class="foot" id="foot"></footer>
</div>

<script>
const DATA = {"set_title": "내일을 붙드시는 손", "eyebrow": "이번 주 QT · 11월 다섯째 주", "sermon": {"title": "내일 일을 알지 못하는도다", "ref": "야고보서 4:13-16", "date": "2026. 11. 29"}, "footer": "성경전서 개역개정판 © 대한성서공회 · 진중교회", "days": [{"day_label": "월요일", "ref": "시 31:14-18", "passage": {"ref": "시 31:14-18", "label": "시편 31:14–18", "source": "개역개정", "verses": [{"v": 14, "text": "여호와여 그러하여도 나는 주께 의지하고 말하기를 주는 내 하나님이시라 하였나이다"}, {"v": 15, "text": "나의 앞날이 주의 손에 있사오니 내 원수들과 나를 핍박하는 자들의 손에서 나를 건져 주소서"}, {"v": 16, "text": "주의 얼굴을 주의 종에게 비추시고 주의 사랑하심으로 나를 구원하소서"}, {"v": 17, "text": "여호와여 내가 주를 불렀사오니 나를 부끄럽게 하지 마시고 악인들을 부끄럽게 하사 스올에서 잠잠하게 하소서"}, {"v": 18, "text": "교만하고 완악한 말로 무례히 의인을 치는 거짓 입술이 말 못하는 자 되게 하소서"}]}, "adult": {"title": "나의 앞날이 주의 손에 있사오니", "lead": "주일 설교가 인용한 다윗의 고백입니다. 다윗은 원수에게 둘러싸인 날에 자기 때를 하나님 손에 두었습니다.", "explain": [{"k": "배경", "t": "시편 31편은 「다윗의 시」입니다. 9–13절에서 다윗은 깊은 곤경을 털어놓습니다. 슬픔으로 눈과 몸이 쇠했습니다. 이웃은 그를 조롱했고, 아는 사람들은 그를 피했습니다. 원수들은 그의 생명을 빼앗으려 꾀했습니다(13절). 같은 시편 5절에는 예수님이 십자가에서 드린 마지막 기도가 들어 있습니다. 「내가 나의 영을 주의 손에 부탁하나이다」(눅 23:46)."}, {"k": "14–15절", "t": "14절은 「그러하여도」로 시작합니다. 형편은 그대로였습니다. 다윗은 그 한가운데서 「주는 내 하나님이시라」고 고백합니다. 15절의 「앞날」은 히브리어로 「때(עֵת)」의 복수형입니다. 직역하면 「나의 때들이 주의 손에 있습니다」입니다. 앞으로 올 날만 가리키지 않습니다. 다윗이 지나는 좋은 때와 괴로운 때가 다 하나님 손에 있습니다."}, {"k": "16–18절", "t": "다윗은 고백에서 간구로 나아갑니다. 「주의 얼굴을 주의 종에게 비추시고」(16절)는 제사장의 축복(민 6:25)에 나오는 말입니다. 다윗은 자기 힘으로 원수를 이기려 하지 않았습니다. 하나님께 건져 달라고 부르짖었습니다. 거짓 입술을 잠잠하게 하시는 일도 하나님께 맡겼습니다."}, {"k": "오늘 읽는 법", "t": "주일에 야고보는 내일을 자기 것이라 자랑하는 사람들을 꾸짖었습니다. 다윗은 반대로 자기 때를 하나님 손에 맡겼습니다. 다윗도 내일을 몰랐습니다. 그러나 내일이 누구 손에 있는지는 알았습니다. 내 손에 꼭 쥐고 있는 날들을 하나님 손으로 옮겨 드리며 읽으십시오."}], "questions": ["지금 내 손으로 붙잡고 놓지 못하는 계획이나 걱정은 무엇입니까?", "형편이 바뀌지 않았는데도 「그러하여도 주는 내 하나님이시라」고 고백해야 할 일은 무엇입니까?"], "apply": "오늘 이번 주 일정표를 펴고 맨 위에 「나의 앞날이 주의 손에 있사오니」(15절)를 적습니다. 걱정되는 일 하나를 골라 이 구절로 짧게 기도합니다.", "prayer": "주님, 저의 때가 주님 손에 있습니다. 형편이 바뀌지 않아도 주님은 제 하나님이십니다. 주의 얼굴을 저에게 비추시고 주의 사랑으로 저를 붙들어 주소서. 예수님 이름으로 기도합니다. 아멘."}, "youth": {"title": "내 시간은 누구 손에 있을까요", "lead": "다윗은 힘든 날에도 자기 시간을 하나님 손에 맡겼어요.", "explain": [{"k": "", "t": "다윗은 이 시를 쓸 때 몹시 힘들었어요. 사람들이 다윗을 비웃었고, 아는 사람들도 다윗을 피했어요(11절). 어떤 사람들은 다윗을 해치려고 꾀를 냈어요(13절). 다윗의 형편은 하루아침에 나아지지 않았어요."}, {"k": "", "t": "그런데 14절이 「그러하여도」로 시작해요. 다윗은 형편이 그대로인데도 「주는 내 하나님이시라」고 고백해요. 15절의 「앞날」은 원래 「나의 때들」이라는 말이에요. 다윗의 좋은 날도 괴로운 날도 다 하나님 손에 있다는 고백이에요."}, {"k": "", "t": "시험 결과, 진로, 친구 관계처럼 내일이 걱정될 때가 있어요. 우리는 내일을 다 알 수 없어요. 그러나 우리의 시간을 쥐고 계신 분이 하나님이라는 사실은 알 수 있어요. 다윗은 힘든 날에 걱정을 혼자 붙들지 않고 하나님께 먼저 말씀드렸어요(17절)."}], "questions": ["요즘 내 마음을 가장 무겁게 하는 내일의 일은 무엇인가요?", "그 일을 두고 「그러하여도 주는 내 하나님이시라」고 기도한다면 어떤 말로 기도하고 싶나요?"], "apply": "오늘 휴대폰 메모장에 「나의 앞날이 주의 손에 있사오니」(15절)를 적어 두어요. 걱정이 올라올 때마다 한 번씩 읽어요.", "prayer": "하나님, 저는 내일 일을 다 몰라요. 그래도 제 시간이 하나님 손에 있다고 믿어요. 걱정될 때마다 하나님께 먼저 말하게 해 주세요. 예수님 이름으로 기도합니다. 아멘."}, "kids": {"title": "내 하루는 하나님 손에 있어요", "lead": "다윗은 무서운 날에도 하나님을 믿었어요.", "retell": ["다윗은 아주 힘든 날을 보내고 있었어요. 사람들이 다윗을 놀렸고, 아는 사람들도 다윗을 멀리했어요. 다윗을 해치려는 사람들도 있었어요.", "그래도 다윗은 기도했어요. “하나님, 그래도 하나님은 내 하나님이세요. 내 앞날이 하나님 손에 있어요. 나를 건져 주세요. 하나님의 사랑으로 나를 구해 주세요.” 다윗은 하나님께 소리 내어 부르짖었어요. 다윗은 하나님이 자기 기도를 들으신다고 믿었어요."], "explain": [{"k": "찾아보세요", "t": "15절에서 「주의 손」을 찾아 ○표를 해 보세요. 14절에서 다윗이 하나님을 무엇이라고 불렀는지 찾아 밑줄을 그어 보세요."}, {"k": "생각해 보세요", "t": "어린 동생은 엄마 아빠 손을 잡고 길을 걸어요. 길이 어디로 가는지 몰라도 무섭지 않아요. 손을 잡아 주는 엄마 아빠를 믿기 때문이에요. 다윗도 내일을 몰랐지만 하나님 손을 믿었어요."}, {"k": "한 가지 더", "t": "다윗의 힘든 일은 바로 없어지지 않았어요. 그래도 다윗은 하나님께 먼저 말씀드렸어요(17절). 우리도 걱정이 생기면 하나님께 먼저 말씀드릴 수 있어요."}], "questions": ["다윗은 자기 앞날이 누구 손에 있다고 했나요? (15절에서 찾아보세요)", "내일 일 가운데 걱정되는 일이 있나요? 하나님께 말씀드려 볼까요?"], "apply": "오늘 밤 자기 전에 내일 할 일 하나를 하나님께 말씀드려요.", "prayer": "하나님, 내 하루는 하나님 손에 있어요. 내일 ___ 일이 걱정돼요. 하나님이 내 손을 꼭 잡아 주세요. 예수님 이름으로 기도합니다. 아멘."}}, {"day_label": "수요일", "ref": "마 6:31-34", "passage": {"ref": "마 6:31-34", "label": "마태복음 6:31–34", "source": "개역개정", "verses": [{"v": 31, "text": "그러므로 염려하여 이르기를 무엇을 먹을까 무엇을 마실까 무엇을 입을까 하지 말라"}, {"v": 32, "text": "이는 다 이방인들이 구하는 것이라 너희 하늘 아버지께서 이 모든 것이 너희에게 있어야 할 줄을 아시느니라"}, {"v": 33, "text": "그런즉 너희는 먼저 그의 나라와 그의 의를 구하라 그리하면 이 모든 것을 너희에게 더하시리라"}, {"v": 34, "text": "그러므로 내일 일을 위하여 염려하지 말라 내일 일은 내일이 염려할 것이요 한 날의 괴로움은 그 날로 족하니라"}]}, "adult": {"title": "내일 일은 내일이 염려할 것이요", "lead": "예수님은 내일을 모르는 제자들에게 하늘 아버지가 아신다고 말씀하셨습니다.", "explain": [{"k": "배경", "t": "산상수훈의 한 단락입니다(마 5–7장). 예수님은 산에 올라 제자들과 무리에게 말씀하셨습니다(5:1). 듣는 사람 대부분은 그날 일해 그날 먹었습니다. 먹을 것과 입을 것은 날마다 닥치는 걱정이었습니다. 예수님은 25절부터 공중의 새와 들의 백합화를 보라 하셨습니다. 하나님이 새를 먹이시고 들풀을 입히십니다."}, {"k": "31–32절", "t": "「염려하다(μεριμνάω)」는 이 단락에 다섯 번 나옵니다(25, 27, 28, 31, 34절). 예수님은 이 낱말을 거듭 쓰시며 제자들의 마음을 짚으셨습니다. 먹고 마시고 입는 일은 이방인들도 구합니다. 제자가 다른 까닭은 하나입니다. 「너희 하늘 아버지께서 … 있어야 할 줄을 아시느니라」(32절). 제자는 내일을 아는 사람이 아닙니다. 내일을 아시는 아버지를 둔 사람입니다."}, {"k": "33절", "t": "예수님은 걱정을 없애라고만 하지 않으셨습니다. 마음을 둘 곳을 바꾸라 하셨습니다. 「먼저 그의 나라와 그의 의를 구하라」. 하나님 나라는 하나님이 다스리시는 나라입니다. 하나님의 다스림을 먼저 구하는 사람에게 하나님이 필요한 것을 더하십니다."}, {"k": "오늘 읽는 법", "t": "34절은 계획을 버리라는 말씀이 아닙니다. 예수님은 망대를 세우기 전에 비용을 계산하라고도 하셨습니다(눅 14:28). 예수님은 내일의 짐을 오늘로 끌어와 지지 말라 하셨습니다. 야고보의 「주의 뜻이면」과 예수님의 「아버지께서 아시느니라」는 같은 믿음을 말합니다."}], "questions": ["요즘 나는 내일의 어떤 일을 오늘로 끌어와 짊어지고 있습니까?", "「먼저 그의 나라와 그의 의를 구하라」는 말씀대로라면, 이번 주 내 계획표에서 무엇을 맨 앞에 두어야 합니까?"], "apply": "오늘 걱정되는 일을 종이에 적고 그 옆에 「하늘 아버지께서 아시느니라」(32절)를 씁니다. 그리고 오늘 할 일 하나만 골라 합니다. 먹을 것과 입을 것이 걱정인 이웃 한 사람도 기억하고 기도합니다.", "prayer": "하늘 아버지, 제게 무엇이 있어야 하는지 아버지께서 아십니다. 내일을 미리 짊어지고 무거워하던 마음을 내려놓습니다. 오늘 먼저 아버지의 나라와 의를 구하게 하소서. 예수님 이름으로 기도합니다. 아멘."}, "youth": {"title": "걱정을 미리 당겨 쓰지 않기", "lead": "예수님은 내일 걱정을 오늘 다 짊어지지 말라고 하셨어요.", "explain": [{"k": "", "t": "예수님 말씀을 듣던 사람들 대부분은 그날 일해서 그날 먹었어요. 내일 먹을 것과 입을 것이 늘 걱정이었어요. 예수님은 그 사람들에게 하늘을 나는 새와 들에 핀 꽃을 보라고 하셨어요(26, 28절). 하나님이 새를 먹이시고 꽃을 입히세요."}, {"k": "", "t": "32절이 이 본문의 중심이에요. 「너희 하늘 아버지께서 이 모든 것이 너희에게 있어야 할 줄을 아시느니라」. 우리가 내일을 다 알 필요는 없어요. 우리를 아시는 아버지가 계세요. 예수님은 하나님을 「하늘 아버지」라고 부르셨어요. 아버지는 자녀에게 무엇이 필요한지 미리 알고 챙겨요."}, {"k": "", "t": "34절은 공부 계획이나 진로 준비를 하지 말라는 뜻이 아니에요. 아직 오지 않은 일을 미리 걱정하다 오늘을 놓치지 말라는 뜻이에요. 오늘 하나님 나라를 먼저 구하면 하나님이 필요한 것을 채우세요."}], "questions": ["아직 일어나지 않았는데 미리 걱정하고 있는 일이 있나요?", "오늘 하루 「하나님 나라를 먼저 구한다」는 말씀은 나에게 어떤 행동일까요?"], "apply": "오늘 걱정이 떠오르면 휴대폰을 내려놓고 30초 동안 「아버지께서 아세요」 하고 기도해요.", "prayer": "하나님 아버지, 저는 내일이 걱정될 때가 많아요. 아버지께서 제게 필요한 것을 아신다고 믿게 해 주세요. 오늘 하루를 아버지께 먼저 드리게 해 주세요. 예수님 이름으로 기도합니다. 아멘."}, "kids": {"title": "하나님 아버지가 다 아세요", "lead": "예수님은 내일 일을 걱정하지 말라고 하셨어요.", "retell": ["예수님이 산에서 사람들에게 말씀하셨어요. 바로 앞에서 예수님은 하늘을 나는 새와 들에 핀 꽃을 보라고 하셨어요. 하나님이 새를 먹이시고 꽃을 예쁘게 입히세요.", "예수님이 말씀하셨어요. “무엇을 먹을까, 무엇을 입을까 걱정하지 마세요. 하늘 아버지께서 여러분에게 무엇이 필요한지 다 아세요. 먼저 하나님 나라를 구하세요. 내일 일은 내일 걱정하세요.” 예수님은 하나님이 우리를 사랑하는 아버지라고 알려 주셨어요."], "explain": [{"k": "찾아보세요", "t": "32절에서 「아시느니라」를 찾아 ○표를 해 보세요. 33절에서 「먼저」를 찾아 밑줄을 그어 보세요."}, {"k": "생각해 보세요", "t": "소풍 가는 날 엄마 아빠가 도시락을 챙겨 주세요. 우리는 도시락 걱정을 하지 않고 신나게 놀아요. 하나님은 엄마 아빠보다 우리를 더 잘 아세요. 그래서 우리는 걱정 대신 하나님께 말씀드릴 수 있어요."}, {"k": "한 가지 더", "t": "예수님은 「한 날의 괴로움은 그 날로 족하니라」(34절)고 하셨어요. 오늘 일은 오늘 하나님께 맡기면 돼요. 내일 일은 내일 또 하나님께 맡기면 돼요."}], "questions": ["하늘 아버지께서 무엇을 아신다고 했나요? (32절에서 찾아보세요)", "요즘 걱정되는 일이 있나요? 하나님 아버지께 말씀드려 볼까요?"], "apply": "오늘 걱정되는 일이 생기면 「하나님 아버지가 아세요」 하고 말해요.", "prayer": "하나님 아버지, 저에게 무엇이 필요한지 다 아시지요. 저는 ___ 일이 걱정돼요. 걱정 대신 하나님을 믿게 해 주세요. 예수님 이름으로 기도합니다. 아멘."}}, {"day_label": "금요일", "ref": "벧전 5:6-11", "passage": {"ref": "벧전 5:6-11", "label": "베드로전서 5:6–11", "source": "개역개정", "verses": [{"v": 6, "text": "그러므로 하나님의 능하신 손 아래에서 겸손하라 때가 되면 너희를 높이시리라"}, {"v": 7, "text": "너희 염려를 다 주께 맡기라 이는 그가 너희를 돌보심이라"}, {"v": 8, "text": "근신하라 깨어라 너희 대적 마귀가 우는 사자 같이 두루 다니며 삼킬 자를 찾나니"}, {"v": 9, "text": "너희는 믿음을 굳건하게 하여 그를 대적하라 이는 세상에 있는 너희 형제들도 동일한 고난을 당하는 줄을 앎이라"}, {"v": 10, "text": "모든 은혜의 하나님 곧 그리스도 안에서 너희를 부르사 자기의 영원한 영광에 들어가게 하신 이가 잠깐 고난을 당한 너희를 친히 온전하게 하시며 굳건하게 하시며 강하게 하시며 터를 견고하게 하시리라"}, {"v": 11, "text": "권능이 세세무궁하도록 그에게 있을지어다 아멘"}]}, "adult": {"title": "너희 염려를 다 주께 맡기라", "lead": "베드로는 흩어진 성도들에게 염려를 하나님께 던지라고 했습니다. 하나님이 그들을 돌보시기 때문입니다.", "explain": [{"k": "배경", "t": "베드로는 소아시아 여러 지방에 흩어진 나그네 성도들에게 이 편지를 썼습니다(1:1). 성도들은 그리스도의 이름 때문에 치욕을 당했습니다(4:14). 내일이 어떻게 될지 장담할 수 없는 사람들이었습니다. 바로 앞에서 베드로는 장로들과 젊은 자들에게 서로 겸손하라고 권합니다(5:1–5)."}, {"k": "6–7절", "t": "「하나님의 능하신 손 아래에서 겸손하라」(6절). 겸손한 사람은 내일을 제 손에 쥐지 않고 하나님 손에 둡니다. 7절의 「맡기라(ἐπιρρίπτω)」는 신약에 두 번 나옵니다. 다른 한 번은 제자들이 나귀 새끼 위에 겉옷을 「걸쳐 놓고」 예수님을 태운 장면입니다(눅 19:35). 염려를 손에 쥐고 있지 말고 하나님께 던져 얹으라는 말입니다. 까닭은 하나입니다. 「그가 너희를 돌보심이라」."}, {"k": "8–10절", "t": "베드로는 맡기라는 말 바로 뒤에 「근신하라 깨어라」(8절)를 둡니다. 염려를 맡긴 사람은 손을 놓고 잠들지 않습니다. 깨어 믿음을 굳게 지킵니다. 베드로는 성도의 고난을 「잠깐」이라 부릅니다(10절). 야고보가 우리 생명을 「잠깐 보이다가 없어지는 안개」라 할 때 쓴 「잠깐(ὀλίγον)」과 같은 낱말입니다. 고난은 잠깐이고, 하나님이 부르신 영광은 영원합니다."}, {"k": "오늘 읽는 법", "t": "10절의 주어는 하나님입니다. 하나님이 「온전하게 하시며 굳건하게 하시며 강하게 하시며 터를 견고하게 하시리라」. 내일을 세우시는 분은 하나님이십니다. 대림절은 다시 오실 주님을 기다리는 절기입니다. 성도는 잠깐의 고난 속에서 영원한 영광을 기다립니다."}], "questions": ["내가 아직 손에 꼭 쥐고 하나님께 던져 드리지 못한 염려는 무엇입니까?", "「그가 너희를 돌보심이라」는 말씀을 믿는다면 이번 주 내 말과 행동에서 무엇이 달라지겠습니까?"], "apply": "오늘 가장 무거운 염려 하나를 소리 내어 하나님께 말씀드리고 「주께 맡깁니다」로 기도를 맺습니다. 같은 염려로 힘든 이웃이 있으면 7절을 문자로 보내고 그 이웃을 위해 기도합니다.", "prayer": "모든 은혜의 하나님, 제 염려를 다 주께 맡깁니다. 주님이 저를 돌보십니다. 잠깐의 고난 속에서 저를 온전하게 하시고 굳건하게 하소서. 다시 오실 주님을 깨어 기다리게 하소서. 예수님 이름으로 기도합니다. 아멘."}, "youth": {"title": "걱정은 던져 드려도 괜찮아요", "lead": "하나님은 우리가 걱정을 맡기기를 바라세요.", "explain": [{"k": "", "t": "베드로는 여러 지방에 흩어져 사는 그리스도인들에게 이 편지를 썼어요. 그들은 예수님을 믿는다는 이유로 욕을 들었어요(4:14). 내일이 어떻게 될지 몰라 불안한 사람들이었어요. 베드로도 예수님을 세 번 모른다고 했어요. 그런 베드로를 예수님이 다시 일으켜 세우셨어요."}, {"k": "", "t": "7절의 「맡기라」는 원래 무엇을 던져 얹는다는 말이에요. 제자들이 나귀 위에 겉옷을 걸칠 때 같은 말을 썼어요(눅 19:35). 걱정을 꼭 쥐고 혼자 끙끙대지 말고 하나님께 던져 드리라는 뜻이에요. 하나님이 나를 돌보시기 때문이에요."}, {"k": "", "t": "걱정을 맡긴 다음에도 정신을 차리고 깨어 있어야 해요(8절). 하나님은 힘든 시간이 「잠깐」이라고 하세요(10절). 그리고 하나님이 직접 우리를 굳세게 세워 주세요. 혼자 힘으로 버티라는 말이 아니에요."}], "questions": ["혼자 꼭 쥐고 있어서 지친 걱정이 있나요?", "그 걱정을 하나님께 던져 드린다면 어떤 말로 기도하고 싶나요?"], "apply": "오늘 걱정 하나를 종이에 적어 기도한 뒤 접어서 성경책에 끼워 두어요. 비슷한 걱정을 하는 친구가 있으면 7절을 보내 줘요.", "prayer": "하나님, 제가 꼭 쥐고 있던 걱정을 하나님께 맡겨요. 하나님이 저를 돌보신다고 믿어요. 힘든 시간에도 저를 굳세게 해 주세요. 예수님 이름으로 기도합니다. 아멘."}, "kids": {"title": "하나님께 걱정을 맡겨요", "lead": "하나님은 우리를 돌보세요.", "retell": ["베드로는 예수님의 제자였어요. 베드로는 멀리 흩어져 사는 성도들에게 편지를 썼어요. 그 성도들은 예수님을 믿는다고 놀림을 받았어요. 마음이 무겁고 걱정이 많았어요.", "베드로는 편지에 이렇게 썼어요. “걱정을 다 하나님께 맡기세요. 하나님이 여러분을 돌보세요. 힘든 시간은 잠깐이에요. 하나님이 여러분을 튼튼하게 세워 주세요.” 베드로는 성도들이 하나님을 믿고 힘을 내기를 바랐어요."], "explain": [{"k": "찾아보세요", "t": "7절에서 「맡기라」를 찾아 ○표를 해 보세요. 7절 끝에서 하나님이 우리를 어떻게 하신다고 했는지 찾아 밑줄을 그어 보세요."}, {"k": "생각해 보세요", "t": "무거운 가방을 메고 걸으면 금방 지쳐요. 아빠가 「가방 이리 줘」 하시면 가방을 건네고 가볍게 걸어요. 하나님은 우리의 무거운 걱정을 받아 주세요."}, {"k": "한 가지 더", "t": "10절에서 하나님은 힘든 시간이 「잠깐」이라고 하셨어요. 하나님이 우리를 튼튼하게 세워 주세요. 걱정이 다시 생기면 또 맡기면 돼요."}], "questions": ["하나님은 우리를 어떻게 하신다고 했나요? (7절에서 찾아보세요)", "오늘 하나님께 맡기고 싶은 걱정은 무엇인가요?"], "apply": "오늘 걱정 하나를 하나님께 말씀드리고 「하나님께 맡겨요」 하고 말해요.", "prayer": "하나님, 저를 돌보아 주셔서 감사해요. 제 걱정 ___ 을 하나님께 맡겨요. 마음을 가볍게 해 주세요. 예수님 이름으로 기도합니다. 아멘."}}]};

const esc = s => String(s ?? "").replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const rich = s => esc(s).replace(/&lt;b&gt;/g,"<b>").replace(/&lt;\/b&gt;/g,"</b>");

function readHash(){
  const m = location.hash.match(/^#(adult|youth|kids)-(\d)$/);
  if (m) { state.age = m[1]; state.day = Math.min(DATA.days.length-1, Math.max(0, +m[2]-1)); return; }
  try { const s = JSON.parse(localStorage.getItem("qt-set-last")||"null"); if (s && AGES.some(a=>a[0]===s.age)) { state.age = s.age; state.day = Math.min(DATA.days.length-1, s.day|0); } } catch(e){}
}
function remember(){ try { localStorage.setItem("qt-set-last", JSON.stringify(state)); } catch(e){} history.replaceState(null,"",`#${state.age}-${state.day+1}`); }
function setAccent(){
  const r = document.documentElement.style;
  r.setProperty("--accent", `var(--a-${state.age})`); r.setProperty("--accent-soft", `var(--a-${state.age}-soft)`);
}
function renderTabs(){
  document.getElementById("ageTabs").innerHTML = AGES.map(([k,l]) => `<button role="tab" id="age-${k}" aria-selected="${state.age===k}" data-age="${k}">${l}</button>`).join("");
  document.getElementById("dayTabs").innerHTML = DATA.days.map((d,i) => `<button role="tab" id="day-${i}" aria-selected="${state.day===i}" data-day="${i}"><span>${esc(d.day_label)}</span><small>${esc(d.ref)}</small></button>`).join("");
}
function section(lbl, inner){ return `<section class="sec"><div class="lbl">${lbl}</div><div class="body">${inner}</div></section>`; }
function renderPanel(){
  const d = DATA.days[state.day]; const c = d[state.age];
  const verses = d.passage.verses.map(v => `<span class="v">${v.v}</span>${esc(v.text)} `).join("");
  let html = `<div class="head"><span class="ref">${esc(d.passage.label)}</span><h2>${esc(c.title)}</h2>${c.lead ? `<div class="lead">${rich(c.lead)}</div>` : ""}</div>`;
  html += `<div class="scripture"><p>${verses}</p><span class="src">${esc(d.passage.source)}</span></div>`;
  // 매일성경처럼 본문을 읽으며 붙드는 두 질문 — 매주 같다(2026-10-24 사용자 요청). 어린이는 쉬운 말로
  const ASK2 = state.age === "kids" ? ["하나님은 어떤 분이세요?", "나에게 무엇을 가르쳐 주세요?"] : ["하나님은 어떤 분이신가?", "나(우리)에게 주시는 교훈은 무엇인가?"];
  html += `<div class="ask2"><span class="lbl">본문을 읽으며</span>${ASK2.map(q=>`<span class="q">${q}</span>`).join("")}</div>`;
  if (c.retell && c.retell.length) html += `<div class="retell"><span class="lbl">쉽게 읽기</span>${c.retell.map(p=>`<p>${rich(p)}</p>`).join("")}</div>`;
  html += section("설명", c.explain.map(p => `<p>${p.k ? `<span class="k">${esc(p.k)}</span>` : ""}${rich(p.t)}</p>`).join(""));
  html += section("묵상 질문", `<ol class="qs">${c.questions.map((q,i)=>`<li><span class="n">${i+1}</span><div>${rich(q)}<div class="fill"></div></div></li>`).join("")}</ol>`);
  html += section("적용", `<div class="apply">${rich(c.apply)}</div>`);
  html += section("기도", `<div class="prayer">${rich(c.prayer).replace(/___+/g,'<span class="blank"></span>')}</div>`);
  const last = state.day === DATA.days.length-1;
  html += `<div class="nav"><button id="prev" ${state.day===0?"disabled":""}>← 이전</button><button id="next" ${last?"disabled":""}>다음 →</button></div>`;
  document.getElementById("panel").innerHTML = html;
}
function render(){ setAccent(); renderTabs(); renderPanel(); remember(); document.title = `${DATA.set_title} · ${AGES.find(a=>a[0]===state.age)[1]}`; }
document.getElementById("eyebrow").textContent = DATA.eyebrow || "";
document.getElementById("setTitle").textContent = DATA.set_title;
document.getElementById("sermonLine").innerHTML = DATA.sermon ? `이번 주 설교 <b>${esc(DATA.sermon.title)}</b> · ${esc(DATA.sermon.ref)}${DATA.sermon.date ? ` · ${esc(DATA.sermon.date)}` : ""}` : "";
document.getElementById("foot").innerHTML = rich(DATA.footer || "");
document.getElementById("app").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.age) state.age = b.dataset.age;
  else if (b.dataset.day) state.day = +b.dataset.day;
  else if (b.id === "prev") state.day--; else if (b.id === "next") state.day++; else return;
  render(); if (b.dataset.day !== undefined || b.id === "prev" || b.id === "next") document.getElementById("panel").scrollIntoView({block:"start", behavior:"smooth"});
});
window.addEventListener("hashchange", () => { readHash(); render(); });
readHash(); render();
</script>

</body>
</html>
