<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>시기 대신 화평을 심는 사람</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@500;700&display=swap">
<style>
  :root {
    --bg: #f9f7f2; --paper: #ffffff; --ink: #1e2a2b; --muted: #66716f; --line: #e4dfd4; --soft: #f1ede4;
    --a-adult: #2f6b6f; --a-youth: #4b5ea8; --a-kids: #c9612e;
    --a-adult-soft: #e6f0f0; --a-youth-soft: #e9ecf8; --a-kids-soft: #fbeae0;
    --sans: 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    --serif: 'Noto Serif KR', 'Apple Myungjo', 'Batang', serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #15191a; --paper: #1d2324; --ink: #ece7dc; --muted: #9aa5a3; --line: #2f3739; --soft: #242c2d;
      --a-adult: #7fc2c5; --a-youth: #a4b0ee; --a-kids: #f0a074;
      --a-adult-soft: #1f2f30; --a-youth-soft: #23283b; --a-kids-soft: #362820;
    }
  }
  :root[data-theme="dark"] {
    --bg: #15191a; --paper: #1d2324; --ink: #ece7dc; --muted: #9aa5a3; --line: #2f3739; --soft: #242c2d;
    --a-adult: #7fc2c5; --a-youth: #a4b0ee; --a-kids: #f0a074;
    --a-adult-soft: #1f2f30; --a-youth-soft: #23283b; --a-kids-soft: #362820;
  }
  html, body { background: var(--bg); color: var(--ink); }
  body { margin: 0; font-family: var(--sans); font-size: 16px; line-height: 1.75; -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 720px; margin: 0 auto; padding-block: 0 64px; padding-inline: 18px; }
  .top { padding-block: 26px 14px; display: flex; flex-direction: column; gap: 6px; }
  .top .eyebrow { font-size: 12px; letter-spacing: .12em; color: var(--muted); font-weight: 500; }
  .top h1 { font-family: var(--serif); font-size: 24px; font-weight: 700; margin: 0; line-height: 1.3; text-wrap: balance; }
  .top .sermon { font-size: 14px; color: var(--muted); }
  .top .sermon b { color: var(--ink); font-weight: 500; }

  .sticky { position: sticky; top: env(safe-area-inset-top, 0px); background: var(--bg); z-index: 5; padding-block: 10px 12px; display: flex; flex-direction: column; gap: 10px; border-bottom: 1px solid var(--line); }
  .seg { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0; border: 1.5px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--paper); }
  .seg button { appearance: none; border: 0; background: transparent; color: var(--muted); font: inherit; font-size: 15px; font-weight: 500; min-height: 44px; cursor: pointer; }
  .seg button + button { border-left: 1.5px solid var(--line); }
  .seg button[aria-selected="true"] { color: #fff; background: var(--accent); }
  .seg button:focus-visible { outline: 2px solid var(--accent); outline-offset: -3px; }
  .days { display: flex; gap: 8px; }
  .days button { appearance: none; flex: 1; border: 1.5px solid var(--line); background: var(--paper); color: var(--muted); border-radius: 10px; min-height: 44px; font: inherit; font-size: 14px; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.2; gap: 2px; padding: 4px 6px; }
  .days button small { font-size: 11px; opacity: .8; }
  .days button[aria-selected="true"] { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); font-weight: 700; }
  .days button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .panel { display: flex; flex-direction: column; gap: 22px; padding-block: 26px 0; }
  .head { display: flex; flex-direction: column; gap: 8px; }
  .head .ref { display: inline-flex; align-self: flex-start; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; color: var(--accent); background: var(--accent-soft); padding: 4px 12px; border-radius: 999px; }
  .head h2 { font-family: var(--serif); font-size: 28px; line-height: 1.25; margin: 0; font-weight: 700; text-wrap: balance; }
  .head .lead { font-size: 15px; color: var(--muted); }

  .scripture { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 20px 22px; font-family: var(--serif); font-size: 17px; line-height: 1.95; }
  .scripture p { margin: 0; }
  .scripture .v { font-family: var(--sans); font-size: 11px; font-weight: 700; color: var(--accent); vertical-align: super; margin-right: 3px; }
  .scripture .src { display: block; margin-top: 12px; font-family: var(--sans); font-size: 12px; color: var(--muted); text-align: right; }
  .retell { background: var(--accent-soft); border-radius: 14px; padding: 18px 20px; font-size: 16px; }
  .retell .lbl { font-size: 12px; font-weight: 700; color: var(--accent); letter-spacing: .08em; display: block; margin-bottom: 6px; }
  .retell p { margin: 0 0 8px; } .retell p:last-child { margin-bottom: 0; }

  .sec { display: grid; grid-template-columns: 84px minmax(0, 1fr); gap: 14px; padding-block: 18px; border-top: 1px solid var(--line); }
  .sec .lbl { font-size: 13px; font-weight: 700; color: var(--accent); letter-spacing: .06em; padding-top: 3px; }
  .sec .body { display: flex; flex-direction: column; gap: 10px; }
  .sec p { margin: 0; }
  .sec .k { font-weight: 700; color: var(--accent); margin-right: 6px; }
  .qs { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px; }
  .qs li { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 6px; }
  .qs li .n { width: 24px; height: 24px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); font-size: 12px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; margin-top: 4px; }
  .fill { border-bottom: 1.5px dashed var(--line); min-height: 34px; }
  .apply { background: var(--soft); border-radius: 12px; padding: 14px 16px; }
  .prayer { font-family: var(--serif); font-size: 16.5px; line-height: 1.9; }
  .prayer .blank { display: inline-block; min-width: 140px; border-bottom: 1.5px solid var(--line); }
  .nav { display: flex; justify-content: space-between; gap: 12px; padding-top: 10px; }
  .nav button { appearance: none; border: 1.5px solid var(--line); background: var(--paper); color: var(--ink); border-radius: 999px; min-height: 44px; padding: 0 18px; font: inherit; font-size: 14px; cursor: pointer; }
  .nav button:disabled { opacity: .35; cursor: default; }
  .foot { margin-top: 40px; font-size: 12px; color: var(--muted); text-align: center; line-height: 1.6; }
  @media (max-width: 480px) {
    .sec { grid-template-columns: 1fr; gap: 6px; }
    .head h2 { font-size: 24px; }
    .scripture { padding: 16px 18px; font-size: 16px; }
  }
  @media (prefers-reduced-motion: no-preference) { .panel { animation: in .25s ease; } @keyframes in { from { opacity: .4; transform: translateY(4px); } to { opacity: 1; transform: none; } } }
</style>
</head>
<body>

<div class="wrap" id="app">
  <header class="top">
    <div class="eyebrow" id="eyebrow"></div>
    <h1 id="setTitle"></h1>
    <div class="sermon" id="sermonLine"></div>
  </header>
  <div class="sticky">
    <div class="seg" role="tablist" aria-label="대상" id="ageTabs"></div>
    <div class="days" role="tablist" aria-label="날" id="dayTabs"></div>
  </div>
  <main class="panel" id="panel"></main>
  <footer class="foot" id="foot"></footer>
</div>

<script>
const DATA = {"set_title": "시기 대신 화평을 심는 사람", "eyebrow": "이번 주 QT · 10월 첫째 주", "sermon": {"title": "진리를 거슬러 거짓말하지 말라", "ref": "야고보서 3:13–18", "date": "2026. 10. 4"}, "footer": "성경전서 개역개정판 © 대한성서공회 · 진중교회", "days": [{"day_label": "월요일", "ref": "삼상 18:6-12", "passage": {"ref": "삼상 18:6-12", "label": "사무엘상 18:6–12", "source": "개역개정", "verses": [{"v": 6, "text": "무리가 돌아올 때 곧 다윗이 블레셋 사람을 죽이고 돌아올 때에 여인들이 이스라엘 모든 성읍에서 나와서 노래하며 춤추며 소고와 경쇠를 가지고 왕 사울을 환영하는데"}, {"v": 7, "text": "여인들이 뛰놀며 노래하여 이르되 사울이 죽인 자는 천천이요 다윗은 만만이로다 한지라"}, {"v": 8, "text": "사울이 그 말에 불쾌하여 심히 노하여 이르되 다윗에게는 만만을 돌리고 내게는 천천만 돌리니 그가 더 얻을 것이 나라 말고 무엇이냐 하고"}, {"v": 9, "text": "그 날 후로 사울이 다윗을 주목하였더라"}, {"v": 10, "text": "그 이튿날 하나님께서 부리시는 악령이 사울에게 힘 있게 내리매 그가 집 안에서 정신 없이 떠들어대므로 다윗이 평일과 같이 손으로 수금을 타는데 그 때에 사울의 손에 창이 있는지라"}, {"v": 11, "text": "그가 스스로 이르기를 내가 다윗을 벽에 박으리라 하고 사울이 그 창을 던졌으나 다윗이 그의 앞에서 두 번 피하였더라"}, {"v": 12, "text": "여호와께서 사울을 떠나 다윗과 함께 계시므로 사울이 그를 두려워한지라"}]}, "adult": {"title": "그날 후로 사울이 다윗을 주목하였다", "lead": "야고보가 말한 「독한 시기」가 한 사람을 어디까지 끌고 가는지 사울이 보여 줍니다.", "explain": [{"k": "6–7절", "t": "다윗이 골리앗을 쓰러뜨린 뒤 이스라엘 군대가 돌아옵니다. 여인들이 성읍마다 나와 소고와 경쇠를 들고 왕을 맞습니다. 「사울이 죽인 자는 천천이요 다윗은 만만이로다.」 천천과 만만은 히브리 시에서 짝으로 자주 쓰는 숫자입니다. 여인들은 두 사람의 승리를 함께 노래했습니다. 그런데 사울은 두 숫자를 견주어 들었습니다."}, {"k": "8–9절", "t": "사울은 심히 노했습니다. 「그가 더 얻을 것이 나라 말고 무엇이냐.」 사울은 칭찬 한 소절에서 왕위를 빼앗길 두려움을 읽었습니다. 9절의 「주목하다(עוֹיֵן)」는 눈으로 살피며 지켜본다는 뜻입니다. 이날부터 사울은 다윗을 의심하는 눈으로 보았습니다. 시기는 한 사람을 보는 눈부터 바꿉니다."}, {"k": "10–12절", "t": "다음 날 다윗은 평소처럼 수금을 타며 왕을 섬겼습니다. 사울은 그 다윗에게 창을 던졌습니다. 시기가 하루 만에 사람을 해치려는 손이 되었습니다. 12절은 까닭을 밝힙니다. 「여호와께서 사울을 떠나 다윗과 함께 계시므로 사울이 그를 두려워한지라.」 사울은 다윗 한 사람을 두려워하지 않았습니다. 하나님이 다윗과 함께하신다는 사실을 견디지 못했습니다."}, {"k": "오늘 읽는 법", "t": "사울은 왕이었습니다. 더 가질 것이 없는 사람이 남이 받는 칭찬 하나에 무너졌습니다. 야고보는 이런 시기를 「땅 위의 것」이라 불렀습니다(약 3:15). 오늘 이 본문을 읽으며 사울을 탓하기보다 내 안의 견주는 눈을 보십시오. 하나님이 다른 사람에게 주신 은혜를 기뻐할 수 있는지 물어보십시오."}], "questions": ["최근 누군가 받은 칭찬이나 인정이 내 마음을 불편하게 한 적이 있습니까? 그때 무엇이 두려웠습니까?", "하나님이 다른 사람과 함께하시는 것을 보며 기뻐하기 어려운 까닭은 무엇입니까?"], "apply": "오늘 내가 견주어 보던 사람 한 명을 떠올립니다. 하나님이 그 사람에게 주신 은사 하나를 적고, 그 은사를 두고 하나님께 감사 기도를 드립니다.", "prayer": "하나님, 사울처럼 남이 받는 칭찬 앞에서 흔들리는 저를 봅니다. 견주어 보는 눈을 거두어 주십시오. 다른 사람에게 주신 은혜를 함께 기뻐하게 하소서. 예수님 이름으로 기도합니다. 아멘."}, "youth": {"title": "노래 한 소절에 무너진 왕", "lead": "칭찬은 다윗이 받았는데, 마음이 무너진 사람은 사울이었습니다.", "explain": [{"k": "", "t": "다윗이 골리앗을 이기고 돌아오자 여인들이 노래했어요. 「사울이 죽인 자는 천천이요 다윗은 만만이로다.」 축하하는 노래였습니다. 그런데 사울은 이 노래를 듣고 몹시 화가 났습니다. 여인들이 자기보다 다윗을 더 높였다고 느꼈거든요."}, {"k": "", "t": "9절은 「그 날 후로 사울이 다윗을 주목하였더라」고 말합니다. 의심하는 눈으로 지켜봤다는 뜻이에요. 다음 날 사울은 수금을 타던 다윗에게 창을 던졌습니다. 시기는 처음에 작은 불편함이었습니다. 하루 만에 사람을 해치려는 마음이 되었습니다."}, {"k": "", "t": "SNS에서 친구가 받는 ‘좋아요’를 보다가 마음이 상한 적 있나요? 성적과 외모와 인기를 견주다 보면 사울처럼 친구를 보는 눈이 바뀝니다. 하나님은 다윗과 함께하셨습니다(12절). 하나님이 나에게 주신 것을 보면 친구를 미워하지 않아도 됩니다."}], "questions": ["친구가 칭찬받을 때 내 마음은 어떤가요?", "요즘 내가 가장 자주 견주는 것은 무엇인가요? (성적, 외모, 인기, SNS)"], "apply": "오늘 내가 부러워하던 친구 한 명에게 진심으로 칭찬 한마디를 건네 봅니다.", "prayer": "하나님, 친구를 견주는 눈 대신 친구를 아끼는 눈을 주세요. 친구가 잘될 때 함께 기뻐하게 해 주세요. 예수님 이름으로 기도합니다. 아멘."}, "kids": {"title": "사울 왕이 화가 났어요", "lead": "다윗이 칭찬받자 사울 왕의 마음에 시기가 생겼어요.", "retell": ["다윗이 큰 거인 골리앗을 이기고 돌아왔어요. 여인들이 성마다 나와서 북을 치고 춤을 추며 노래했어요. “사울은 수천 명을 이기고, 다윗은 수만 명을 이겼네!”", "사울 왕은 이 노래를 듣고 몹시 화가 났어요. 그날부터 사울은 다윗을 미워하는 눈으로 지켜보았어요. 다음 날, 다윗이 수금을 연주할 때 사울은 다윗에게 창을 던졌어요. 다윗은 두 번이나 피했어요. 하나님이 다윗과 함께 계셨어요."], "explain": [{"k": "찾아보세요", "t": "여인들이 부른 노래를 7절에서 찾아 밑줄을 그어 보세요. 노래를 들은 사울이 어떤 마음이었는지 8절에서 찾아 ○표를 해 보세요."}, {"k": "생각해 보세요", "t": "친구가 선생님께 칭찬받을 때 내 마음이 어땠나요? 기쁘지 않고 속상했다면 그 마음을 시기라고 해요. 사울 왕도 그랬어요."}, {"k": "한 가지 더", "t": "시기하는 마음을 그대로 두면 친구를 미워하게 돼요. 그럴 때는 하나님께 솔직하게 말씀드려요. 하나님은 친구와 나를 똑같이 사랑하세요."}], "questions": ["사울 왕은 누구에게 창을 던졌나요? (11절에서 찾아보세요)", "친구가 칭찬받을 때 나는 어떻게 하면 좋을까요?"], "apply": "오늘 칭찬받은 친구에게 “잘했어!” 하고 말해 줘요.", "prayer": "하나님, 친구가 칭찬받을 때 함께 기뻐하게 해 주세요. 오늘 ___에게 축하하는 말을 하게 해 주세요. 예수님 이름으로 기도합니다. 아멘."}}, {"day_label": "수요일", "ref": "빌 2:1-8", "passage": {"ref": "빌 2:1-8", "label": "빌립보서 2:1–8", "source": "개역개정", "verses": [{"v": 1, "text": "그러므로 그리스도 안에 무슨 권면이나 사랑의 무슨 위로나 성령의 무슨 교제나 긍휼이나 자비가 있거든"}, {"v": 2, "text": "마음을 같이하여 같은 사랑을 가지고 뜻을 합하며 한마음을 품어"}, {"v": 3, "text": "아무 일에든지 다툼이나 허영으로 하지 말고 오직 겸손한 마음으로 각각 자기보다 남을 낫게 여기고"}, {"v": 4, "text": "각각 자기 일을 돌볼뿐더러 또한 각각 다른 사람들의 일을 돌보아 나의 기쁨을 충만하게 하라"}, {"v": 5, "text": "너희 안에 이 마음을 품으라 곧 그리스도 예수의 마음이니"}, {"v": 6, "text": "그는 근본 하나님의 본체시나 하나님과 동등됨을 취할 것으로 여기지 아니하시고"}, {"v": 7, "text": "오히려 자기를 비워 종의 형체를 가지사 사람들과 같이 되셨고"}, {"v": 8, "text": "사람의 모양으로 나타나사 자기를 낮추시고 죽기까지 복종하셨으니 곧 십자가에 죽으심이라"}]}, "adult": {"title": "다툼과 허영 대신 그리스도의 마음", "lead": "야고보가 꾸짖은 「다툼」이 빌립보서에도 나옵니다. 바울은 그 처방으로 그리스도를 보여 줍니다.", "explain": [{"k": "1–2절", "t": "바울은 감옥에서 이 편지를 씁니다(빌 1:13). 빌립보 교회는 바울이 아끼는 교회였습니다. 그런데 이 교회에도 갈등이 있었습니다. 4장에서 바울은 유오디아와 순두게에게 「주 안에서 같은 마음을 품으라」고 권합니다(빌 4:2). 바울은 명령하기 전에 교회가 이미 받은 은혜를 꼽습니다. 그리스도 안의 권면, 사랑의 위로, 성령의 교제입니다. 한마음은 이 은혜에서 시작합니다."}, {"k": "3–4절", "t": "「아무 일에든지 다툼이나 허영으로 하지 말고.」 「다툼(ἐριθεία)」은 야고보서 3:14·16과 같은 낱말입니다. 자기 이익을 앞세운 경쟁을 뜻합니다. 「허영(κενοδοξία)」은 ‘빈 영광’이라는 뜻입니다. 근거 없이 스스로 높이는 마음입니다. 바울은 그 반대로 겸손한 마음을 내놓습니다. 자기보다 남을 낫게 여기고, 다른 사람의 일을 돌보라고 합니다."}, {"k": "5–8절", "t": "바울은 겸손을 도덕 교훈으로 끝내지 않습니다. 그리스도 예수의 마음을 보여 줍니다. 예수님은 하나님과 동등하셨지만 그 동등됨을 붙잡지 않으셨습니다. 자기를 비워 종이 되셨습니다. 죽기까지 복종하셨고 십자가에서 죽으셨습니다. 사울과 야고보 공동체의 선생들은 더 높아지려 했습니다. 예수님은 가장 높은 곳에서 가장 낮은 곳으로 내려오셨습니다."}, {"k": "오늘 읽는 법", "t": "5절은 「너희 안에 이 마음을 품으라」고 말합니다. 그리스도의 마음은 내 힘으로 흉내 내는 성품이 아닙니다. 나를 위해 자기를 비우신 그리스도를 바라볼 때 생깁니다. 오늘 내가 누구보다 높아지려 하는지 살피십시오. 그리고 그 사람을 위해 예수님이 무엇을 하셨는지 떠올리십시오."}], "questions": ["교회나 일터에서 내가 하는 일 가운데 「다툼이나 허영」에서 나온 일은 무엇입니까?", "「자기보다 남을 낫게 여기라」는 말씀이 가장 어려운 사람은 누구입니까? 그 사람의 장점 한 가지를 떠올릴 수 있습니까?"], "apply": "오늘 함께 일하는 사람 한 명의 일을 돕습니다. 내 이름이 드러나지 않는 일 한 가지를 고릅니다.", "prayer": "주 예수님, 하나님과 동등하시면서도 종이 되신 주님을 바라봅니다. 높아지려는 제 마음을 내려놓습니다. 주님의 마음을 제 안에 품게 하셔서 남의 일을 돌보게 하소서. 예수님 이름으로 기도합니다. 아멘."}, "youth": {"title": "높아지려는 마음, 낮아지신 예수님", "lead": "예수님은 가장 높은 분이셨지만 스스로 낮아지셨습니다.", "explain": [{"k": "", "t": "바울은 빌립보 교회에 「다툼이나 허영으로 하지 말라」고 씁니다(3절). 다툼은 나만 앞서려고 편을 가르는 마음이에요. 허영은 속이 빈 자랑입니다. 야고보서 3장에서 문제가 된 마음과 같습니다."}, {"k": "", "t": "바울은 그 대신 「자기보다 남을 낫게 여기라」고 합니다. 쉽지 않죠. 그래서 바울은 예수님을 보여 줍니다. 예수님은 하나님과 같은 분이셨어요. 그런데 그 권리를 내세우지 않으셨습니다. 종이 되셨고, 십자가에서 죽기까지 순종하셨습니다(6–8절)."}, {"k": "", "t": "우리는 반에서, 동아리에서, 교회 모임에서 누가 더 인정받는지 신경 씁니다. 예수님은 인정받는 쪽이 아니라 섬기는 쪽을 고르셨어요. 「너희 안에 이 마음을 품으라」(5절). 예수님의 마음은 내 힘으로 짜내지 않습니다. 예수님을 바라볼 때 내 안에 생깁니다."}], "questions": ["요즘 내가 인정받고 싶어서 한 일은 무엇인가요?", "예수님이 종이 되셨다는 말씀을 읽고 무엇을 느꼈나요?"], "apply": "오늘 아무도 모르게 친구나 가족을 돕는 일 하나를 해 봅니다. 그 일을 SNS에 올리지 않습니다.", "prayer": "예수님, 저를 위해 낮아지신 주님을 생각합니다. 앞서고 싶은 마음 대신 친구를 낫게 여기는 마음을 주세요. 예수님 이름으로 기도합니다. 아멘."}, "kids": {"title": "예수님은 스스로 낮아지셨어요", "lead": "가장 높으신 예수님이 우리를 위해 종이 되셨어요.", "retell": ["바울이 빌립보 교회에 편지를 썼어요. “서로 다투지 마세요. 자랑하려고 일하지 마세요. 나보다 다른 사람을 더 낫게 여기세요. 다른 사람의 일도 돌봐 주세요.”", "그리고 바울은 예수님 이야기를 했어요. 예수님은 하나님과 똑같은 분이세요. 그런데 사람이 되어 이 땅에 오셨어요. 종처럼 섬기셨어요. 그리고 우리를 위해 십자가에서 돌아가셨어요."], "explain": [{"k": "찾아보세요", "t": "3절에서 하지 말라고 한 두 가지를 찾아 ○표를 해 보세요. 8절에서 예수님이 낮추신 것이 무엇인지 찾아 밑줄을 그어 보세요."}, {"k": "생각해 보세요", "t": "줄을 설 때 내가 먼저 서고 싶었던 적이 있나요? 예수님은 가장 높은 분인데도 사람이 되어 우리를 섬기셨어요. 예수님은 제자들의 발도 씻어 주셨어요(요한복음 13장)."}, {"k": "한 가지 더", "t": "예수님의 마음을 닮으면 친구를 먼저 생각하게 돼요. 내가 먼저 하고 싶을 때 친구에게 양보해 보세요."}], "questions": ["예수님은 어디에서 돌아가셨나요? (8절에서 찾아보세요)", "오늘 친구를 나보다 낫게 여길 수 있는 일은 무엇일까요?"], "apply": "오늘 친구나 동생에게 한 번 양보해요.", "prayer": "예수님, 저를 위해 낮아지셔서 고맙습니다. 오늘 ___에게 먼저 양보하게 해 주세요. 예수님 이름으로 기도합니다. 아멘."}}, {"day_label": "금요일", "ref": "갈 5:19-26", "passage": {"ref": "갈 5:19-26", "label": "갈라디아서 5:19–26", "source": "개역개정", "verses": [{"v": 19, "text": "육체의 일은 분명하니 곧 음행과 더러운 것과 호색과"}, {"v": 20, "text": "우상 숭배와 주술과 원수 맺는 것과 분쟁과 시기와 분냄과 당 짓는 것과 분열함과 이단과"}, {"v": 21, "text": "투기와 술 취함과 방탕함과 또 그와 같은 것들이라 전에 너희에게 경계한 것 같이 경계하노니 이런 일을 하는 자들은 하나님의 나라를 유업으로 받지 못할 것이요"}, {"v": 22, "text": "오직 성령의 열매는 사랑과 희락과 화평과 오래 참음과 자비와 양선과 충성과"}, {"v": 23, "text": "온유와 절제니 이같은 것을 금지할 법이 없느니라"}, {"v": 24, "text": "그리스도 예수의 사람들은 육체와 함께 그 정욕과 탐심을 십자가에 못 박았느니라"}, {"v": 25, "text": "만일 우리가 성령으로 살면 또한 성령으로 행할지니"}, {"v": 26, "text": "헛된 영광을 구하여 서로 노엽게 하거나 서로 투기하지 말지니라"}]}, "adult": {"title": "육체의 일과 성령의 열매", "lead": "야고보가 말한 두 지혜는 갈라디아서의 두 목록과 짝을 이룹니다.", "explain": [{"k": "19–21절", "t": "갈라디아 교회는 율법을 지켜야 구원받는다는 가르침 때문에 흔들렸습니다. 바울은 율법 대신 성령을 따라 행하라고 말합니다(갈 5:16). 그리고 육체의 일을 꼽습니다. 열다섯 가지 가운데 「원수 맺는 것과 분쟁과 시기와 분냄과 당 짓는 것과 분열함과 이단과 투기」, 여덟 가지가 공동체를 깨뜨리는 죄입니다. 「당 짓는 것(ἐριθεία)」은 야고보서 3:14의 「다툼」과 같은 낱말입니다. 20절의 「이단」은 오늘 말하는 이단 단체가 아니라 ‘파당’을 가리킵니다."}, {"k": "22–23절", "t": "바울은 「육체의 일」을 여럿으로 말하고 「성령의 열매」를 하나로 말합니다. 원문에서 「일」은 복수이고 「열매(καρπός)」는 단수입니다. 사랑, 희락, 화평, 오래 참음, 자비, 양선, 충성, 온유, 절제는 따로 떨어진 덕목이 아닙니다. 성령께서 한 사람 안에 함께 맺으시는 열매입니다. 야고보서 3:17의 「위로부터 난 지혜」도 화평과 관용과 선한 열매로 드러났습니다."}, {"k": "24–26절", "t": "열매를 맺게 하시는 분은 성령이십니다. 그리스도 예수의 사람들은 육체의 정욕과 탐심을 십자가에 못 박았습니다(24절). 그리스도께서 이루신 십자가가 출발점입니다. 그 위에서 성도는 성령을 따라 행합니다(25절). 26절은 다시 공동체로 돌아옵니다. 「헛된 영광을 구하여 서로 노엽게 하거나 서로 투기하지 말지니라.」 「헛된 영광」은 빌립보서 2:3의 「허영」과 같은 계열의 낱말입니다."}, {"k": "오늘 읽는 법", "t": "이번 주 세 본문은 한 줄로 이어집니다. 사울의 시기는 사람을 해쳤습니다. 예수님은 자기를 비우셨습니다. 성령께서는 우리 안에 화평의 열매를 맺으십니다. 사람은 애써서 열매를 만들어 붙이지 못합니다. 성령을 따라 행하는 사람에게 열매가 맺힙니다. 오늘 내가 속한 가정과 교회와 일터에 어떤 열매가 맺히고 있는지 보십시오."}], "questions": ["20–21절의 목록 가운데 요즘 내 말과 행동에서 보이는 것은 무엇입니까?", "내가 속한 공동체에 화평을 심으려면 무엇을 멈추고 무엇을 시작해야 합니까?"], "apply": "오늘 다툼이 있었던 사람에게 먼저 연락합니다. 옳고 그름을 따지지 않고 안부를 묻습니다.", "prayer": "성령님, 제 안의 시기와 다툼을 십자가 앞에 내려놓습니다. 사랑과 화평과 온유의 열매를 맺게 하소서. 제가 속한 가정과 교회와 일터에서 화평을 심는 사람이 되게 하소서. 예수님 이름으로 기도합니다. 아멘."}, "youth": {"title": "성령께서 맺으시는 열매", "lead": "바울은 친구 사이를 깨뜨리는 일과 성령께서 맺으시는 열매를 나란히 보여 줍니다.", "explain": [{"k": "", "t": "바울은 「육체의 일」 목록을 적습니다(19–21절). 그 가운데 원수 맺기, 다툼, 시기, 화내기, 편 가르기가 줄지어 나옵니다. 모두 친구 사이를 깨뜨리는 일이에요. 20절의 「이단」은 오늘 말하는 이단 단체가 아니라 ‘편 가르기’를 뜻합니다."}, {"k": "", "t": "그 반대편에 「성령의 열매」가 있습니다(22–23절). 사랑, 기쁨, 화평, 오래 참음… 바울은 이것을 ‘열매들’이 아니라 ‘열매’라고 씁니다. 아홉 가지가 한 사람 안에서 함께 맺힌다는 뜻이에요. 열매는 억지로 붙일 수 없어요. 나무가 살아 있으면 맺힙니다."}, {"k": "", "t": "「헛된 영광을 구하여 서로 노엽게 하거나 서로 투기하지 말지니라」(26절). 단톡방에서 누가 더 주목받는지 신경 쓰다 보면 말이 날카로워집니다. 성령님을 따라 사는 사람은 친구를 이기려 하지 않습니다. 친구 사이에 화평을 심습니다."}], "questions": ["19–21절 목록 가운데 요즘 내 말과 행동에서 가장 자주 보이는 것은 무엇인가요?", "성령의 열매 가운데 내가 가장 바라는 열매는 무엇인가요? 왜 그런가요?"], "apply": "오늘 단톡방이나 친구 사이에서 누군가를 놀리는 말이 나오면 따라 하지 않습니다. 그 친구 편에 서는 말 한마디를 합니다.", "prayer": "성령님, 편 가르기와 시기 대신 화평의 열매를 맺게 해 주세요. 친구를 이기려는 마음보다 친구를 아끼는 마음을 주세요. 예수님 이름으로 기도합니다. 아멘."}, "kids": {"title": "성령님이 열매를 맺어 주세요", "lead": "성령님이 우리 마음에 사랑과 화평의 열매를 맺어 주세요.", "retell": ["바울이 갈라디아 교회에 편지를 썼어요. “서로 미워하고, 다투고, 시샘하고, 화내고, 편을 가르는 일은 하나님의 사람이 할 일이 아니에요.”", "“성령님은 우리 마음에 열매를 맺어 주세요. 사랑, 기쁨, 화평, 오래 참음, 친절, 착함, 충성, 온유, 절제의 열매예요. 그러니 잘난 척하지 말고, 서로 화나게 하지 말고, 서로 시샘하지 마세요.”"], "explain": [{"k": "찾아보세요", "t": "22–23절에서 성령의 열매 아홉 가지를 찾아 ○표를 해 보세요. 몇 개인지 손가락으로 세어 보세요."}, {"k": "생각해 보세요", "t": "사과나무는 애쓰지 않아도 사과를 맺어요. 나무가 살아 있기 때문이에요. 성령님과 함께 사는 사람에게도 사랑과 화평의 열매가 맺혀요."}, {"k": "한 가지 더", "t": "친구와 다투고 싶을 때 “성령님, 도와주세요” 하고 작게 기도해 보세요. 화가 날 때는 열까지 세고 나서 말해 보세요. 성령님이 오래 참는 마음을 주세요."}], "questions": ["성령의 열매 가운데 첫 번째는 무엇인가요? (22절에서 찾아보세요)", "오늘 내가 맺고 싶은 열매는 무엇인가요?"], "apply": "오늘 다툰 친구나 형제에게 먼저 “미안해” 하고 말해요.", "prayer": "성령님, 제 마음에 사랑과 화평의 열매를 맺어 주세요. 오늘 ___와 사이좋게 지내게 해 주세요. 예수님 이름으로 기도합니다. 아멘."}}]};
const AGES = [["adult","청장년"],["youth","청소년"],["kids","어린이"]];
const state = { age: "adult", day: 0 };
const esc = s => String(s ?? "").replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const rich = s => esc(s).replace(/&lt;b&gt;/g,"<b>").replace(/&lt;\/b&gt;/g,"</b>");

function readHash(){
  const m = location.hash.match(/^#(adult|youth|kids)-(\d)$/);
  if (m) { state.age = m[1]; state.day = Math.min(DATA.days.length-1, Math.max(0, +m[2]-1)); return; }
  try { const s = JSON.parse(localStorage.getItem("qt-set-last")||"null"); if (s && AGES.some(a=>a[0]===s.age)) { state.age = s.age; state.day = Math.min(DATA.days.length-1, s.day|0); } } catch(e){}
}
function remember(){ try { localStorage.setItem("qt-set-last", JSON.stringify(state)); } catch(e){} history.replaceState(null,"",`#${state.age}-${state.day+1}`); }
function setAccent(){
  const r = document.documentElement.style;
  r.setProperty("--accent", `var(--a-${state.age})`); r.setProperty("--accent-soft", `var(--a-${state.age}-soft)`);
}
function renderTabs(){
  document.getElementById("ageTabs").innerHTML = AGES.map(([k,l]) => `<button role="tab" id="age-${k}" aria-selected="${state.age===k}" data-age="${k}">${l}</button>`).join("");
  document.getElementById("dayTabs").innerHTML = DATA.days.map((d,i) => `<button role="tab" id="day-${i}" aria-selected="${state.day===i}" data-day="${i}"><span>${esc(d.day_label)}</span><small>${esc(d.ref)}</small></button>`).join("");
}
function section(lbl, inner){ return `<section class="sec"><div class="lbl">${lbl}</div><div class="body">${inner}</div></section>`; }
function renderPanel(){
  const d = DATA.days[state.day]; const c = d[state.age];
  const verses = d.passage.verses.map(v => `<span class="v">${v.v}</span>${esc(v.text)} `).join("");
  let html = `<div class="head"><span class="ref">${esc(d.passage.label)}</span><h2>${esc(c.title)}</h2>${c.lead ? `<div class="lead">${rich(c.lead)}</div>` : ""}</div>`;
  html += `<div class="scripture"><p>${verses}</p><span class="src">${esc(d.passage.source)}</span></div>`;
  if (c.retell && c.retell.length) html += `<div class="retell"><span class="lbl">쉽게 읽기</span>${c.retell.map(p=>`<p>${rich(p)}</p>`).join("")}</div>`;
  html += section("설명", c.explain.map(p => `<p>${p.k ? `<span class="k">${esc(p.k)}</span>` : ""}${rich(p.t)}</p>`).join(""));
  html += section("묵상 질문", `<ol class="qs">${c.questions.map((q,i)=>`<li><span class="n">${i+1}</span><div>${rich(q)}<div class="fill"></div></div></li>`).join("")}</ol>`);
  html += section("적용", `<div class="apply">${rich(c.apply)}</div>`);
  html += section("기도", `<div class="prayer">${rich(c.prayer).replace(/___+/g,'<span class="blank"></span>')}</div>`);
  const last = state.day === DATA.days.length-1;
  html += `<div class="nav"><button id="prev" ${state.day===0?"disabled":""}>← 이전</button><button id="next" ${last?"disabled":""}>다음 →</button></div>`;
  document.getElementById("panel").innerHTML = html;
}
function render(){ setAccent(); renderTabs(); renderPanel(); remember(); document.title = `${DATA.set_title} · ${AGES.find(a=>a[0]===state.age)[1]}`; }
document.getElementById("eyebrow").textContent = DATA.eyebrow || "";
document.getElementById("setTitle").textContent = DATA.set_title;
document.getElementById("sermonLine").innerHTML = DATA.sermon ? `이번 주 설교 <b>${esc(DATA.sermon.title)}</b> · ${esc(DATA.sermon.ref)}${DATA.sermon.date ? ` · ${esc(DATA.sermon.date)}` : ""}` : "";
document.getElementById("foot").innerHTML = rich(DATA.footer || "");
document.getElementById("app").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.age) state.age = b.dataset.age;
  else if (b.dataset.day) state.day = +b.dataset.day;
  else if (b.id === "prev") state.day--; else if (b.id === "next") state.day++; else return;
  render(); if (b.dataset.day !== undefined || b.id === "prev" || b.id === "next") document.getElementById("panel").scrollIntoView({block:"start", behavior:"smooth"});
});
window.addEventListener("hashchange", () => { readHash(); render(); });
readHash(); render();
</script>
