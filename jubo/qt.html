<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>하나님의 벗으로 산다는 것</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@500;700&display=swap">
<style>
  :root {
    --bg: #f9f7f2; --paper: #ffffff; --ink: #1e2a2b; --muted: #66716f; --line: #e4dfd4; --soft: #f1ede4;
    --a-adult: #2f6b6f; --a-youth: #4b5ea8; --a-kids: #c9612e;
    --a-adult-soft: #e6f0f0; --a-youth-soft: #e9ecf8; --a-kids-soft: #fbeae0;
    --sans: 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    --serif: 'Noto Serif KR', 'Apple Myungjo', 'Batang', serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #15191a; --paper: #1d2324; --ink: #ece7dc; --muted: #9aa5a3; --line: #2f3739; --soft: #242c2d;
      --a-adult: #7fc2c5; --a-youth: #a4b0ee; --a-kids: #f0a074;
      --a-adult-soft: #1f2f30; --a-youth-soft: #23283b; --a-kids-soft: #362820;
    }
  }
  :root[data-theme="dark"] {
    --bg: #15191a; --paper: #1d2324; --ink: #ece7dc; --muted: #9aa5a3; --line: #2f3739; --soft: #242c2d;
    --a-adult: #7fc2c5; --a-youth: #a4b0ee; --a-kids: #f0a074;
    --a-adult-soft: #1f2f30; --a-youth-soft: #23283b; --a-kids-soft: #362820;
  }
  html, body { background: var(--bg); color: var(--ink); }
  body { margin: 0; font-family: var(--sans); font-size: 16px; line-height: 1.75; -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 720px; margin: 0 auto; padding-block: 0 64px; padding-inline: 18px; }
  .top { padding-block: 26px 14px; display: flex; flex-direction: column; gap: 6px; }
  .top .eyebrow { font-size: 12px; letter-spacing: .12em; color: var(--muted); font-weight: 500; }
  .top h1 { font-family: var(--serif); font-size: 24px; font-weight: 700; margin: 0; line-height: 1.3; text-wrap: balance; }
  .top .sermon { font-size: 14px; color: var(--muted); }
  .top .sermon b { color: var(--ink); font-weight: 500; }

  .sticky { position: sticky; top: env(safe-area-inset-top, 0px); background: var(--bg); z-index: 5; padding-block: 10px 12px; display: flex; flex-direction: column; gap: 10px; border-bottom: 1px solid var(--line); }
  .seg { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0; border: 1.5px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--paper); }
  .seg button { appearance: none; border: 0; background: transparent; color: var(--muted); font: inherit; font-size: 15px; font-weight: 500; min-height: 44px; cursor: pointer; }
  .seg button + button { border-left: 1.5px solid var(--line); }
  .seg button[aria-selected="true"] { color: #fff; background: var(--accent); }
  .seg button:focus-visible { outline: 2px solid var(--accent); outline-offset: -3px; }
  .days { display: flex; gap: 8px; }
  .days button { appearance: none; flex: 1; border: 1.5px solid var(--line); background: var(--paper); color: var(--muted); border-radius: 10px; min-height: 44px; font: inherit; font-size: 14px; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.2; gap: 2px; padding: 4px 6px; }
  .days button small { font-size: 11px; opacity: .8; }
  .days button[aria-selected="true"] { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); font-weight: 700; }
  .days button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .panel { display: flex; flex-direction: column; gap: 22px; padding-block: 26px 0; }
  .head { display: flex; flex-direction: column; gap: 8px; }
  .head .ref { display: inline-flex; align-self: flex-start; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; color: var(--accent); background: var(--accent-soft); padding: 4px 12px; border-radius: 999px; }
  .head h2 { font-family: var(--serif); font-size: 28px; line-height: 1.25; margin: 0; font-weight: 700; text-wrap: balance; }
  .head .lead { font-size: 15px; color: var(--muted); }

  .scripture { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 20px 22px; font-family: var(--serif); font-size: 17px; line-height: 1.95; }
  .scripture p { margin: 0; }
  .scripture .v { font-family: var(--sans); font-size: 11px; font-weight: 700; color: var(--accent); vertical-align: super; margin-right: 3px; }
  .scripture .src { display: block; margin-top: 12px; font-family: var(--sans); font-size: 12px; color: var(--muted); text-align: right; }
  .retell { background: var(--accent-soft); border-radius: 14px; padding: 18px 20px; font-size: 16px; }
  .retell .lbl { font-size: 12px; font-weight: 700; color: var(--accent); letter-spacing: .08em; display: block; margin-bottom: 6px; }
  .retell p { margin: 0 0 8px; } .retell p:last-child { margin-bottom: 0; }

  .sec { display: grid; grid-template-columns: 84px minmax(0, 1fr); gap: 14px; padding-block: 18px; border-top: 1px solid var(--line); }
  .sec .lbl { font-size: 13px; font-weight: 700; color: var(--accent); letter-spacing: .06em; padding-top: 3px; }
  .sec .body { display: flex; flex-direction: column; gap: 10px; }
  .sec p { margin: 0; }
  .sec .k { font-weight: 700; color: var(--accent); margin-right: 6px; }
  .qs { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px; }
  .qs li { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 6px; }
  .qs li .n { width: 24px; height: 24px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); font-size: 12px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; margin-top: 4px; }
  .fill { border-bottom: 1.5px dashed var(--line); min-height: 34px; }
  .apply { background: var(--soft); border-radius: 12px; padding: 14px 16px; }
  .prayer { font-family: var(--serif); font-size: 16.5px; line-height: 1.9; }
  .prayer .blank { display: inline-block; min-width: 140px; border-bottom: 1.5px solid var(--line); }
  .nav { display: flex; justify-content: space-between; gap: 12px; padding-top: 10px; }
  .nav button { appearance: none; border: 1.5px solid var(--line); background: var(--paper); color: var(--ink); border-radius: 999px; min-height: 44px; padding: 0 18px; font: inherit; font-size: 14px; cursor: pointer; }
  .nav button:disabled { opacity: .35; cursor: default; }
  .foot { margin-top: 40px; font-size: 12px; color: var(--muted); text-align: center; line-height: 1.6; }
  @media (max-width: 480px) {
    .sec { grid-template-columns: 1fr; gap: 6px; }
    .head h2 { font-size: 24px; }
    .scripture { padding: 16px 18px; font-size: 16px; }
  }
  @media (prefers-reduced-motion: no-preference) { .panel { animation: in .25s ease; } @keyframes in { from { opacity: .4; transform: translateY(4px); } to { opacity: 1; transform: none; } } }
</style>
</head>
<body>

<div class="wrap" id="app">
  <header class="top">
    <div class="eyebrow" id="eyebrow"></div>
    <h1 id="setTitle"></h1>
    <div class="sermon" id="sermonLine"></div>
  </header>
  <div class="sticky">
    <div class="seg" role="tablist" aria-label="대상" id="ageTabs"></div>
    <div class="days" role="tablist" aria-label="날" id="dayTabs"></div>
  </div>
  <main class="panel" id="panel"></main>
  <footer class="foot" id="foot"></footer>
</div>

<script>
const DATA = {"set_title": "하나님의 벗으로 산다는 것", "eyebrow": "이번 주 QT · 10월 셋째 주", "sermon": {"title": "하나님과 원수 되는 것이니라", "ref": "야고보서 4:4–5", "date": "2026. 10. 18"}, "footer": "성경전서 개역개정판 © 대한성서공회 · 진중교회", "days": [{"day_label": "월요일", "ref": "사 41:8-10", "passage": {"ref": "사 41:8-10", "label": "이사야 41:8–10", "source": "개역개정", "verses": [{"v": 8, "text": "그러나 나의 종 너 이스라엘아 내가 택한 야곱아 나의 벗 아브라함의 자손아"}, {"v": 9, "text": "내가 땅 끝에서부터 너를 붙들며 땅 모퉁이에서부터 너를 부르고 네게 이르기를 너는 나의 종이라 내가 너를 택하고 싫어하여 버리지 아니하였다 하였노라"}, {"v": 10, "text": "두려워하지 말라 내가 너와 함께 함이라 놀라지 말라 나는 네 하나님이 됨이라 내가 너를 굳세게 하리라 참으로 너를 도와 주리라 참으로 나의 의로운 오른손으로 너를 붙들리라"}]}, "adult": {"title": "나의 벗 아브라함의 자손아", "lead": "우상을 만드는 민족들 한가운데서 하나님은 당신의 백성을 「나의 벗 아브라함의 자손」이라 부르십니다.", "explain": [{"k": "앞 단락(1–7절)", "t": "이사야 40–55장은 바벨론에 포로로 끌려간 백성을 위로하는 말씀입니다. 41장은 법정 장면으로 시작합니다. 하나님은 섬들과 민족들을 불러 물으십니다. 「누가 동방에서 사람을 일깨워서」(2절). 역사를 움직이는 분은 여호와이십니다(4절). 그런데 민족들은 두려워 떨며 서로 「힘을 내라」고 격려합니다. 목공과 금장색이 힘을 모아 우상을 만들고, 우상이 흔들리지 않게 못을 단단히 박습니다(6–7절). 사람이 만든 신은 사람이 붙들어 주어야 서 있습니다."}, {"k": "8절", "t": "8절은 「그러나」로 시작합니다. 하나님은 우상을 만드는 민족들과 이스라엘을 맞세우십니다. 하나님은 이스라엘을 세 이름으로 부르십니다. 「나의 종」, 「내가 택한 야곱」, 「나의 벗 아브라함의 자손」. 「벗」은 히브리어로 오헤브(אֹהֵב)입니다. 「사랑하다」라는 동사에서 온 말이고, 사랑하는 사이의 벗을 가리킵니다. 하나님이 아브라함을 사랑하는 벗으로 부르셨습니다. 야고보서 2:23도 이 말씀을 받아 아브라함을 「하나님의 벗」이라고 부릅니다."}, {"k": "9–10절", "t": "하나님은 이스라엘을 땅 끝에서 붙드시고 땅 모퉁이에서 부르셨습니다. 「내가 너를 택하고 싫어하여 버리지 아니하였다」(9절). 포로로 끌려간 백성은 하나님이 자기들을 버리셨다고 여겼습니다. 하나님은 버리지 않았다고 분명히 말씀하십니다. 10절에는 하나님이 하실 일이 이어서 나옵니다. 함께하시고, 하나님이 되시고, 굳세게 하시고, 도우시고, 의로운 오른손으로 붙드십니다. 우상은 사람이 붙들지만, 하나님은 사람을 붙드십니다."}, {"k": "오늘 읽는 법", "t": "주일 설교는 세상과 벗하는 성도가 하나님과 원수가 된다고 했습니다. 이스라엘도 우상을 섬기다가 포로로 끌려갔습니다. 하나님은 그 백성을 먼저 찾아와 「나의 벗 아브라함의 자손」이라고 부르십니다. 하나님의 벗이 되는 길은 내 결심에서 시작하지 않습니다. 하나님이 택하시고 부르시고 붙드시는 데서 시작합니다. 오늘 나를 붙드시는 하나님의 오른손을 생각하며 이 말씀을 읽으십시오."}], "questions": ["나는 불안할 때 무엇을 붙듭니까? 내 손으로 만들어 붙들고 있는 안전장치는 무엇입니까?", "하나님이 나를 「버리지 아니하였다」고 말씀하십니다. 이 말씀 앞에서 내가 내려놓아야 할 세상의 기준은 무엇입니까?"], "apply": "오늘 불안한 일이 생기면 10절을 소리 내어 읽습니다. 그리고 내 힘으로 붙들고 있던 일 하나를 하나님께 맡기는 기도를 드립니다.", "prayer": "하나님, 아브라함을 벗이라 부르신 하나님께서 저를 택하시고 버리지 않으셨습니다. 불안할 때 세상이 만든 우상을 붙들지 않게 하소서. 주님의 의로운 오른손이 저를 붙드심을 믿고 두려워하지 않게 하소서. 예수님 이름으로 기도합니다. 아멘."}, "youth": {"title": "하나님이 붙드시는 손", "lead": "하나님은 겁먹은 백성에게 「너는 나의 벗 아브라함의 자손」이라고 말씀하십니다.", "explain": [{"k": "", "t": "이스라엘 백성은 나라가 망해 바벨론에 끌려갔습니다. 주변 민족들은 두려울 때 서로 「힘을 내라」 하며 우상을 만들었어요. 우상이 넘어지지 않게 못을 단단히 박았습니다(6–7절). 사람이 만든 신은 사람이 붙들어 줘야 서 있습니다."}, {"k": "", "t": "하나님은 이스라엘에게 다르게 말씀하십니다. 「나의 벗 아브라함의 자손아」(8절). 아브라함은 하나님의 말씀을 따라 고향을 떠난 사람입니다. 하나님은 그 아브라함을 벗이라고 부르셨어요. 그리고 이스라엘에게 「내가 너를 택하고 버리지 아니하였다」고 하십니다(9절)."}, {"k": "", "t": "10절에서 붙드는 쪽은 하나님입니다. 우상은 사람이 붙들어야 하지만, 하나님은 우리를 붙드세요. 우리는 친구들 사이에서 인정받으려고 애쓸 때가 있지요. 하나님은 이미 우리를 택하셨어요. 하나님이 우리를 택하셨기 때문에 우리는 두려워하지 않아도 됩니다."}], "questions": ["요즘 나를 불안하게 하는 일은 무엇인가요?", "친구들의 인정과 하나님이 나를 부르시는 이름 가운데, 나는 어느 쪽에 더 마음을 쓰나요?"], "apply": "오늘 등굣길이나 잠들기 전에 10절을 한 번 소리 내어 읽습니다. 불안한 일 하나를 적고 하나님께 맡겨요.", "prayer": "하나님, 저를 택하시고 버리지 않으셔서 감사합니다. 불안할 때 다른 것을 붙들지 않고 하나님을 붙들게 해 주세요. 예수님 이름으로 기도합니다. 아멘."}, "kids": {"title": "하나님의 친구 아브라함", "lead": "하나님은 아브라함을 ‘나의 친구’라고 부르셨어요.", "retell": ["이스라엘 백성은 먼 나라 바벨론에 끌려가 살았어요. 백성은 무서웠어요. ‘하나님이 우리를 버리셨나?’ 하고 걱정했어요.", "하나님이 이스라엘 백성에게 말씀하셨어요. “너희는 내 친구 아브라함의 자손이야. 나는 너희를 골랐고 버리지 않았어. 무서워하지 마. 내가 너희와 함께 있어. 내가 오른손으로 너희를 꼭 붙들어 줄게.”"], "explain": [{"k": "찾아보세요", "t": "하나님이 아브라함을 무엇이라고 부르셨나요? 8절에서 찾아 ○표를 해 보세요. 「두려워하지 말라」는 말을 10절에서 찾아 밑줄을 그어 보세요."}, {"k": "생각해 보세요", "t": "다른 나라 사람들은 무서울 때 나무와 금으로 우상을 만들었어요. 우상이 넘어지지 않게 사람이 못을 박아 붙들어 줘야 했어요(7절). 하나님은 달라요. 하나님이 우리를 붙들어 주세요."}, {"k": "한 가지 더", "t": "아브라함은 하나님 말씀을 듣고 고향을 떠났어요. 어디로 가는지 몰랐지만 하나님을 믿고 따라갔어요. 하나님은 아브라함을 친구라고 부르셨어요."}], "questions": ["하나님은 무엇으로 우리를 붙들어 주신다고 하셨나요? (10절에서 찾아보세요)", "무서울 때 나는 누구를 먼저 찾나요?"], "apply": "오늘 무서운 일이 생기면 “하나님이 내 손을 붙들고 계셔요.” 하고 말해요.", "prayer": "하나님, 저를 버리지 않고 꼭 붙들어 주셔서 고마워요. 저는 ___ 때문에 무서울 때가 있어요. 그때 하나님이 함께 계심을 기억하게 해 주세요. 예수님 이름으로 기도합니다. 아멘."}}, {"day_label": "수요일", "ref": "요 15:12-15", "passage": {"ref": "요 15:12-15", "label": "요한복음 15:12–15", "source": "개역개정", "verses": [{"v": 12, "text": "내 계명은 곧 내가 너희를 사랑한 것 같이 너희도 서로 사랑하라 하는 이것이니라"}, {"v": 13, "text": "사람이 친구를 위하여 자기 목숨을 버리면 이보다 더 큰 사랑이 없나니"}, {"v": 14, "text": "너희는 내가 명하는 대로 행하면 곧 나의 친구라"}, {"v": 15, "text": "이제부터는 너희를 종이라 하지 아니하리니 종은 주인이 하는 것을 알지 못함이라 너희를 친구라 하였노니 내가 내 아버지께 들은 것을 다 너희에게 알게 하였음이라"}]}, "adult": {"title": "너희를 친구라 하였노니", "lead": "예수님은 목숨을 버리는 사랑으로 우리를 종이 아니라 친구라고 부르십니다.", "explain": [{"k": "12–13절", "t": "요한복음 13–17장은 십자가 전날 밤 예수님이 제자들과 나누신 말씀입니다. 그날 밤 예수님은 제자들의 발을 씻기셨습니다(13장). 15장은 포도나무와 가지 비유로 시작합니다. 12절에서 예수님은 계명을 하나로 모으십니다. 「내가 너희를 사랑한 것 같이 너희도 서로 사랑하라.」 사랑의 기준은 예수님이 보여 주신 사랑입니다. 13절은 그 사랑이 어디까지 가는지 밝힙니다. 친구를 위하여 목숨을 버리는 사랑입니다. 예수님은 다음 날 십자가에서 이 말씀대로 하셨습니다."}, {"k": "14–15절", "t": "「친구」는 헬라어로 필로스(φίλος)입니다. 야고보서 4:4의 「세상과 벗이 되고자 하는 자」와 2:23의 「하나님의 벗」에도 같은 낱말이 쓰였습니다. 예수님은 종과 친구를 맞세우십니다. 종은 주인이 하는 일을 알지 못합니다. 예수님은 아버지께 들은 것을 제자들에게 다 알려 주셨습니다. 예수님과 제자들은 마음을 나누는 사이가 되었습니다."}, {"k": "14절 다시", "t": "14절의 「내가 명하는 대로 행하면」은 친구가 되는 조건처럼 들립니다. 16절이 순서를 밝힙니다. 「너희가 나를 택한 것이 아니요 내가 너희를 택하여 세웠나니.」 예수님이 먼저 택하시고 먼저 목숨을 내주셨습니다. 순종은 그 사랑을 받은 친구가 드리는 응답입니다. 예수님이 명하신 내용은 12절의 「서로 사랑하라」입니다."}, {"k": "오늘 읽는 법", "t": "주일 설교는 예수님이 섬기는 종으로 오셔서 제자들의 발을 씻기셨다고 했습니다. 하나님 나라에서는 강한 사람이 약한 사람을 섬깁니다. 세상은 힘 있는 사람의 친구가 되려고 합니다. 예수님은 종처럼 섬기시며 우리를 친구로 부르셨습니다. 예수님의 친구는 예수님이 사랑하신 방식대로 사랑하고 섬기는 사람입니다."}], "questions": ["예수님이 나를 「친구」라 부르신다는 말씀이 오늘 나에게 어떻게 들립니까?", "예수님이 나를 사랑하신 것처럼 내가 사랑하고 섬겨야 할 사람은 누구입니까?"], "apply": "오늘 가까운 사람 한 명을 위해 내 시간이나 편안함 하나를 내어 줍니다. 대가를 바라지 않고 섬깁니다.", "prayer": "주 예수님, 저를 위해 목숨을 버리시고 종이 아니라 친구라 불러 주셔서 감사합니다. 주님이 사랑하신 것처럼 제가 이웃을 사랑하게 하소서. 세상의 벗이 아니라 주님의 친구로 살게 하소서. 예수님 이름으로 기도합니다. 아멘."}, "youth": {"title": "예수님의 친구", "lead": "예수님은 우리를 위해 목숨을 내주시고 우리를 친구라고 부르셨습니다.", "explain": [{"k": "", "t": "이 말씀은 십자가에 달리시기 전날 밤에 예수님이 제자들에게 하신 말씀입니다. 그날 밤 예수님은 제자들의 발을 씻기셨어요. 그리고 말씀하셨습니다. 「사람이 친구를 위하여 자기 목숨을 버리면 이보다 더 큰 사랑이 없나니」(13절). 다음 날 예수님은 십자가에서 목숨을 내주셨어요."}, {"k": "", "t": "예수님은 「이제부터는 너희를 종이라 하지 아니하리니」라고 하십니다(15절). 종은 주인이 무슨 일을 하는지 몰라요. 예수님은 아버지께 들은 것을 제자들에게 다 알려 주셨어요. 예수님과 우리는 마음을 나누는 친구 사이입니다."}, {"k": "", "t": "학교에서는 인기 있는 친구, 힘 있는 친구 곁에 서고 싶어지지요. 예수님은 반대로 하셨어요. 제자들의 발을 씻기며 섬기셨어요. 예수님의 친구는 예수님처럼 서로 사랑하는 사람입니다(12절)."}], "questions": ["나는 어떤 친구 곁에 서고 싶어 하나요? 그 이유는 무엇인가요?", "이번 주 내가 먼저 다가가 도울 수 있는 친구는 누구인가요?"], "apply": "오늘 혼자 있는 친구에게 먼저 말을 걸거나, 가족이 할 일 하나를 대신 해 봅니다.", "prayer": "예수님, 저를 친구라고 불러 주셔서 고마워요. 예수님이 사랑하신 것처럼 저도 친구들을 사랑하게 해 주세요. 예수님 이름으로 기도합니다. 아멘."}, "kids": {"title": "목숨까지 주신 친구", "lead": "예수님은 우리를 친구라고 부르셨어요.", "retell": ["십자가에 달리시기 전날 밤이었어요. 예수님이 제자들에게 말씀하셨어요. “내가 너희를 사랑한 것처럼 너희도 서로 사랑하여라. 친구를 위해 목숨을 내놓는 사랑보다 더 큰 사랑은 없단다.”", "예수님이 또 말씀하셨어요. “이제 나는 너희를 종이라고 부르지 않겠다. 너희를 친구라고 부른다. 아버지께 들은 것을 너희에게 다 알려 주었기 때문이야.” 다음 날 예수님은 우리를 위해 십자가에서 돌아가셨어요."], "explain": [{"k": "찾아보세요", "t": "예수님이 제자들을 무엇이라고 부르셨나요? 15절에서 찾아 ○표를 해 보세요. 「서로 사랑하라」는 말을 12절에서 찾아 밑줄을 그어 보세요."}, {"k": "생각해 보세요", "t": "좋은 친구는 내가 힘들 때 곁에 있어 줘요. 예수님은 우리를 위해 목숨까지 주셨어요. 예수님보다 더 좋은 친구는 없어요."}, {"k": "한 가지 더", "t": "그날 밤 예수님은 제자들의 발을 씻어 주셨어요(요 13장). 선생님이 제자들을 섬기셨어요. 예수님의 친구는 다른 친구를 도와주는 사람이에요."}], "questions": ["가장 큰 사랑은 어떤 사랑이라고 했나요? (13절에서 찾아보세요)", "오늘 내가 도와줄 수 있는 사람은 누구인가요?"], "apply": "오늘 친구나 동생이 힘들어하면 먼저 가서 도와줘요.", "prayer": "예수님, 저를 친구라고 불러 주셔서 고마워요. 오늘 ___을 도와주고 싶어요. 예수님처럼 사랑하게 해 주세요. 예수님 이름으로 기도합니다. 아멘."}}, {"day_label": "금요일", "ref": "요일 2:15-17", "passage": {"ref": "요일 2:15-17", "label": "요한일서 2:15–17", "source": "개역개정", "verses": [{"v": 15, "text": "이 세상이나 세상에 있는 것들을 사랑하지 말라 누구든지 세상을 사랑하면 아버지의 사랑이 그 안에 있지 아니하니"}, {"v": 16, "text": "이는 세상에 있는 모든 것이 육신의 정욕과 안목의 정욕과 이생의 자랑이니 다 아버지께로부터 온 것이 아니요 세상으로부터 온 것이라"}, {"v": 17, "text": "이 세상도, 그 정욕도 지나가되 오직 하나님의 뜻을 행하는 자는 영원히 거하느니라"}]}, "adult": {"title": "세상도 그 정욕도 지나가되", "lead": "요한은 세상을 사랑하는 마음과 아버지의 사랑이 한 사람 안에 함께 있을 수 없다고 말합니다.", "explain": [{"k": "15절", "t": "요한일서는 거짓 가르침이 교회를 흔들던 때에 요한이 성도들에게 쓴 편지입니다. 요한은 「이 세상이나 세상에 있는 것들을 사랑하지 말라」고 명합니다. 요한복음 3:16은 「하나님이 세상을 이처럼 사랑하사」라고 말합니다. 두 말씀은 부딪치지 않습니다. 요한복음 3:16의 세상은 하나님이 구원하려 하시는 사람들입니다. 요한일서의 세상은 하나님을 떠나 자기를 높이는 질서입니다. 세상을 사랑하는 사람 안에는 「아버지의 사랑」이 없습니다. 야고보서 4:4와 같은 말씀입니다."}, {"k": "16절", "t": "요한은 세상에 있는 것을 세 가지로 묶습니다. 「육신의 정욕」은 몸의 욕구를 채우려는 마음입니다. 「안목의 정욕」은 눈에 보이는 것을 갖고 싶은 마음입니다. 「이생의 자랑」에서 「자랑」은 헬라어로 알라조네이아(ἀλαζονεία)입니다. 가진 것을 부풀려 내세우는 허세를 뜻합니다. 야고보서 4:16의 「허탄한 자랑」에도 같은 낱말이 쓰였습니다. 요한은 세 가지 모두 「아버지께로부터 온 것이 아니요 세상으로부터 온 것」이라고 말합니다."}, {"k": "17절", "t": "요한은 세상을 사랑하지 말아야 할 까닭을 밝힙니다. 「이 세상도, 그 정욕도 지나가되.」 세상이 약속하는 것은 오래가지 않습니다. 「오직 하나님의 뜻을 행하는 자는 영원히 거하느니라.」 하나님의 뜻을 행하는 사람은 지나가지 않는 하나님 안에 머뭅니다."}, {"k": "오늘 읽는 법", "t": "주일 설교는 세상과 벗한다는 말이 세상 속에서 산다는 뜻이 아니라고 했습니다. 세상이 옳다고 여기는 기준을 하나님보다 앞세운다는 뜻입니다. 요한도 세상을 떠나 살라고 하지 않습니다. 더 많이 가지고, 더 높이 오르고, 더 인정받으려는 마음을 살피라고 합니다. 설교는 하나님이 사랑으로 주시는 것이 세상이 약속하는 것보다 훨씬 낫다고 했습니다. 하나님의 사랑을 아는 사람은 세상의 자랑을 내려놓을 수 있습니다."}], "questions": ["육신의 정욕, 안목의 정욕, 이생의 자랑 가운데 요즘 내 마음을 가장 많이 끄는 것은 무엇입니까?", "내 하루를 돌아보면, 나는 지나가는 것과 영원한 것 가운데 어느 쪽에 힘을 쏟고 있습니까?"], "apply": "오늘 남에게 내세우고 싶은 것 하나를 적어 봅니다. 그 대신 하나님의 뜻을 따라 이웃을 섬길 일 하나를 찾아 오늘 실천합니다.", "prayer": "아버지 하나님, 저는 지나갈 세상을 붙들며 살 때가 많았습니다. 세상을 사랑하는 마음을 거두시고 아버지의 사랑으로 채워 주소서. 가진 것을 자랑하지 않고 하나님의 뜻을 행하며 살게 하소서. 예수님 이름으로 기도합니다. 아멘."}, "youth": {"title": "지나가는 것, 남는 것", "lead": "세상이 주는 것은 지나가고, 하나님의 뜻을 행하는 사람은 영원히 남습니다.", "explain": [{"k": "", "t": "요한은 「이 세상이나 세상에 있는 것들을 사랑하지 말라」고 합니다(15절). 학교도 친구도 게임도 다 나쁘다는 말이 아니에요. 여기서 세상은 하나님 없이 자기를 높이려는 생각과 기준을 말합니다."}, {"k": "", "t": "요한은 세상에 있는 것을 세 가지로 말합니다(16절). 몸이 원하는 대로 하고 싶은 마음, 눈에 보이는 것을 다 갖고 싶은 마음, 남보다 잘나 보이고 싶은 마음입니다. SNS를 보다 보면 세 가지 마음이 한꺼번에 올라오지요."}, {"k": "", "t": "17절은 「이 세상도, 그 정욕도 지나가되」라고 말합니다. 오늘 유행하는 것은 내일 바뀝니다. 「오직 하나님의 뜻을 행하는 자는 영원히 거하느니라.」 하나님은 지나가는 것보다 남는 것을 붙들라고 하십니다."}], "questions": ["남보다 잘나 보이고 싶어서 한 행동이 있었나요?", "오늘 내가 따를 수 있는 하나님의 뜻은 무엇일까요?"], "apply": "오늘 SNS를 보는 시간을 30분 줄이고, 그 시간에 가족이나 친구를 도울 일 하나를 해 봅니다.", "prayer": "하나님, 남보다 잘나 보이려는 마음을 내려놓게 해 주세요. 지나가는 것보다 하나님의 뜻을 따라 살게 해 주세요. 예수님 이름으로 기도합니다. 아멘."}, "kids": {"title": "사라지는 것, 영원한 것", "lead": "세상의 것은 지나가지만 하나님의 뜻을 따르는 사람은 영원히 살아요.", "retell": ["요한 사도가 교회 사람들에게 편지를 썼어요. “세상과 세상에 있는 것들을 사랑하지 마세요. 세상을 사랑하는 사람 안에는 하나님 아버지의 사랑이 없어요.”", "요한은 세상에 있는 것을 알려 주었어요. 내 몸이 하고 싶은 대로 하려는 마음, 보이는 것을 다 가지려는 마음, 남에게 뽐내려는 마음이에요. 요한이 말했어요. “이런 것은 다 지나가요. 하나님의 뜻을 따르는 사람은 영원히 살아요.”"], "explain": [{"k": "찾아보세요", "t": "세상에 있는 세 가지를 16절에서 찾아 ○표를 해 보세요. 영원히 거하는 사람은 누구인지 17절에서 찾아 밑줄을 그어 보세요."}, {"k": "생각해 보세요", "t": "새 장난감도 시간이 지나면 낡아요. 친구에게 자랑하던 물건도 금방 잊혀요. 하나님의 사랑은 낡지 않아요."}, {"k": "한 가지 더", "t": "하나님의 뜻을 따르는 일은 어렵지 않아요. 친구를 도와주고, 양보하고, 고맙다고 말하는 일도 하나님의 뜻이에요."}], "questions": ["세상과 세상의 정욕은 어떻게 된다고 했나요? (17절에서 찾아보세요)", "내가 친구에게 뽐내고 싶은 것은 무엇인가요?"], "apply": "오늘 뽐내고 싶은 마음이 들면 친구를 칭찬해 줘요.", "prayer": "하나님, 뽐내고 싶은 마음을 내려놓게 해 주세요. 오늘 ___에게 친절하게 하고 싶어요. 하나님의 뜻을 따르게 해 주세요. 예수님 이름으로 기도합니다. 아멘."}}]};
const AGES = [["adult","청장년"],["youth","청소년"],["kids","어린이"]];
const state = { age: "adult", day: 0 };
const esc = s => String(s ?? "").replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const rich = s => esc(s).replace(/&lt;b&gt;/g,"<b>").replace(/&lt;\/b&gt;/g,"</b>");

function readHash(){
  const m = location.hash.match(/^#(adult|youth|kids)-(\d)$/);
  if (m) { state.age = m[1]; state.day = Math.min(DATA.days.length-1, Math.max(0, +m[2]-1)); return; }
  try { const s = JSON.parse(localStorage.getItem("qt-set-last")||"null"); if (s && AGES.some(a=>a[0]===s.age)) { state.age = s.age; state.day = Math.min(DATA.days.length-1, s.day|0); } } catch(e){}
}
function remember(){ try { localStorage.setItem("qt-set-last", JSON.stringify(state)); } catch(e){} history.replaceState(null,"",`#${state.age}-${state.day+1}`); }
function setAccent(){
  const r = document.documentElement.style;
  r.setProperty("--accent", `var(--a-${state.age})`); r.setProperty("--accent-soft", `var(--a-${state.age}-soft)`);
}
function renderTabs(){
  document.getElementById("ageTabs").innerHTML = AGES.map(([k,l]) => `<button role="tab" id="age-${k}" aria-selected="${state.age===k}" data-age="${k}">${l}</button>`).join("");
  document.getElementById("dayTabs").innerHTML = DATA.days.map((d,i) => `<button role="tab" id="day-${i}" aria-selected="${state.day===i}" data-day="${i}"><span>${esc(d.day_label)}</span><small>${esc(d.ref)}</small></button>`).join("");
}
function section(lbl, inner){ return `<section class="sec"><div class="lbl">${lbl}</div><div class="body">${inner}</div></section>`; }
function renderPanel(){
  const d = DATA.days[state.day]; const c = d[state.age];
  const verses = d.passage.verses.map(v => `<span class="v">${v.v}</span>${esc(v.text)} `).join("");
  let html = `<div class="head"><span class="ref">${esc(d.passage.label)}</span><h2>${esc(c.title)}</h2>${c.lead ? `<div class="lead">${rich(c.lead)}</div>` : ""}</div>`;
  html += `<div class="scripture"><p>${verses}</p><span class="src">${esc(d.passage.source)}</span></div>`;
  if (c.retell && c.retell.length) html += `<div class="retell"><span class="lbl">쉽게 읽기</span>${c.retell.map(p=>`<p>${rich(p)}</p>`).join("")}</div>`;
  html += section("설명", c.explain.map(p => `<p>${p.k ? `<span class="k">${esc(p.k)}</span>` : ""}${rich(p.t)}</p>`).join(""));
  html += section("묵상 질문", `<ol class="qs">${c.questions.map((q,i)=>`<li><span class="n">${i+1}</span><div>${rich(q)}<div class="fill"></div></div></li>`).join("")}</ol>`);
  html += section("적용", `<div class="apply">${rich(c.apply)}</div>`);
  html += section("기도", `<div class="prayer">${rich(c.prayer).replace(/___+/g,'<span class="blank"></span>')}</div>`);
  const last = state.day === DATA.days.length-1;
  html += `<div class="nav"><button id="prev" ${state.day===0?"disabled":""}>← 이전</button><button id="next" ${last?"disabled":""}>다음 →</button></div>`;
  document.getElementById("panel").innerHTML = html;
}
function render(){ setAccent(); renderTabs(); renderPanel(); remember(); document.title = `${DATA.set_title} · ${AGES.find(a=>a[0]===state.age)[1]}`; }
document.getElementById("eyebrow").textContent = DATA.eyebrow || "";
document.getElementById("setTitle").textContent = DATA.set_title;
document.getElementById("sermonLine").innerHTML = DATA.sermon ? `이번 주 설교 <b>${esc(DATA.sermon.title)}</b> · ${esc(DATA.sermon.ref)}${DATA.sermon.date ? ` · ${esc(DATA.sermon.date)}` : ""}` : "";
document.getElementById("foot").innerHTML = rich(DATA.footer || "");
document.getElementById("app").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.age) state.age = b.dataset.age;
  else if (b.dataset.day) state.day = +b.dataset.day;
  else if (b.id === "prev") state.day--; else if (b.id === "next") state.day++; else return;
  render(); if (b.dataset.day !== undefined || b.id === "prev" || b.id === "next") document.getElementById("panel").scrollIntoView({block:"start", behavior:"smooth"});
});
window.addEventListener("hashchange", () => { readHash(); render(); });
readHash(); render();
</script>

</body>
</html>
