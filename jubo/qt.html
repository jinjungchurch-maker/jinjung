<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>말은 어디에서 나오는가</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@500;700&display=swap">
<style>
  :root {
    --bg: #f9f7f2; --paper: #ffffff; --ink: #1e2a2b; --muted: #66716f; --line: #e4dfd4; --soft: #f1ede4;
    --a-adult: #2f6b6f; --a-youth: #4b5ea8; --a-kids: #c9612e;
    --a-adult-soft: #e6f0f0; --a-youth-soft: #e9ecf8; --a-kids-soft: #fbeae0;
    --sans: 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    --serif: 'Noto Serif KR', 'Apple Myungjo', 'Batang', serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #15191a; --paper: #1d2324; --ink: #ece7dc; --muted: #9aa5a3; --line: #2f3739; --soft: #242c2d;
      --a-adult: #7fc2c5; --a-youth: #a4b0ee; --a-kids: #f0a074;
      --a-adult-soft: #1f2f30; --a-youth-soft: #23283b; --a-kids-soft: #362820;
    }
  }
  :root[data-theme="dark"] {
    --bg: #15191a; --paper: #1d2324; --ink: #ece7dc; --muted: #9aa5a3; --line: #2f3739; --soft: #242c2d;
    --a-adult: #7fc2c5; --a-youth: #a4b0ee; --a-kids: #f0a074;
    --a-adult-soft: #1f2f30; --a-youth-soft: #23283b; --a-kids-soft: #362820;
  }
  html, body { background: var(--bg); color: var(--ink); }
  body { margin: 0; font-family: var(--sans); font-size: 16px; line-height: 1.75; -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 720px; margin: 0 auto; padding-block: 0 64px; padding-inline: 18px; }
  .top { padding-block: 26px 14px; display: flex; flex-direction: column; gap: 6px; }
  .top .eyebrow { font-size: 12px; letter-spacing: .12em; color: var(--muted); font-weight: 500; }
  .top h1 { font-family: var(--serif); font-size: 24px; font-weight: 700; margin: 0; line-height: 1.3; text-wrap: balance; }
  .top .sermon { font-size: 14px; color: var(--muted); }
  .top .sermon b { color: var(--ink); font-weight: 500; }

  .sticky { position: sticky; top: env(safe-area-inset-top, 0px); background: var(--bg); z-index: 5; padding-block: 10px 12px; display: flex; flex-direction: column; gap: 10px; border-bottom: 1px solid var(--line); }
  .seg { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0; border: 1.5px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--paper); }
  .seg button { appearance: none; border: 0; background: transparent; color: var(--muted); font: inherit; font-size: 15px; font-weight: 500; min-height: 44px; cursor: pointer; }
  .seg button + button { border-left: 1.5px solid var(--line); }
  .seg button[aria-selected="true"] { color: #fff; background: var(--accent); }
  .seg button:focus-visible { outline: 2px solid var(--accent); outline-offset: -3px; }
  .days { display: flex; gap: 8px; }
  .days button { appearance: none; flex: 1; border: 1.5px solid var(--line); background: var(--paper); color: var(--muted); border-radius: 10px; min-height: 44px; font: inherit; font-size: 14px; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.2; gap: 2px; padding: 4px 6px; }
  .days button small { font-size: 11px; opacity: .8; }
  .days button[aria-selected="true"] { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); font-weight: 700; }
  .days button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .panel { display: flex; flex-direction: column; gap: 22px; padding-block: 26px 0; }
  .head { display: flex; flex-direction: column; gap: 8px; }
  .head .ref { display: inline-flex; align-self: flex-start; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; color: var(--accent); background: var(--accent-soft); padding: 4px 12px; border-radius: 999px; }
  .head h2 { font-family: var(--serif); font-size: 28px; line-height: 1.25; margin: 0; font-weight: 700; text-wrap: balance; }
  .head .lead { font-size: 15px; color: var(--muted); }

  .scripture { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 20px 22px; font-family: var(--serif); font-size: 17px; line-height: 1.95; }
  .scripture p { margin: 0; }
  .scripture .v { font-family: var(--sans); font-size: 11px; font-weight: 700; color: var(--accent); vertical-align: super; margin-right: 3px; }
  .scripture .src { display: block; margin-top: 12px; font-family: var(--sans); font-size: 12px; color: var(--muted); text-align: right; }
  .retell { background: var(--accent-soft); border-radius: 14px; padding: 18px 20px; font-size: 16px; }
  .retell .lbl { font-size: 12px; font-weight: 700; color: var(--accent); letter-spacing: .08em; display: block; margin-bottom: 6px; }
  .retell p { margin: 0 0 8px; } .retell p:last-child { margin-bottom: 0; }

  .sec { display: grid; grid-template-columns: 84px minmax(0, 1fr); gap: 14px; padding-block: 18px; border-top: 1px solid var(--line); }
  .sec .lbl { font-size: 13px; font-weight: 700; color: var(--accent); letter-spacing: .06em; padding-top: 3px; }
  .sec .body { display: flex; flex-direction: column; gap: 10px; }
  .sec p { margin: 0; }
  .sec .k { font-weight: 700; color: var(--accent); margin-right: 6px; }
  .qs { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px; }
  .qs li { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 6px; }
  .qs li .n { width: 24px; height: 24px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); font-size: 12px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; margin-top: 4px; }
  .fill { border-bottom: 1.5px dashed var(--line); min-height: 34px; }
  .apply { background: var(--soft); border-radius: 12px; padding: 14px 16px; }
  .prayer { font-family: var(--serif); font-size: 16.5px; line-height: 1.9; }
  .prayer .blank { display: inline-block; min-width: 140px; border-bottom: 1.5px solid var(--line); }
  .nav { display: flex; justify-content: space-between; gap: 12px; padding-top: 10px; }
  .nav button { appearance: none; border: 1.5px solid var(--line); background: var(--paper); color: var(--ink); border-radius: 999px; min-height: 44px; padding: 0 18px; font: inherit; font-size: 14px; cursor: pointer; }
  .nav button:disabled { opacity: .35; cursor: default; }
  .foot { margin-top: 40px; font-size: 12px; color: var(--muted); text-align: center; line-height: 1.6; }
  @media (max-width: 480px) {
    .sec { grid-template-columns: 1fr; gap: 6px; }
    .head h2 { font-size: 24px; }
    .scripture { padding: 16px 18px; font-size: 16px; }
  }
  @media (prefers-reduced-motion: no-preference) { .panel { animation: in .25s ease; } @keyframes in { from { opacity: .4; transform: translateY(4px); } to { opacity: 1; transform: none; } } }
</style>
</head>
<body>

<div class="wrap" id="app">
  <header class="top">
    <div class="eyebrow" id="eyebrow"></div>
    <h1 id="setTitle"></h1>
    <div class="sermon" id="sermonLine"></div>
  </header>
  <div class="sticky">
    <div class="seg" role="tablist" aria-label="대상" id="ageTabs"></div>
    <div class="days" role="tablist" aria-label="날" id="dayTabs"></div>
  </div>
  <main class="panel" id="panel"></main>
  <footer class="foot" id="foot"></footer>
</div>

<script>
const DATA = {"set_title": "말은 어디에서 나오는가", "eyebrow": "이번 주 QT · 9월 다섯째 주", "sermon": {"title": "이것이 마땅하지 아니하니라", "ref": "야고보서 3:9–12", "date": "2026. 9. 27"}, "footer": "성경전서 개역개정판 © 대한성서공회 · 진중교회", "days": [{"day_label": "월요일", "ref": "창 3:8-13", "passage": {"ref": "창 3:8-13", "label": "창세기 3:8–13", "source": "개역개정", "verses": [{"v": 8, "text": "그들이 그 날 바람이 불 때 동산에 거니시는 여호와 하나님의 소리를 듣고 아담과 그의 아내가 여호와 하나님의 낯을 피하여 동산 나무 사이에 숨은지라"}, {"v": 9, "text": "여호와 하나님이 아담을 부르시며 그에게 이르시되 네가 어디 있느냐"}, {"v": 10, "text": "이르되 내가 동산에서 하나님의 소리를 듣고 내가 벗었으므로 두려워하여 숨었나이다"}, {"v": 11, "text": "이르시되 누가 너의 벗었음을 네게 알렸느냐 내가 네게 먹지 말라 명한 그 나무 열매를 네가 먹었느냐"}, {"v": 12, "text": "아담이 이르되 하나님이 주셔서 나와 함께 있게 하신 여자 그가 그 나무 열매를 내게 주므로 내가 먹었나이다"}, {"v": 13, "text": "여호와 하나님이 여자에게 이르시되 네가 어찌하여 이렇게 하였느냐 여자가 이르되 뱀이 나를 꾀므로 내가 먹었나이다"}]}, "adult": {"title": "가장 먼저 무너진 것은 말이었다", "lead": "주일에 들은 ‘깨어진 하나님의 형상’이 어디에서 시작되었는지, 창세기가 그 첫 장면을 보여 줍니다.", "explain": [{"k": "8–10절", "t": "‘그 날 바람이 불 때 동산에 거니시는 여호와 하나님의 소리’는 원래 반가운 소리였습니다. 하나님이 가까이 오시는 기척이니까요. 그런데 같은 소리를 듣고 두 사람은 나무 사이로 숨습니다. 소리가 달라진 것이 아니라 사람이 달라졌습니다. 하나님은 ‘네가 어디 있느냐’ 물으십니다. 위치를 모르셔서 묻지 않으십니다. 숨은 사람이 제 입으로 나와 말하게 하시려는 부르심입니다. 아담의 대답은 ‘두려워하여 숨었나이다’입니다. 하나님과의 사이가 틀어지자 가장 먼저 <b>말<\/b>이 달라졌습니다."}, {"k": "11–12절", "t": "하나님이 ‘내가 네게 먹지 말라 명한 그 나무 열매를 네가 먹었느냐’ 물으십니다. 예, 아니요로 답할 수 있는 질문입니다. 그런데 아담은 ‘하나님이 주셔서 나와 함께 있게 하신 여자 그가 그 나무 열매를 내게 주므로 내가 먹었나이다’ 합니다. 한 문장으로 두 사람을 겨눕니다. 아내와, 그 아내를 주신 하나님입니다. 조금 전까지 ‘내 뼈 중의 뼈요 살 중의 살이라’ 노래하던 그 입술입니다. 입이 바뀐 것이 아니라 마음이 바뀌었습니다."}, {"k": "13절", "t": "여자도 같은 길을 갑니다. ‘뱀이 나를 꾀므로 내가 먹었나이다.’ 책임이 아담에게서 하와로, 하와에게서 뱀으로 돌고 돕니다. 아무도 ‘제가 그랬습니다’ 말하지 않습니다. 죄는 이렇게 <b>말을 타고 번집니다<\/b>. 야고보가 본 공동체의 저주와 독설도 먼 데서 온 것이 아닙니다. 바로 이 자리에서 흘러나옵니다."}, {"k": "오늘 읽는 법", "t": "내가 잘못했을 때 제일 먼저 나오는 문장을 떠올려 보십시오. ‘상황이 그랬습니다’, ‘저 사람이 먼저…’. 그 문장이 내 마음의 샘을 보여 줍니다. ‘네가 어디 있느냐’는 정죄가 아니라 부르심입니다. 숨은 자리에서 나와 사실대로 말하는 데서 회복이 시작됩니다."}], "questions": ["최근에 내가 한 변명 가운데, 다른 사람을 끌어들인 말이 있었습니까?", "하나님이 오늘 ‘네가 어디 있느냐’ 물으신다면, 나는 지금 어디에 숨어 있습니까?", "사실대로 말하는 것이 가장 두려운 상대는 누구입니까?"], "apply": "오늘 하루, 변명이 먼저 나오려는 순간에 한 번 멈춥니다. ‘그건 제가 잘못했습니다’ 한 문장을 다른 말보다 먼저 꺼내 봅니다. 가족 가운데 한 사람에게라도 그렇게 해 봅니다.", "prayer": "하나님, 숨어서 변명하는 저를 오늘도 불러 주시니 감사합니다. 제 잘못을 다른 사람에게 떠넘기지 않게 하시고, 사실대로 말할 용기를 주십시오. 나무 사이에서 나와 주님 앞에 서게 하소서. 예수님 이름으로 기도합니다. 아멘."}, "youth": {"title": "왜 남 탓부터 나올까", "lead": "잘못한 순간 우리 입에서 제일 먼저 나오는 말이 무엇인지, 성경의 첫 사람이 그대로 보여 줍니다.", "explain": [{"k": "", "t": "아담과 하와는 하나님의 소리를 듣고 숨었습니다. 원래는 반가운 소리였어요. 하나님이 가까이 오시는 소리니까요. 소리가 무서워진 게 아니라, 그 소리를 듣는 사람이 달라진 겁니다."}, {"k": "", "t": "하나님이 ‘네가 먹었느냐’ 물으십니다. ‘네’ 한마디면 되는 질문이에요. 그런데 아담은 ‘하나님이 주신 그 여자가 줘서 먹었습니다’ 합니다. 한 문장에 아내 탓과 하나님 탓을 같이 담았어요. 하와도 똑같이 뱀 탓을 합니다. 아무도 ‘제가 그랬습니다’ 말하지 않습니다."}, {"k": "", "t": "우리도 비슷합니다. 시험을 못 보면 문제가 이상했고, 늦으면 버스가 안 왔고, 싸우면 저쪽이 먼저였어요. 그 말이 거짓말은 아닐 수도 있어요. 하지만 그 말만 하다 보면 내가 고칠 수 있는 게 하나도 남지 않습니다. ‘네가 어디 있느냐’는 하나님의 질문은 혼내려는 말이 아니라 나오라는 부르심입니다."}], "questions": ["요즘 내가 가장 자주 쓰는 변명은 무엇인가요?", "‘제가 그랬어요’라고 말하기 가장 어려운 사람은 누구인가요? 왜 그럴까요?"], "apply": "오늘 남 탓이 먼저 튀어나오려 할 때 3초만 멈춰 봅니다. 그리고 내가 고칠 수 있는 부분 하나만 골라 말해 봅니다.", "prayer": "하나님, 잘못했을 때 남 탓부터 하는 제 입술을 아십니다. 숨지 않고 솔직하게 말할 용기를 주세요. 제 마음부터 정직해지게 해 주세요. 예수님 이름으로 기도합니다. 아멘."}, "kids": {"title": "아담이 나무 뒤에 숨었어요", "lead": "오늘 말씀에는 하나님을 피해 숨은 사람 이야기가 나와요.", "retell": ["바람이 부는 날, 아담과 하와는 동산을 거니시는 하나님의 소리를 들었어요. 그런데 반갑게 달려 나가지 않고 나무 사이에 숨었어요. 하나님이 아담을 부르셨어요. “네가 어디 있느냐.” 아담이 말했어요. “소리를 듣고 무서워서 숨었어요.”", "하나님이 물으셨어요. “먹지 말라고 한 열매를 네가 먹었느냐.” 아담이 대답했어요. “하나님이 주신 저 여자가 저에게 주어서 먹었어요.” 하와에게도 물으시니 하와가 말했어요. “뱀이 저를 꾀어서 먹었어요.”"], "explain": [{"k": "찾아보세요", "t": "아담이 숨은 까닭을 말한 절에 ○표를 해 보세요(10절). 그리고 아담이 누구 때문이라고 말했는지 12절에서 찾아 밑줄을 그어 보세요."}, {"k": "생각해 보세요", "t": "블록을 쏟아 놓고 동생이 그랬다고 말한 적이 있나요? 아담도 똑같았어요. 하나님이 물으셨을 때 “제가 먹었어요” 하지 않고 다른 사람 이야기부터 했어요."}, {"k": "한 가지 더", "t": "하나님이 “네가 어디 있느냐” 하신 것은 혼내려는 말이 아니에요. 숨어 있지 말고 나오라는 부르심이에요. 하나님은 지금도 우리를 그렇게 부르세요."}], "questions": ["아담은 하나님의 소리를 듣고 어떻게 했나요? (8절에서 찾아보세요)", "내가 잘못하고 숨고 싶었던 때는 언제였나요?"], "apply": "오늘 잘못한 일이 생기면 숨지 않고 “제가 그랬어요” 하고 먼저 말해 봐요.", "prayer": "하나님, 잘못했을 때 숨고 싶은 제 마음을 아세요. 오늘은 ___에게 솔직하게 말할 용기를 주세요. 예수님 이름으로 기도합니다. 아멘."}}, {"day_label": "수요일", "ref": "마 12:33-37", "passage": {"ref": "마 12:33-37", "label": "마태복음 12:33–37", "source": "개역개정", "verses": [{"v": 33, "text": "나무도 좋고 열매도 좋다 하든지 나무도 좋지 않고 열매도 좋지 않다 하든지 하라 그 열매로 나무를 아느니라"}, {"v": 34, "text": "독사의 자식들아 너희는 악하니 어떻게 선한 말을 할 수 있느냐 이는 마음에 가득한 것을 입으로 말함이라"}, {"v": 35, "text": "선한 사람은 그 쌓은 선에서 선한 것을 내고 악한 사람은 그 쌓은 악에서 악한 것을 내느니라"}, {"v": 36, "text": "내가 너희에게 이르노니 사람이 무슨 무익한 말을 하든지 심판 날에 이에 대하여 심문을 받으리니"}, {"v": 37, "text": "네 말로 의롭다 함을 받고 네 말로 정죄함을 받으리라"}]}, "adult": {"title": "열매가 나무를 알려 준다", "lead": "주일 설교가 인용한 ‘마음에 가득한 것을 입으로 말함이라’는 말씀입니다. 예수님이 직접 진단하신 자리입니다.", "explain": [{"k": "33절", "t": "예수님은 바리새인들과 논쟁하시는 중입니다. 그들은 예수님이 귀신의 힘으로 귀신을 쫓는다고 몰아붙였습니다. 예수님은 그 말을 되받지 않으시고 기준 하나를 내놓으십니다. ‘그 열매로 나무를 아느니라.’ 나무와 열매를 따로 떼어 판단하지 말라는 뜻입니다. 좋은 나무라면서 나쁜 열매를 설명할 방법은 없습니다. 야고보가 무화과나무와 포도나무를 들어 말한 것과 같은 논리입니다. 판단의 자리를 행동에서 <b>근원<\/b>으로 옮기십니다."}, {"k": "34–35절", "t": "‘마음에 가득한 것을 입으로 말함이라.’ 원문의 ‘가득한 것’은 넘쳐흐른다는 말에 가깝습니다. 그릇에 담긴 것이 흔들리면 넘치듯, 말은 마음에 이미 차 있던 것이 밖으로 나온 것입니다. 그래서 35절은 ‘쌓은 선’, ‘쌓은 악’이라 합니다. 말은 그날 아침에 만들어지지 않습니다. 오래 쌓인 것이 어느 순간 흘러나옵니다. 입술만 단속하는 노력이 번번이 무너지는 까닭이 여기 있습니다."}, {"k": "36–37절", "t": "예수님은 ‘무익한 말’까지 심문을 받는다고 하십니다. 무익한 말은 욕설이나 거짓말이 아니라, 아무 생각 없이 흘린 말을 가리킵니다. 가볍게 던진 농담, 별 뜻 없이 옮긴 소문입니다. 우리는 그런 말을 말로 치지 않는데, 예수님은 그것까지 나를 드러내는 증거로 보십니다. ‘네 말로 의롭다 함을 받고 네 말로 정죄함을 받으리라.’ 말이 나를 구원한다는 뜻이 아니라, 말이 내 안을 정확히 드러낸다는 뜻입니다."}, {"k": "오늘 읽는 법", "t": "이 말씀 앞에서 할 일은 말버릇 점검이 아닙니다. 마음에 무엇이 쌓이고 있는지 보는 일입니다. 오늘 내 말이 거칠었다면, 그 말을 지우려 하기 전에 무엇이 그렇게 쌓였는지 주님 앞에 내어놓으십시오. 나무가 달라져야 열매가 달라집니다."}], "questions": ["요즘 내 입에서 자주 흘러나오는 말은 무엇입니까? 그 말은 무엇이 쌓인 결과입니까?", "‘무익한 말’이라 여기고 그냥 넘긴 말 가운데, 누군가에게 상처가 된 말이 있었습니까?", "말을 고치려는 노력이 번번이 실패했던 경험이 있습니까? 무엇이 빠져 있었을까요?"], "apply": "오늘 하루 내가 한 말 가운데 마음에 걸리는 말 하나를 적어 봅니다. 그 말을 지우려 하지 말고, 그 말이 흘러나온 마음의 자리를 주님께 아룁니다.", "prayer": "주님, 제 말이 제 마음을 그대로 보여 준다는 사실이 두렵습니다. 제 안에 무엇이 쌓이고 있는지 보게 하시고, 쌓인 것을 주님 앞에 쏟아 놓게 하소서. 좋은 나무가 되게 하셔서 좋은 열매를 맺게 하소서. 예수님 이름으로 기도합니다. 아멘."}, "youth": {"title": "말은 마음에서 넘쳐 나온다", "lead": "예수님은 말버릇을 고치라 하지 않으시고, 그 말이 어디서 나왔는지를 물으십니다.", "explain": [{"k": "", "t": "예수님은 나무와 열매 이야기를 하십니다. 사과나무에서 감이 열리지 않아요. 열매를 보면 나무를 알 수 있습니다. 예수님은 이 비유로 사람 이야기를 하십니다. 말을 보면 그 사람 안에 무엇이 있는지 알 수 있다는 거예요."}, {"k": "", "t": "‘마음에 가득한 것을 입으로 말함이라’(34절). 컵에 물이 가득 차 있으면 살짝만 건드려도 넘치잖아요. 말도 그렇습니다. 그날 갑자기 만들어진 게 아니라, 오래 쌓여 있던 게 흔들릴 때 넘쳐 나온 거예요. 그래서 참기만 해서는 오래 못 갑니다."}, {"k": "", "t": "예수님은 ‘무익한 말’까지 말씀하십니다(36절). 욕이 아니라 별생각 없이 던진 말이에요. 장난으로 한 말, 그냥 옮긴 이야기. 우리는 그걸 말로 치지도 않는데 예수님은 그것까지 보십니다. 내 말을 다 지울 수는 없지만, 내 안에 무엇을 채울지는 오늘부터 고를 수 있어요."}], "questions": ["내가 장난으로 한 말 때문에 누군가 상처받은 적이 있나요?", "요즘 내 마음에 가장 많이 쌓이는 감정은 무엇인가요?"], "apply": "오늘 단톡방이나 친구들 사이에서 말을 옮기고 싶은 순간이 오면 한 번 멈춥니다. 그리고 그 사람에 대해 좋은 점 하나를 대신 떠올려 봅니다.", "prayer": "예수님, 제 말이 제 마음을 보여 준다는 걸 오늘 배웠습니다. 제 안에 미움 대신 주님이 주시는 마음이 쌓이게 해 주세요. 무심코 던지는 말도 조심하게 해 주세요. 예수님 이름으로 기도합니다. 아멘."}, "kids": {"title": "마음에 담긴 것이 말이 돼요", "lead": "예수님이 나무와 열매 이야기로 우리 말을 설명해 주세요.", "retell": ["예수님이 말씀하셨어요. “나무는 그 열매를 보면 알 수 있어요.” 좋은 나무에서는 좋은 열매가 열리고, 못된 나무에서는 못된 열매가 열려요. 열매를 보면 어떤 나무인지 알 수 있지요.", "예수님은 사람도 그렇다고 하셨어요. “마음에 가득한 것을 입으로 말한단다.” 착한 사람은 마음에 쌓아 둔 좋은 것에서 좋은 말을 꺼내고, 나쁜 사람은 마음에 쌓아 둔 나쁜 것에서 나쁜 말을 꺼내요."], "explain": [{"k": "찾아보세요", "t": "나무를 무엇으로 알 수 있다고 했는지 33절에서 찾아 ○표를 해 보세요. 그리고 34절에서 ‘마음에 가득한 것’이라는 말에 밑줄을 그어 보세요."}, {"k": "생각해 보세요", "t": "물이 가득 담긴 컵을 살짝 건드리면 어떻게 되나요? 넘쳐요. 우리 마음도 그래요. 마음에 담긴 것이 말이 되어 흘러나와요."}, {"k": "한 가지 더", "t": "그래서 말만 조심하는 것으로는 모자라요. 마음에 무엇을 담을지 골라야 해요. 오늘 마음에 예수님 이야기를 한 가지 담아 보세요."}], "questions": ["예수님은 나무를 무엇으로 안다고 하셨나요? (33절에서 찾아보세요)", "오늘 내 마음에 가장 많이 담겨 있는 것은 무엇인가요?"], "apply": "오늘 친구에게 좋은 말 한마디를 먼저 해 봐요. 그리고 자기 전에 그 친구를 위해 기도해요.", "prayer": "예수님, 제 마음에 좋은 것을 담아 주세요. 오늘 ___에게 예수님을 닮은 말을 하게 해 주세요. 예수님 이름으로 기도합니다. 아멘."}}, {"day_label": "금요일", "ref": "골 3:8-13", "passage": {"ref": "골 3:8-13", "label": "골로새서 3:8–13", "source": "개역개정", "verses": [{"v": 8, "text": "이제는 너희가 이 모든 것을 벗어 버리라 곧 분함과 노여움과 악의와 비방과 너희 입의 부끄러운 말이라"}, {"v": 9, "text": "너희가 서로 거짓말을 하지 말라 옛 사람과 그 행위를 벗어 버리고"}, {"v": 10, "text": "새 사람을 입었으니 이는 자기를 창조하신 이의 형상을 따라 지식에까지 새롭게 하심을 입은 자니라"}, {"v": 11, "text": "거기에는 헬라인이나 유대인이나 할례파나 무할례파나 야만인이나 스구디아인이나 종이나 자유인이 차별이 있을 수 없나니 오직 그리스도는 만유시요 만유 안에 계시니라"}, {"v": 12, "text": "그러므로 너희는 하나님이 택하사 거룩하고 사랑 받는 자처럼 긍휼과 자비와 겸손과 온유와 오래 참음을 옷 입고"}, {"v": 13, "text": "누가 누구에게 불만이 있거든 서로 용납하여 피차 용서하되 주께서 너희를 용서하신 것 같이 너희도 그리하고"}]}, "adult": {"title": "벗고, 입고, 용서하라", "lead": "샘이 새로워진 사람은 어떻게 사는가. 주일 설교의 ‘하나님의 형상 회복’이 일상의 말로 옮겨지는 본문입니다.", "explain": [{"k": "8–9절", "t": "바울이 벗어 버리라고 한 목록을 보십시오. 분함, 노여움, 악의, 비방, 입의 부끄러운 말, 거짓말입니다. 앞의 셋은 마음에 있는 것이고 뒤의 셋은 입으로 나오는 것입니다. 바울은 둘을 한 문장에 묶습니다. 마음과 말을 따로 다루지 않습니다. 야고보가 ‘한 샘에서 두 물이 날 수 없다’고 한 말과 같은 자리입니다. ‘벗어 버리라’는 옷을 벗듯 하라는 말인데, 옷은 내 몸이 아니라 걸친 것입니다. 옛 사람은 내가 어쩔 수 없는 본성이 아니라, 벗을 수 있는 것입니다."}, {"k": "10–11절", "t": "벗으라고만 하지 않고 입으라고 하십니다. ‘새 사람을 입었으니 이는 자기를 창조하신 이의 형상을 따라 지식에까지 새롭게 하심을 입은 자니라.’ 주일 설교의 결론이 여기 그대로 나옵니다. 깨어진 <b>하나님의 형상<\/b>이 회복되는 길입니다. 그리고 11절은 그 회복이 사람 사이의 담을 무너뜨린다고 말합니다. 헬라인과 유대인, 종과 자유인의 차별이 사라집니다. 야고보의 공동체를 흔든 것도 바로 그 차별이었습니다."}, {"k": "12–13절", "t": "입으라고 하신 옷은 긍휼, 자비, 겸손, 온유, 오래 참음입니다. 모두 사람을 대하는 태도입니다. 그리고 마지막에 기준이 나옵니다. ‘주께서 너희를 용서하신 것 같이 너희도 그리하고.’ 내가 용서받은 만큼이 내가 용서할 수 있는 크기입니다. 주일에 들은 대로, 사람을 살리는 말은 말솜씨가 아니라 용서받은 마음에서 나옵니다."}, {"k": "오늘 읽는 법", "t": "이 본문은 ‘착해지라’는 권면이 아닙니다. 벗는 일과 입는 일이 함께 있습니다. 험담을 멈추는 데서 그치면 빈자리만 남습니다. 그 자리에 긍휼과 오래 참음을 입어야 합니다. 오늘 벗을 것 하나와 입을 것 하나를 정해 보십시오."}], "questions": ["오늘 내가 벗어야 할 것 하나를 8절의 목록에서 고른다면 무엇입니까?", "12절의 다섯 가지 가운데 지금 내게 가장 어려운 것은 무엇입니까? 왜 그렇습니까?", "‘주께서 너희를 용서하신 것 같이’ — 내가 받은 용서를 떠올리면, 지금 떠오르는 그 사람에게 무엇을 할 수 있습니까?"], "apply": "오늘 벗을 것 하나와 입을 것 하나를 정해 적습니다. 그리고 용서하지 못한 한 사람을 위해 이름을 불러 기도합니다. 연락할 수 있다면 짧은 안부 한 줄을 보냅니다.", "prayer": "주님, 제가 벗어야 할 말과 마음을 아십니다. 분함과 비방을 벗기시고 긍휼과 오래 참음을 입혀 주십시오. 저를 용서하신 그 용서로 제가 다른 사람을 용서하게 하소서. 깨어진 형상을 날마다 새롭게 하소서. 예수님 이름으로 기도합니다. 아멘."}, "youth": {"title": "벗을 것과 입을 것", "lead": "바울은 말버릇 하나만 고치라 하지 않고, 아예 옷을 갈아입으라고 말합니다.", "explain": [{"k": "", "t": "바울은 벗어 버리라고 합니다(8절). 분함, 화, 악한 마음, 남을 깎아내리는 말, 부끄러운 말, 거짓말이에요. 앞의 셋은 마음에 있는 것이고 뒤의 셋은 입에서 나오는 것입니다. 바울은 둘을 따로 보지 않아요."}, {"k": "", "t": "그런데 벗으라고만 하지 않습니다. 입으라고 해요(12절). 긍휼, 자비, 겸손, 온유, 오래 참음입니다. 험담을 참기만 하면 그 자리가 그냥 비어 있어요. 빈자리에 무엇을 채울지가 더 중요합니다."}, {"k": "", "t": "기준은 하나예요. ‘주께서 너희를 용서하신 것 같이’(13절). 내가 얼마나 용서받았는지 아는 만큼 다른 사람을 용서할 수 있어요. 10절은 그렇게 사는 사람을 ‘새 사람’이라고 부릅니다. 하나님을 닮은 모습이 조금씩 돌아오는 거예요."}], "questions": ["8절의 목록 가운데 내가 오늘 벗어야 할 것은 무엇인가요?", "12절 가운데 내가 한 가지만 입는다면 무엇을 고르고 싶나요?"], "apply": "오늘 누군가를 깎아내리고 싶은 순간이 오면, 그 말을 삼키는 데서 멈추지 말고 그 사람의 좋은 점 하나를 말해 봅니다.", "prayer": "하나님, 제 안의 화와 미움을 벗겨 주세요. 그 자리에 긍휼과 오래 참음을 입혀 주세요. 저를 용서해 주신 것처럼 저도 용서하게 해 주세요. 예수님 이름으로 기도합니다. 아멘."}, "kids": {"title": "나쁜 옷을 벗고 좋은 옷을 입어요", "lead": "오늘 말씀은 우리 마음을 옷에 빗대어 말해 줘요.", "retell": ["바울은 편지에서 이렇게 말했어요. “이제는 이것들을 다 벗어 버리세요.” 화내는 것, 미워하는 것, 남을 나쁘게 말하는 것, 부끄러운 말, 거짓말이에요. 더러워진 옷을 벗듯이 벗으라고 했어요.", "그리고 새 옷을 입으라고 했어요. 불쌍히 여기는 마음, 친절함, 겸손, 부드러움, 오래 참는 마음이에요. 누가 밉더라도 서로 용서하라고 했어요. 예수님이 우리를 용서해 주신 것처럼요."], "explain": [{"k": "찾아보세요", "t": "벗어 버리라고 한 것들을 8절에서 찾아 ○표를 해 보세요. 그리고 입으라고 한 것들을 12절에서 찾아 밑줄을 그어 보세요."}, {"k": "생각해 보세요", "t": "밖에서 놀다 들어오면 더러워진 옷을 벗고 깨끗한 옷으로 갈아입지요. 마음도 그래요. 나쁜 마음을 벗는 것으로 끝이 아니라 좋은 마음을 입어야 해요."}, {"k": "한 가지 더", "t": "용서는 참는 것과 달라요. 참는 것은 꾹 눌러 두는 것이고, 용서는 그 마음을 예수님께 드리고 다시 잘 지내는 거예요."}], "questions": ["바울이 입으라고 한 것 다섯 가지는 무엇인가요? (12절에서 찾아보세요)", "오늘 내가 벗고 싶은 마음은 무엇인가요?"], "apply": "오늘 화가 났던 사람에게 먼저 “괜찮아” 하고 말해 봐요. 어려우면 마음속으로 그 사람을 위해 기도해요.", "prayer": "예수님, 제 마음의 미운 옷을 벗겨 주세요. 그 자리에 친절한 마음을 입혀 주세요. 오늘 ___를 용서하게 도와주세요. 예수님 이름으로 기도합니다. 아멘."}}]};
const AGES = [["adult","청장년"],["youth","청소년"],["kids","어린이"]];
const state = { age: "adult", day: 0 };
const esc = s => String(s ?? "").replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const rich = s => esc(s).replace(/&lt;b&gt;/g,"<b>").replace(/&lt;\/b&gt;/g,"</b>");

function readHash(){
  const m = location.hash.match(/^#(adult|youth|kids)-(\d)$/);
  if (m) { state.age = m[1]; state.day = Math.min(DATA.days.length-1, Math.max(0, +m[2]-1)); return; }
  try { const s = JSON.parse(localStorage.getItem("qt-set-last")||"null"); if (s && AGES.some(a=>a[0]===s.age)) { state.age = s.age; state.day = Math.min(DATA.days.length-1, s.day|0); } } catch(e){}
}
function remember(){ try { localStorage.setItem("qt-set-last", JSON.stringify(state)); } catch(e){} history.replaceState(null,"",`#${state.age}-${state.day+1}`); }
function setAccent(){
  const r = document.documentElement.style;
  r.setProperty("--accent", `var(--a-${state.age})`); r.setProperty("--accent-soft", `var(--a-${state.age}-soft)`);
}
function renderTabs(){
  document.getElementById("ageTabs").innerHTML = AGES.map(([k,l]) => `<button role="tab" id="age-${k}" aria-selected="${state.age===k}" data-age="${k}">${l}</button>`).join("");
  document.getElementById("dayTabs").innerHTML = DATA.days.map((d,i) => `<button role="tab" id="day-${i}" aria-selected="${state.day===i}" data-day="${i}"><span>${esc(d.day_label)}</span><small>${esc(d.ref)}</small></button>`).join("");
}
function section(lbl, inner){ return `<section class="sec"><div class="lbl">${lbl}</div><div class="body">${inner}</div></section>`; }
function renderPanel(){
  const d = DATA.days[state.day]; const c = d[state.age];
  const verses = d.passage.verses.map(v => `<span class="v">${v.v}</span>${esc(v.text)} `).join("");
  let html = `<div class="head"><span class="ref">${esc(d.passage.label)}</span><h2>${esc(c.title)}</h2>${c.lead ? `<div class="lead">${rich(c.lead)}</div>` : ""}</div>`;
  html += `<div class="scripture"><p>${verses}</p><span class="src">${esc(d.passage.source)}</span></div>`;
  if (c.retell && c.retell.length) html += `<div class="retell"><span class="lbl">쉽게 읽기</span>${c.retell.map(p=>`<p>${rich(p)}</p>`).join("")}</div>`;
  html += section("설명", c.explain.map(p => `<p>${p.k ? `<span class="k">${esc(p.k)}</span>` : ""}${rich(p.t)}</p>`).join(""));
  html += section("묵상 질문", `<ol class="qs">${c.questions.map((q,i)=>`<li><span class="n">${i+1}</span><div>${rich(q)}<div class="fill"></div></div></li>`).join("")}</ol>`);
  html += section("적용", `<div class="apply">${rich(c.apply)}</div>`);
  html += section("기도", `<div class="prayer">${rich(c.prayer).replace(/___+/g,'<span class="blank"></span>')}</div>`);
  const last = state.day === DATA.days.length-1;
  html += `<div class="nav"><button id="prev" ${state.day===0?"disabled":""}>← 이전</button><button id="next" ${last?"disabled":""}>다음 →</button></div>`;
  document.getElementById("panel").innerHTML = html;
}
function render(){ setAccent(); renderTabs(); renderPanel(); remember(); document.title = `${DATA.set_title} · ${AGES.find(a=>a[0]===state.age)[1]}`; }
document.getElementById("eyebrow").textContent = DATA.eyebrow || "";
document.getElementById("setTitle").textContent = DATA.set_title;
document.getElementById("sermonLine").innerHTML = DATA.sermon ? `이번 주 설교 <b>${esc(DATA.sermon.title)}</b> · ${esc(DATA.sermon.ref)}${DATA.sermon.date ? ` · ${esc(DATA.sermon.date)}` : ""}` : "";
document.getElementById("foot").innerHTML = rich(DATA.footer || "");
document.getElementById("app").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.age) state.age = b.dataset.age;
  else if (b.dataset.day) state.day = +b.dataset.day;
  else if (b.id === "prev") state.day--; else if (b.id === "next") state.day++; else return;
  render(); if (b.dataset.day !== undefined || b.id === "prev" || b.id === "next") document.getElementById("panel").scrollIntoView({block:"start", behavior:"smooth"});
});
window.addEventListener("hashchange", () => { readHash(); render(); });
readHash(); render();
</script>
