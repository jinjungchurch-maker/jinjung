<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>낮은 문으로 들어오는 은혜</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@500;700&display=swap">
<style>
  :root {
    --bg: #f9f7f2; --paper: #ffffff; --ink: #1e2a2b; --muted: #66716f; --line: #e4dfd4; --soft: #f1ede4;
    --a-adult: #2f6b6f; --a-youth: #4b5ea8; --a-kids: #c9612e;
    --a-adult-soft: #e6f0f0; --a-youth-soft: #e9ecf8; --a-kids-soft: #fbeae0;
    --sans: 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    --serif: 'Noto Serif KR', 'Apple Myungjo', 'Batang', serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #15191a; --paper: #1d2324; --ink: #ece7dc; --muted: #9aa5a3; --line: #2f3739; --soft: #242c2d;
      --a-adult: #7fc2c5; --a-youth: #a4b0ee; --a-kids: #f0a074;
      --a-adult-soft: #1f2f30; --a-youth-soft: #23283b; --a-kids-soft: #362820;
    }
  }
  :root[data-theme="dark"] {
    --bg: #15191a; --paper: #1d2324; --ink: #ece7dc; --muted: #9aa5a3; --line: #2f3739; --soft: #242c2d;
    --a-adult: #7fc2c5; --a-youth: #a4b0ee; --a-kids: #f0a074;
    --a-adult-soft: #1f2f30; --a-youth-soft: #23283b; --a-kids-soft: #362820;
  }
  html, body { background: var(--bg); color: var(--ink); }
  body { margin: 0; font-family: var(--sans); font-size: 16px; line-height: 1.75; -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 720px; margin: 0 auto; padding-block: 0 64px; padding-inline: 18px; }
  .top { padding-block: 26px 14px; display: flex; flex-direction: column; gap: 6px; }
  .top .eyebrow { font-size: 12px; letter-spacing: .12em; color: var(--muted); font-weight: 500; }
  .top h1 { font-family: var(--serif); font-size: 24px; font-weight: 700; margin: 0; line-height: 1.3; text-wrap: balance; }
  .top .sermon { font-size: 14px; color: var(--muted); }
  .top .sermon b { color: var(--ink); font-weight: 500; }

  .sticky { position: sticky; top: env(safe-area-inset-top, 0px); background: var(--bg); z-index: 5; padding-block: 10px 12px; display: flex; flex-direction: column; gap: 10px; border-bottom: 1px solid var(--line); }
  .seg { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0; border: 1.5px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--paper); }
  .seg button { appearance: none; border: 0; background: transparent; color: var(--muted); font: inherit; font-size: 15px; font-weight: 500; min-height: 44px; cursor: pointer; }
  .seg button + button { border-left: 1.5px solid var(--line); }
  .seg button[aria-selected="true"] { color: #fff; background: var(--accent); }
  .seg button:focus-visible { outline: 2px solid var(--accent); outline-offset: -3px; }
  .days { display: flex; gap: 8px; }
  .days button { appearance: none; flex: 1; border: 1.5px solid var(--line); background: var(--paper); color: var(--muted); border-radius: 10px; min-height: 44px; font: inherit; font-size: 14px; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.2; gap: 2px; padding: 4px 6px; }
  .days button small { font-size: 11px; opacity: .8; }
  .days button[aria-selected="true"] { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); font-weight: 700; }
  .days button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .panel { display: flex; flex-direction: column; gap: 22px; padding-block: 26px 0; }
  .head { display: flex; flex-direction: column; gap: 8px; }
  .head .ref { display: inline-flex; align-self: flex-start; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; color: var(--accent); background: var(--accent-soft); padding: 4px 12px; border-radius: 999px; }
  .head h2 { font-family: var(--serif); font-size: 28px; line-height: 1.25; margin: 0; font-weight: 700; text-wrap: balance; }
  .head .lead { font-size: 15px; color: var(--muted); }

  .scripture { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 20px 22px; font-family: var(--serif); font-size: 17px; line-height: 1.95; }
  .scripture p { margin: 0; }
  .scripture .v { font-family: var(--sans); font-size: 11px; font-weight: 700; color: var(--accent); vertical-align: super; margin-right: 3px; }
  .scripture .src { display: block; margin-top: 12px; font-family: var(--sans); font-size: 12px; color: var(--muted); text-align: right; }
  .ask2 { display: flex; flex-wrap: wrap; gap: 4px 16px; padding: 0 4px; font-size: 14.5px; line-height: 1.6; color: var(--muted); }
  .ask2 .lbl { width: 100%; font-size: 12px; font-weight: 700; color: var(--accent); letter-spacing: .06em; }
  .ask2 .q::before { content: "○ "; color: var(--accent); }
  .retell { background: var(--accent-soft); border-radius: 14px; padding: 18px 20px; font-size: 16px; }
  .retell .lbl { font-size: 12px; font-weight: 700; color: var(--accent); letter-spacing: .08em; display: block; margin-bottom: 6px; }
  .retell p { margin: 0 0 8px; } .retell p:last-child { margin-bottom: 0; }

  .sec { display: grid; grid-template-columns: 84px minmax(0, 1fr); gap: 14px; padding-block: 18px; border-top: 1px solid var(--line); }
  .sec .lbl { font-size: 13px; font-weight: 700; color: var(--accent); letter-spacing: .06em; padding-top: 3px; }
  .sec .body { display: flex; flex-direction: column; gap: 10px; }
  .sec p { margin: 0; }
  .sec .k { font-weight: 700; color: var(--accent); margin-right: 6px; }
  .qs { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px; }
  .qs li { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 6px; }
  .qs li .n { width: 24px; height: 24px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); font-size: 12px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; margin-top: 4px; }
  .fill { border-bottom: 1.5px dashed var(--line); min-height: 34px; }
  .apply { background: var(--soft); border-radius: 12px; padding: 14px 16px; }
  .prayer { font-family: var(--serif); font-size: 16.5px; line-height: 1.9; }
  .prayer .blank { display: inline-block; min-width: 140px; border-bottom: 1.5px solid var(--line); }
  .nav { display: flex; justify-content: space-between; gap: 12px; padding-top: 10px; }
  .nav button { appearance: none; border: 1.5px solid var(--line); background: var(--paper); color: var(--ink); border-radius: 999px; min-height: 44px; padding: 0 18px; font: inherit; font-size: 14px; cursor: pointer; }
  .nav button:disabled { opacity: .35; cursor: default; }
  .foot { margin-top: 40px; font-size: 12px; color: var(--muted); text-align: center; line-height: 1.6; }
  @media (max-width: 480px) {
    .sec { grid-template-columns: 1fr; gap: 6px; }
    .head h2 { font-size: 24px; }
    .scripture { padding: 16px 18px; font-size: 16px; }
  }
  @media (prefers-reduced-motion: no-preference) { .panel { animation: in .25s ease; } @keyframes in { from { opacity: .4; transform: translateY(4px); } to { opacity: 1; transform: none; } } }
</style>
</head>
<body>

<div class="wrap" id="app">
  <header class="top">
    <div class="eyebrow" id="eyebrow"></div>
    <h1 id="setTitle"></h1>
    <div class="sermon" id="sermonLine"></div>
  </header>
  <div class="sticky">
    <div class="seg" role="tablist" aria-label="대상" id="ageTabs"></div>
    <div class="days" role="tablist" aria-label="날" id="dayTabs"></div>
  </div>
  <main class="panel" id="panel"></main>
  <footer class="foot" id="foot"></footer>
</div>

<script>
const DATA = {"set_title": "낮은 문으로 들어오는 은혜", "eyebrow": "이번 주 QT · 10월 넷째 주", "sermon": {"title": "겸손한 자에게 은혜를 주신다", "ref": "야고보서 4:6", "date": "2026. 10. 25"}, "footer": "성경전서 개역개정판 © 대한성서공회 · 진중교회", "days": [{"day_label": "월요일", "ref": "잠 3:31-35", "passage": {"ref": "잠 3:31-35", "label": "잠언 3:31–35", "source": "개역개정", "verses": [{"v": 31, "text": "포학한 자를 부러워하지 말며 그의 어떤 행위도 따르지 말라"}, {"v": 32, "text": "대저 패역한 자는 여호와께서 미워하시나 정직한 자에게는 그의 교통하심이 있으며"}, {"v": 33, "text": "악인의 집에는 여호와의 저주가 있거니와 의인의 집에는 복이 있느니라"}, {"v": 34, "text": "진실로 그는 거만한 자를 비웃으시며 겸손한 자에게 은혜를 베푸시나니"}, {"v": 35, "text": "지혜로운 자는 영광을 기업으로 받거니와 미련한 자의 영달함은 수치가 되느니라"}]}, "adult": {"title": "거만한 자를 비웃으시며", "lead": "야고보가 인용한 말씀의 뿌리는 잠언 3장입니다. 하나님은 거만한 자와 겸손한 자를 다르게 대하십니다.", "explain": [{"k": "앞 단락(27–30절)", "t": "잠언 3장은 아버지가 아들에게 주는 가르침입니다. 27절부터 이웃을 대하는 법이 이어집니다. 줄 것이 있으면 내일로 미루지 말라고 합니다. 곁에 사는 이웃을 해치려 꾀하지 말라고 합니다. 까닭 없이 사람과 다투지 말라고 합니다. 31절은 그 흐름 끝에 놓였습니다. 「포학한 자를 부러워하지 말며」. 힘으로 남을 누르는 사람이 잘되어 보일 때가 있습니다. 아버지는 아들에게 그 사람을 부러워하지 말라고 가르칩니다."}, {"k": "32–33절", "t": "까닭이 이어서 나옵니다. 여호와께서 패역한 자를 미워하십니다. 정직한 자에게는 「그의 교통하심」이 있습니다. 하나님이 정직한 사람과 마음을 터놓고 가까이 지내신다는 뜻입니다. 악인의 집에는 저주가 있고 의인의 집에는 복이 있습니다. 잠언은 겉으로 드러난 성공으로 사람을 재지 않습니다. 하나님과 어떤 사이로 사는지로 잽니다."}, {"k": "34절", "t": "「그는 거만한 자를 비웃으시며 겸손한 자에게 은혜를 베푸시나니」. 「비웃다(יָלִיץ)」는 거만한 자를 가리키는 낱말과 뿌리가 같습니다. 남을 비웃던 사람을 하나님이 비웃으십니다. 「겸손한 자(עֲנָוִים)」는 가난하고 낮은 사람을 가리킬 때도 쓰는 말입니다. 하나님 앞에 내세울 것이 없는 사람입니다. 야고보는 이 구절을 헬라어 성경에서 옮겨 「교만한 자를 물리치시고」라고 썼습니다(약 4:6)."}, {"k": "오늘 읽는 법", "t": "잠언은 두 길을 나란히 세워 보이는 지혜의 글입니다. 한 길을 고르라고 부르는 글이기도 합니다. 34절을 「겸손하면 상을 받는다」는 규칙으로 읽지 마십시오. 하나님은 스스로 높아진 사람을 그냥 두지 않으시고, 낮은 사람에게 먼저 다가오십니다. 오늘 내가 부러워하던 사람을 떠올리며 이 말씀을 읽으십시오."}], "questions": ["요즘 내가 부러워하는 사람은 누구입니까? 그 사람의 무엇을 부러워합니까?", "나는 어떤 일에서 남을 비웃거나 깔보았습니까? 그때 하나님은 나를 어떻게 보셨을까요?"], "apply": "오늘 대화하는 사람 가운데 한 사람의 말을 끝까지 듣습니다. 내 생각을 앞세우고 싶을 때 34절을 떠올립니다.", "prayer": "하나님, 저는 힘 있는 사람을 부러워하고 약한 사람을 깔볼 때가 많았습니다. 거만한 자를 비웃으시는 하나님 앞에서 제 마음을 돌아보게 하소서. 내세울 것 없는 저에게 먼저 은혜를 베푸시는 하나님을 바라보게 하소서. 예수님 이름으로 기도합니다. 아멘."}, "youth": {"title": "부러워하지 마", "lead": "잠언의 아버지는 아들에게 힘으로 누르는 사람을 부러워하지 말라고 가르칩니다.", "explain": [{"k": "", "t": "잠언 3장은 아버지가 아들에게 들려주는 말입니다. 아버지는 이웃을 해치지 말고 괜히 다투지 말라고 합니다. 그리고 「포학한 자를 부러워하지 말라」고 해요(31절). 포학한 자는 힘으로 남을 누르는 사람입니다. 그런 사람이 잘나가 보일 때가 있지요."}, {"k": "", "t": "아버지는 까닭을 말합니다. 하나님은 정직한 사람과 가까이 지내십니다(32절). 그리고 「거만한 자를 비웃으시며 겸손한 자에게 은혜를 베푸십니다」(34절). 남을 비웃던 사람을 하나님이 비웃으세요. 내세울 것 없는 낮은 사람에게는 하나님이 먼저 다가오십니다."}, {"k": "", "t": "주일 설교 본문 야고보서 4:6이 바로 이 구절을 옮겨 왔어요. 학교와 SNS에서는 센 사람, 잘난 사람이 주목받습니다. 하나님은 다른 기준으로 사람을 보십니다."}], "questions": ["학교나 SNS에서 내가 부러워하는 사람은 누구인가요? 왜 부러운가요?", "친구를 비웃거나 무시한 적이 있나요? 하나님은 그때 나를 어떻게 보셨을까요?"], "apply": "오늘 SNS를 보다가 누군가를 부러워하거나 비웃고 싶어지면 화면을 끄고 34절을 한 번 읽어요.", "prayer": "하나님, 잘나 보이는 사람을 부러워하고 약한 친구를 무시할 때가 있었어요. 낮은 사람에게 은혜를 주시는 하나님의 마음을 배우게 해 주세요. 예수님 이름으로 기도합니다. 아멘."}, "kids": {"title": "하나님은 낮은 사람을 도와요", "lead": "하나님은 잘난 척하는 사람이 아니라 낮은 사람에게 은혜를 주세요.", "retell": ["아빠가 아들에게 말했어요. “힘으로 친구를 괴롭히는 사람을 부러워하지 마. 그 사람이 하는 일을 따라 하지도 마. 그런 사람이 이기는 것처럼 보여도 하나님은 다르게 보셔.”", "아빠가 이유를 알려 주었어요. “하나님은 바르게 사는 사람과 친하게 지내셔. 하나님은 잘난 척하며 남을 비웃는 사람을 비웃으셔. 그리고 낮은 사람에게 은혜를 주신단다.” 아들은 아빠의 말을 마음에 담았어요."], "explain": [{"k": "찾아보세요", "t": "하나님은 누구에게 은혜를 베푸시나요? 34절에서 찾아 ○표를 해 보세요. 「부러워하지 말며」라는 말을 31절에서 찾아 밑줄을 그어 보세요."}, {"k": "생각해 보세요", "t": "친구들 가운데 혼자 제일 잘난 척하는 아이가 있으면 같이 놀고 싶지 않지요. 그런데 그 친구는 자기가 잘못한 줄 몰라요. 하나님은 잘난 척하는 사람을 막으시고 잘못을 알려 주세요."}, {"k": "한 가지 더", "t": "야고보 아저씨는 이 말씀을 편지에 옮겨 적었어요. 주일에 들은 말씀 「겸손한 자에게 은혜를 주신다」가 바로 오늘 읽은 잠언에서 왔어요."}], "questions": ["하나님은 거만한 자를 어떻게 하신다고 했나요? (34절에서 찾아보세요)", "내가 잘난 척한 적이 있나요? 그때 친구 마음은 어땠을까요?"], "apply": "오늘 친구가 말할 때 끝까지 들어 주어요.", "prayer": "하나님, 잘난 척하지 않고 친구를 아끼게 해 주세요. 저는 ___ 할 때 잘난 척하고 싶어요. 그때 하나님을 기억하게 해 주세요. 예수님 이름으로 기도합니다. 아멘."}}, {"day_label": "수요일", "ref": "빌 2:5-11", "passage": {"ref": "빌 2:5-11", "label": "빌립보서 2:5–11", "source": "개역개정", "verses": [{"v": 5, "text": "너희 안에 이 마음을 품으라 곧 그리스도 예수의 마음이니"}, {"v": 6, "text": "그는 근본 하나님의 본체시나 하나님과 동등됨을 취할 것으로 여기지 아니하시고"}, {"v": 7, "text": "오히려 자기를 비워 종의 형체를 가지사 사람들과 같이 되셨고"}, {"v": 8, "text": "사람의 모양으로 나타나사 자기를 낮추시고 죽기까지 복종하셨으니 곧 십자가에 죽으심이라"}, {"v": 9, "text": "이러므로 하나님이 그를 지극히 높여 모든 이름 위에 뛰어난 이름을 주사"}, {"v": 10, "text": "하늘에 있는 자들과 땅에 있는 자들과 땅 아래에 있는 자들로 모든 무릎을 예수의 이름에 꿇게 하시고"}, {"v": 11, "text": "모든 입으로 예수 그리스도를 주라 시인하여 하나님 아버지께 영광을 돌리게 하셨느니라"}]}, "adult": {"title": "자기를 낮추신 그리스도", "lead": "겸손을 가장 먼저 보여 주신 분은 예수님이십니다. 예수님은 하나님의 본체이시면서 자기를 낮추셨습니다.", "explain": [{"k": "앞 단락(1–4절)", "t": "바울은 감옥에서 빌립보 교회에 편지를 썼습니다. 빌립보 교회에는 다툼이 있었습니다(4:2). 바울은 다툼과 허영으로 하지 말라고 권합니다. 「겸손한 마음으로 각각 자기보다 남을 낫게 여기라」(3절). 그리고 5절에서 그 겸손의 근거를 보입니다. 「너희 안에 이 마음을 품으라 곧 그리스도 예수의 마음이니」. 겸손은 처세술이 아닙니다. 예수님의 마음입니다."}, {"k": "6–8절", "t": "예수님은 근본 하나님의 본체이십니다. 그런데 하나님과 동등됨을 붙들고 놓지 않을 것으로 여기지 않으셨습니다. 예수님은 「자기를 비워(ἐκένωσεν)」 종의 형체를 가지셨습니다. 그리고 「자기를 낮추시고(ἐταπείνωσεν)」 십자가에 죽기까지 복종하셨습니다. 「낮추다」는 야고보서 4:6의 「겸손한」과 뿌리가 같은 말입니다. 예수님이 겸손의 뜻을 몸으로 채우셨습니다."}, {"k": "9–11절", "t": "9절은 「이러므로」로 시작합니다. 하나님이 낮아지신 예수님을 지극히 높이셨습니다. 모든 무릎이 예수님의 이름 앞에 꿇고, 모든 입이 예수 그리스도를 주라 고백합니다. 예수님은 스스로 높아지지 않으셨습니다. 하나님이 높이셨습니다. 6–8절에서는 예수님이 움직이시고, 9–11절에서는 하나님이 움직이십니다."}, {"k": "오늘 읽는 법", "t": "많은 학자가 이 단락을 초대 교회의 찬송으로 봅니다. 찬송을 부르듯 소리 내어 고백하며 읽으십시오. 주일 설교는 은혜를 받은 사람이 겸손해진다고 했습니다. 예수님이 먼저 낮아지셔서 우리를 구원하셨습니다. 그 은혜를 입은 사람이 예수님의 마음을 품습니다. 오늘 내가 다투고 있는 사람을 떠올리며 3–5절을 다시 읽으십시오."}], "questions": ["내가 「동등됨을 취할 것으로」 붙들고 놓지 않는 권리나 체면은 무엇입니까?", "예수님이 나를 위해 낮아지셨다는 사실은 오늘 내가 만나는 사람을 대하는 태도를 어떻게 바꿉니까?"], "apply": "오늘 함께 일하거나 사는 사람 한 명을 나보다 낫게 여기고, 그 사람의 수고를 말로 인정합니다.", "prayer": "주 예수님, 하나님의 본체이시면서 저를 위해 종이 되시고 십자가에 죽기까지 낮아지셨습니다. 제 체면과 권리를 붙들고 다투던 마음을 내려놓게 하소서. 주님의 마음을 품고 이웃을 저보다 낫게 여기게 하소서. 예수님 이름으로 기도합니다. 아멘."}, "youth": {"title": "예수님의 마음을 품으라", "lead": "예수님은 하나님이시면서 종이 되셨습니다. 바울은 그 마음을 품으라고 말합니다.", "explain": [{"k": "", "t": "빌립보 교회 사람들은 서로 다투었어요. 바울은 「각각 자기보다 남을 낫게 여기라」고 했습니다(3절). 말은 쉽지만 하기는 어렵지요. 그래서 바울은 예수님을 보여 줍니다."}, {"k": "", "t": "예수님은 하나님과 같으신 분입니다. 그런데 그 자리를 꼭 붙들지 않으셨어요. 예수님은 종이 되어 사람으로 오셨습니다. 그리고 십자가에서 죽기까지 하나님께 순종하셨어요(6–8절). 높은 분이 스스로 가장 낮은 곳으로 내려오셨습니다."}, {"k": "", "t": "그다음에 하나님이 예수님을 가장 높이셨어요(9절). 예수님은 스스로 높아지려 하지 않으셨습니다. 우리는 인정받으려고 애씁니다. 예수님은 이미 우리를 위해 낮아지셨어요. 그 사랑을 아는 사람은 친구 앞에서 이기려고만 하지 않습니다."}], "questions": ["친구나 가족과 다툴 때 내가 끝까지 지키려는 것은 무엇인가요?", "예수님이 나를 위해 낮아지셨다는 사실을 알면, 오늘 누구를 다르게 대할 수 있을까요?"], "apply": "오늘 다툰 사람이나 서운한 사람에게 먼저 짧은 메시지를 보내요.", "prayer": "예수님, 저를 위해 낮아지셔서 감사해요. 친구 앞에서 이기려고만 하지 않고 예수님의 마음을 품게 해 주세요. 예수님 이름으로 기도합니다. 아멘."}, "kids": {"title": "낮아지신 예수님", "lead": "예수님은 하나님이신데 우리를 위해 낮아지셨어요.", "retell": ["예수님은 원래 하나님이세요. 하늘에서 가장 높은 분이세요. 그런데 예수님은 그 높은 곳에만 계시지 않았어요. 예수님은 사람이 되어 이 땅에 오셨어요. 섬기는 종이 되셨어요.", "예수님은 하나님 말씀에 끝까지 순종하셨어요. 십자가에서 돌아가시기까지 순종하셨어요. 그래서 하나님이 예수님을 가장 높이셨어요. 모든 사람이 예수님 앞에 무릎을 꿇고 “예수님은 주님이세요” 하고 고백해요."], "explain": [{"k": "찾아보세요", "t": "예수님은 무엇의 형체를 가지셨나요? 7절에서 찾아 ○표를 해 보세요. 「자기를 낮추시고」라는 말을 8절에서 찾아 밑줄을 그어 보세요."}, {"k": "생각해 보세요", "t": "베들레헴 교회의 문은 아주 낮아요. 어른도 허리를 굽혀야 들어가요. 예수님은 그 베들레헴에서 아기로 태어나셨어요. 하늘에서 가장 높은 분이 가장 낮은 곳으로 오셨어요."}, {"k": "한 가지 더", "t": "예수님이 먼저 우리를 위해 낮아지셨어요. 예수님의 사랑을 받은 우리도 친구를 섬길 수 있어요."}], "questions": ["하나님이 예수님을 어떻게 하셨나요? (9절에서 찾아보세요)", "예수님처럼 친구를 섬기려면 오늘 무엇을 할 수 있을까요?"], "apply": "오늘 친구나 동생에게 먼저 양보해요.", "prayer": "예수님, 저를 위해 낮아지셔서 고마워요. 저도 ___ 에게 먼저 양보하고 섬기게 해 주세요. 예수님 이름으로 기도합니다. 아멘."}}, {"day_label": "금요일", "ref": "딤전 1:12-16", "passage": {"ref": "딤전 1:12-16", "label": "디모데전서 1:12–16", "source": "개역개정", "verses": [{"v": 12, "text": "나를 능하게 하신 그리스도 예수 우리 주께 내가 감사함은 나를 충성되이 여겨 내게 직분을 맡기심이니"}, {"v": 13, "text": "내가 전에는 비방자요 박해자요 폭행자였으나 도리어 긍휼을 입은 것은 내가 믿지 아니할 때에 알지 못하고 행하였음이라"}, {"v": 14, "text": "우리 주의 은혜가 그리스도 예수 안에 있는 믿음과 사랑과 함께 넘치도록 풍성하였도다"}, {"v": 15, "text": "미쁘다 모든 사람이 받을 만한 이 말이여 그리스도 예수께서 죄인을 구원하시려고 세상에 임하셨다 하였도다 죄인 중에 내가 괴수니라"}, {"v": 16, "text": "그러나 내가 긍휼을 입은 까닭은 예수 그리스도께서 내게 먼저 일체 오래 참으심을 보이사 후에 주를 믿어 영생 얻는 자들에게 본이 되게 하려 하심이라"}]}, "adult": {"title": "죄인 중에 내가 괴수니라", "lead": "바울은 자기 공로를 자랑하지 않았습니다. 자기 같은 사람을 찾아오신 그리스도의 은혜를 자랑했습니다.", "explain": [{"k": "12–13절", "t": "바울은 나이 든 사도로서 젊은 디모데에게 편지를 씁니다. 바울은 먼저 감사합니다. 그리스도 예수께서 자기에게 직분을 맡기셨기 때문입니다. 그리고 지난날을 숨기지 않습니다. 「내가 전에는 비방자요 박해자요 폭행자였으나」. 바울은 스데반이 죽을 때 그 일에 동의했습니다(행 8:1). 바울은 자기가 옳다고 확신하며 성도들을 잡아 가두었습니다."}, {"k": "13–14절", "t": "그런 바울이 「긍휼을 입었습니다(ἠλεήθην)」. 수동형입니다. 바울이 긍휼을 얻어 낸 것이 아닙니다. 주님이 바울에게 긍휼을 베푸셨습니다. 14절은 그 은혜를 이렇게 말합니다. 「넘치도록 풍성하였도다(ὑπερεπλεόνασεν)」. 바울의 죄가 컸지만 주님의 은혜는 그 죄보다 더 넘쳤습니다. 야고보서 4:6의 「더욱 큰 은혜」와 같은 고백입니다."}, {"k": "15–16절", "t": "「그리스도 예수께서 죄인을 구원하시려고 세상에 임하셨다」. 바울은 이 말을 「미쁘다」고 합니다. 믿을 만하다는 뜻입니다. 그리고 덧붙입니다. 「죄인 중에 내가 괴수니라」. 「괴수였다」가 아니라 「괴수다」라고 지금 시제로 말합니다. 16절에서 바울은 자신이 긍휼을 입은 까닭을 밝힙니다. 그리스도께서 오래 참으심을 바울에게 먼저 보이셨습니다. 뒤에 믿을 사람들에게 본이 되게 하시려는 뜻이었습니다."}, {"k": "오늘 읽는 법", "t": "이 편지는 바울의 간증입니다. 바울이 스스로 노력해서 겸손해지지 않았습니다. 다메섹 길에서 주님을 만난 뒤 바울은 자기 확신이 무너지는 일을 겪었습니다. 은혜를 입은 사람이 겸손해졌습니다. 오늘 하나님 앞에서 나의 지난날을 떠올리며 15절을 소리 내어 읽으십시오."}], "questions": ["나는 하나님 앞에서 어떤 사람이었습니까? 내가 숨기고 싶은 지난날은 무엇입니까?", "나는 내 신앙에서 무엇을 자랑해 왔습니까? 오늘 내가 자랑할 그리스도의 은혜는 무엇입니까?"], "apply": "오늘 나를 구원하신 그리스도의 은혜를 가족이나 동료 한 사람에게 한 문장으로 들려줍니다.", "prayer": "주님, 저는 비방하고 고집하던 죄인이었습니다. 그런 저에게 오래 참으시고 긍휼을 베푸셨습니다. 제 공로를 자랑하지 않고 저를 구원하신 예수 그리스도의 은혜를 자랑하게 하소서. 예수님 이름으로 기도합니다. 아멘."}, "youth": {"title": "바울이 자랑한 것", "lead": "교회를 박해하던 바울은 자신을 「죄인 중의 괴수」라고 불렀습니다.", "explain": [{"k": "", "t": "바울은 원래 예수님을 믿는 사람들을 잡아 가두던 사람이었어요. 자기가 옳다고 굳게 믿었습니다. 그런데 다메섹으로 가던 길에서 부활하신 예수님을 만났어요. 그날 바울의 확신이 무너졌습니다."}, {"k": "", "t": "바울은 디모데에게 이렇게 씁니다. 「내가 전에는 비방자요 박해자요 폭행자였으나 도리어 긍휼을 입었다」(13절). 바울이 잘해서 용서받은 게 아니에요. 예수님이 먼저 찾아와 긍휼을 베푸셨습니다. 바울은 그 은혜가 「넘치도록 풍성하였다」고 말해요(14절)."}, {"k": "", "t": "바울은 자신을 「죄인 중에 괴수」라고 불렀습니다(15절). 예수님을 믿은 지 오래 지난 뒤에도 그렇게 고백했어요. 바울은 자기 실력을 자랑하지 않았어요. 자기 같은 사람도 구원하신 예수님을 자랑했습니다."}], "questions": ["나는 친구들 앞에서 주로 무엇을 자랑하고 싶나요?", "예수님이 나를 찾아와 주신 일 가운데 고마운 일 하나를 꼽는다면 무엇인가요?"], "apply": "오늘 잠들기 전에 15절을 한 번 소리 내어 읽고, 고마운 은혜 하나를 적어요.", "prayer": "예수님, 바울처럼 저도 은혜가 필요한 사람이에요. 제 실력보다 저를 구원하신 예수님을 자랑하게 해 주세요. 예수님 이름으로 기도합니다. 아멘."}, "kids": {"title": "바울 아저씨가 달라졌어요", "lead": "예수님이 바울 아저씨를 찾아오셔서 바울 아저씨가 달라졌어요.", "retell": ["바울 아저씨는 예수님을 믿는 사람들을 미워했어요. 예수님을 믿는 사람들을 괴롭히고 잡아 가두었어요. 바울 아저씨는 자기가 옳다고 생각했어요.", "그런데 예수님이 바울 아저씨를 찾아오셨어요. 바울 아저씨는 자기가 틀렸다는 것을 알았어요. 예수님은 바울 아저씨를 용서하시고 예수님의 일을 맡기셨어요. 바울 아저씨는 “나는 죄인 중에 가장 나쁜 사람이었어요. 그래도 예수님이 나를 구원하셨어요.” 하고 말했어요."], "explain": [{"k": "찾아보세요", "t": "예수님은 무엇을 하시려고 세상에 오셨나요? 15절에서 찾아 밑줄을 그어 보세요. 「은혜」라는 낱말을 14절에서 찾아 ○표를 해 보세요."}, {"k": "생각해 보세요", "t": "바울 아저씨는 착한 일을 많이 해서 용서받지 않았어요. 예수님이 먼저 찾아오셔서 용서해 주셨어요. 은혜는 하나님이 거저 주시는 선물이에요."}, {"k": "한 가지 더", "t": "바울 아저씨는 자기를 자랑하지 않았어요. 자기를 용서해 주신 예수님을 자랑했어요. 우리도 예수님이 우리에게 해 주신 일을 자랑할 수 있어요."}], "questions": ["바울 아저씨는 자신을 무엇이라고 불렀나요? (15절에서 찾아보세요)", "예수님께 고마운 일 하나를 말해 볼까요?"], "apply": "오늘 가족에게 “예수님이 나를 사랑하셔요.” 하고 말해요.", "prayer": "예수님, 저를 찾아와 용서해 주셔서 고마워요. 저는 ___ 일이 잘못이었어요. 저를 사랑하시는 예수님을 자랑하게 해 주세요. 예수님 이름으로 기도합니다. 아멘."}}]};
const AGES = [["adult","청장년"],["youth","청소년"],["kids","어린이"]];
const state = { age: "adult", day: 0 };
const esc = s => String(s ?? "").replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const rich = s => esc(s).replace(/&lt;b&gt;/g,"<b>").replace(/&lt;\/b&gt;/g,"</b>");

function readHash(){
  const m = location.hash.match(/^#(adult|youth|kids)-(\d)$/);
  if (m) { state.age = m[1]; state.day = Math.min(DATA.days.length-1, Math.max(0, +m[2]-1)); return; }
  try { const s = JSON.parse(localStorage.getItem("qt-set-last")||"null"); if (s && AGES.some(a=>a[0]===s.age)) { state.age = s.age; state.day = Math.min(DATA.days.length-1, s.day|0); } } catch(e){}
}
function remember(){ try { localStorage.setItem("qt-set-last", JSON.stringify(state)); } catch(e){} history.replaceState(null,"",`#${state.age}-${state.day+1}`); }
function setAccent(){
  const r = document.documentElement.style;
  r.setProperty("--accent", `var(--a-${state.age})`); r.setProperty("--accent-soft", `var(--a-${state.age}-soft)`);
}
function renderTabs(){
  document.getElementById("ageTabs").innerHTML = AGES.map(([k,l]) => `<button role="tab" id="age-${k}" aria-selected="${state.age===k}" data-age="${k}">${l}</button>`).join("");
  document.getElementById("dayTabs").innerHTML = DATA.days.map((d,i) => `<button role="tab" id="day-${i}" aria-selected="${state.day===i}" data-day="${i}"><span>${esc(d.day_label)}</span><small>${esc(d.ref)}</small></button>`).join("");
}
function section(lbl, inner){ return `<section class="sec"><div class="lbl">${lbl}</div><div class="body">${inner}</div></section>`; }
function renderPanel(){
  const d = DATA.days[state.day]; const c = d[state.age];
  const verses = d.passage.verses.map(v => `<span class="v">${v.v}</span>${esc(v.text)} `).join("");
  let html = `<div class="head"><span class="ref">${esc(d.passage.label)}</span><h2>${esc(c.title)}</h2>${c.lead ? `<div class="lead">${rich(c.lead)}</div>` : ""}</div>`;
  html += `<div class="scripture"><p>${verses}</p><span class="src">${esc(d.passage.source)}</span></div>`;
  // 매일성경처럼 본문을 읽으며 붙드는 두 질문 — 매주 같다(2026-10-24 사용자 요청). 어린이는 쉬운 말로
  const ASK2 = state.age === "kids" ? ["하나님은 어떤 분이세요?", "나에게 무엇을 가르쳐 주세요?"] : ["하나님은 어떤 분이신가?", "나(우리)에게 주시는 교훈은 무엇인가?"];
  html += `<div class="ask2"><span class="lbl">본문을 읽으며</span>${ASK2.map(q=>`<span class="q">${q}</span>`).join("")}</div>`;
  if (c.retell && c.retell.length) html += `<div class="retell"><span class="lbl">쉽게 읽기</span>${c.retell.map(p=>`<p>${rich(p)}</p>`).join("")}</div>`;
  html += section("설명", c.explain.map(p => `<p>${p.k ? `<span class="k">${esc(p.k)}</span>` : ""}${rich(p.t)}</p>`).join(""));
  html += section("묵상 질문", `<ol class="qs">${c.questions.map((q,i)=>`<li><span class="n">${i+1}</span><div>${rich(q)}<div class="fill"></div></div></li>`).join("")}</ol>`);
  html += section("적용", `<div class="apply">${rich(c.apply)}</div>`);
  html += section("기도", `<div class="prayer">${rich(c.prayer).replace(/___+/g,'<span class="blank"></span>')}</div>`);
  const last = state.day === DATA.days.length-1;
  html += `<div class="nav"><button id="prev" ${state.day===0?"disabled":""}>← 이전</button><button id="next" ${last?"disabled":""}>다음 →</button></div>`;
  document.getElementById("panel").innerHTML = html;
}
function render(){ setAccent(); renderTabs(); renderPanel(); remember(); document.title = `${DATA.set_title} · ${AGES.find(a=>a[0]===state.age)[1]}`; }
document.getElementById("eyebrow").textContent = DATA.eyebrow || "";
document.getElementById("setTitle").textContent = DATA.set_title;
document.getElementById("sermonLine").innerHTML = DATA.sermon ? `이번 주 설교 <b>${esc(DATA.sermon.title)}</b> · ${esc(DATA.sermon.ref)}${DATA.sermon.date ? ` · ${esc(DATA.sermon.date)}` : ""}` : "";
document.getElementById("foot").innerHTML = rich(DATA.footer || "");
document.getElementById("app").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.age) state.age = b.dataset.age;
  else if (b.dataset.day) state.day = +b.dataset.day;
  else if (b.id === "prev") state.day--; else if (b.id === "next") state.day++; else return;
  render(); if (b.dataset.day !== undefined || b.id === "prev" || b.id === "next") document.getElementById("panel").scrollIntoView({block:"start", behavior:"smooth"});
});
window.addEventListener("hashchange", () => { readHash(); render(); });
readHash(); render();
</script>
