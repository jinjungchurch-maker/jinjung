<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>절망을 뒤집으시는 하나님</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@500;700&display=swap">
<style>
  :root {
    --bg: #f9f7f2; --paper: #ffffff; --ink: #1e2a2b; --muted: #66716f; --line: #e4dfd4; --soft: #f1ede4;
    --a-adult: #2f6b6f; --a-youth: #4b5ea8; --a-kids: #c9612e;
    --a-adult-soft: #e6f0f0; --a-youth-soft: #e9ecf8; --a-kids-soft: #fbeae0;
    --sans: 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    --serif: 'Noto Serif KR', 'Apple Myungjo', 'Batang', serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #15191a; --paper: #1d2324; --ink: #ece7dc; --muted: #9aa5a3; --line: #2f3739; --soft: #242c2d;
      --a-adult: #7fc2c5; --a-youth: #a4b0ee; --a-kids: #f0a074;
      --a-adult-soft: #1f2f30; --a-youth-soft: #23283b; --a-kids-soft: #362820;
    }
  }
  :root[data-theme="dark"] {
    --bg: #15191a; --paper: #1d2324; --ink: #ece7dc; --muted: #9aa5a3; --line: #2f3739; --soft: #242c2d;
    --a-adult: #7fc2c5; --a-youth: #a4b0ee; --a-kids: #f0a074;
    --a-adult-soft: #1f2f30; --a-youth-soft: #23283b; --a-kids-soft: #362820;
  }
  html, body { background: var(--bg); color: var(--ink); }
  body { margin: 0; font-family: var(--sans); font-size: 16px; line-height: 1.75; -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 720px; margin: 0 auto; padding-block: 0 64px; padding-inline: 18px; }
  .top { padding-block: 26px 14px; display: flex; flex-direction: column; gap: 6px; }
  .top .eyebrow { font-size: 12px; letter-spacing: .12em; color: var(--muted); font-weight: 500; }
  .top h1 { font-family: var(--serif); font-size: 24px; font-weight: 700; margin: 0; line-height: 1.3; text-wrap: balance; }
  .top .sermon { font-size: 14px; color: var(--muted); }
  .top .sermon b { color: var(--ink); font-weight: 500; }

  .sticky { position: sticky; top: env(safe-area-inset-top, 0px); background: var(--bg); z-index: 5; padding-block: 10px 12px; display: flex; flex-direction: column; gap: 10px; border-bottom: 1px solid var(--line); }
  .seg { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0; border: 1.5px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--paper); }
  .seg button { appearance: none; border: 0; background: transparent; color: var(--muted); font: inherit; font-size: 15px; font-weight: 500; min-height: 44px; cursor: pointer; }
  .seg button + button { border-left: 1.5px solid var(--line); }
  .seg button[aria-selected="true"] { color: #fff; background: var(--accent); }
  .seg button:focus-visible { outline: 2px solid var(--accent); outline-offset: -3px; }
  .days { display: flex; gap: 8px; }
  .days button { appearance: none; flex: 1; border: 1.5px solid var(--line); background: var(--paper); color: var(--muted); border-radius: 10px; min-height: 44px; font: inherit; font-size: 14px; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.2; gap: 2px; padding: 4px 6px; }
  .days button small { font-size: 11px; opacity: .8; }
  .days button[aria-selected="true"] { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); font-weight: 700; }
  .days button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .panel { display: flex; flex-direction: column; gap: 22px; padding-block: 26px 0; }
  .head { display: flex; flex-direction: column; gap: 8px; }
  .head .ref { display: inline-flex; align-self: flex-start; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; color: var(--accent); background: var(--accent-soft); padding: 4px 12px; border-radius: 999px; }
  .head h2 { font-family: var(--serif); font-size: 28px; line-height: 1.25; margin: 0; font-weight: 700; text-wrap: balance; }
  .head .lead { font-size: 15px; color: var(--muted); }

  .scripture { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 20px 22px; font-family: var(--serif); font-size: 17px; line-height: 1.95; }
  .scripture p { margin: 0; }
  .scripture .v { font-family: var(--sans); font-size: 11px; font-weight: 700; color: var(--accent); vertical-align: super; margin-right: 3px; }
  .scripture .src { display: block; margin-top: 12px; font-family: var(--sans); font-size: 12px; color: var(--muted); text-align: right; }
  .ask2 { display: flex; flex-wrap: wrap; gap: 4px 16px; padding: 0 4px; font-size: 14.5px; line-height: 1.6; color: var(--muted); }
  .ask2 .lbl { width: 100%; font-size: 12px; font-weight: 700; color: var(--accent); letter-spacing: .06em; }
  .ask2 .q::before { content: "○ "; color: var(--accent); }
  .retell { background: var(--accent-soft); border-radius: 14px; padding: 18px 20px; font-size: 16px; }
  .retell .lbl { font-size: 12px; font-weight: 700; color: var(--accent); letter-spacing: .08em; display: block; margin-bottom: 6px; }
  .retell p { margin: 0 0 8px; } .retell p:last-child { margin-bottom: 0; }

  .sec { display: grid; grid-template-columns: 84px minmax(0, 1fr); gap: 14px; padding-block: 18px; border-top: 1px solid var(--line); }
  .sec .lbl { font-size: 13px; font-weight: 700; color: var(--accent); letter-spacing: .06em; padding-top: 3px; }
  .sec .body { display: flex; flex-direction: column; gap: 10px; }
  .sec p { margin: 0; }
  .sec .k { font-weight: 700; color: var(--accent); margin-right: 6px; }
  .qs { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px; }
  .qs li { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 6px; }
  .qs li .n { width: 24px; height: 24px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); font-size: 12px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; margin-top: 4px; }
  .fill { border-bottom: 1.5px dashed var(--line); min-height: 34px; }
  .apply { background: var(--soft); border-radius: 12px; padding: 14px 16px; }
  .prayer { font-family: var(--serif); font-size: 16.5px; line-height: 1.9; }
  .prayer .blank { display: inline-block; min-width: 140px; border-bottom: 1.5px solid var(--line); }
  .nav { display: flex; justify-content: space-between; gap: 12px; padding-top: 10px; }
  .nav button { appearance: none; border: 1.5px solid var(--line); background: var(--paper); color: var(--ink); border-radius: 999px; min-height: 44px; padding: 0 18px; font: inherit; font-size: 14px; cursor: pointer; }
  .nav button:disabled { opacity: .35; cursor: default; }
  .foot { margin-top: 40px; font-size: 12px; color: var(--muted); text-align: center; line-height: 1.6; }
  @media (max-width: 480px) {
    .sec { grid-template-columns: 1fr; gap: 6px; }
    .head h2 { font-size: 24px; }
    .scripture { padding: 16px 18px; font-size: 16px; }
  }
  @media (prefers-reduced-motion: no-preference) { .panel { animation: in .25s ease; } @keyframes in { from { opacity: .4; transform: translateY(4px); } to { opacity: 1; transform: none; } } }
</style>
</head>
<body>

<div class="wrap" id="app">
  <header class="top">
    <div class="eyebrow" id="eyebrow"></div>
    <h1 id="setTitle"></h1>
    <div class="sermon" id="sermonLine"></div>
  </header>
  <div class="sticky">
    <div class="seg" role="tablist" aria-label="대상" id="ageTabs"></div>
    <div class="days" role="tablist" aria-label="날" id="dayTabs"></div>
  </div>
  <main class="panel" id="panel"></main>
  <footer class="foot" id="foot"></footer>
</div>

<script>
const DATA = {"set_title": "절망을 뒤집으시는 하나님", "eyebrow": "이번 주 QT · 11월 첫째 주", "sermon": {"title": "인생을 바꾸는 위대한 반전, ‘그러나 하나님이’", "ref": "에베소서 2:1-10", "date": "2026. 11. 1"}, "footer": "성경전서 개역개정판 © 대한성서공회 · 진중교회", "days": [{"day_label": "월요일", "ref": "겔 37:4-10", "passage": {"ref": "겔 37:4-10", "label": "에스겔 37:4–10", "source": "개역개정", "verses": [{"v": 4, "text": "또 내게 이르시되 너는 이 모든 뼈에게 대언하여 이르기를 너희 마른 뼈들아 여호와의 말씀을 들을지어다"}, {"v": 5, "text": "주 여호와께서 이 뼈들에게 이같이 말씀하시기를 내가 생기를 너희에게 들어가게 하리니 너희가 살아나리라"}, {"v": 6, "text": "너희 위에 힘줄을 두고 살을 입히고 가죽으로 덮고 너희 속에 생기를 넣으리니 너희가 살아나리라 또 내가 여호와인 줄 너희가 알리라 하셨다 하라"}, {"v": 7, "text": "이에 내가 명령을 따라 대언하니 대언할 때에 소리가 나고 움직이며 이 뼈, 저 뼈가 들어 맞아 뼈들이 서로 연결되더라"}, {"v": 8, "text": "내가 또 보니 그 뼈에 힘줄이 생기고 살이 오르며 그 위에 가죽이 덮이나 그 속에 생기는 없더라"}, {"v": 9, "text": "또 내게 이르시되 인자야 너는 생기를 향하여 대언하라 생기에게 대언하여 이르기를 주 여호와께서 이같이 말씀하시기를 생기야 사방에서부터 와서 이 죽음을 당한 자에게 불어서 살아나게 하라 하셨다 하라"}, {"v": 10, "text": "이에 내가 그 명령대로 대언하였더니 생기가 그들에게 들어가매 그들이 곧 살아나서 일어나 서는데 극히 큰 군대더라"}]}, "adult": {"title": "마른 뼈들아, 들을지어다", "lead": "에스겔 37장은 마른 뼈 환상으로 죽은 것을 살리시는 하나님을 보여 줍니다.", "explain": [{"k": "배경(1–3절)", "t": "에스겔은 바벨론에 끌려간 포로였습니다. 주전 586년에 예루살렘이 무너졌고 성전도 불탔습니다. 포로들은 「우리의 뼈들이 말랐고 우리의 소망이 없어졌다」고 탄식했습니다(11절). 여호와께서 에스겔을 마른 뼈가 가득한 골짜기로 데려가셨습니다. 하나님이 물으셨습니다. 「이 뼈들이 능히 살 수 있겠느냐」. 에스겔은 「주께서 아시나이다」라고 답했습니다."}, {"k": "4–8절", "t": "하나님은 에스겔에게 뼈들을 향해 말씀을 전하라고 명하셨습니다. 에스겔이 명령대로 전하자 소리가 나고 뼈들이 서로 들어맞았습니다. 힘줄이 생기고 살이 오르고 가죽이 덮였습니다. 그런데 「그 속에 생기는 없더라」(8절). 몸이 다 갖춰져도 생기가 없으면 시체입니다."}, {"k": "9–10절", "t": "하나님이 다시 명하셨습니다. 「생기야 사방에서부터 와서 … 불어서 살아나게 하라」. 「생기」는 히브리어로 「루아흐(רוּחַ)」입니다. 이 낱말은 숨과 바람과 영을 함께 가리킵니다. 생기가 들어가자 뼈들이 일어나 큰 군대가 되었습니다."}, {"k": "오늘 읽는 법", "t": "이 본문은 환상입니다. 뼈 하나하나에 뜻을 붙이지 마십시오. 죽은 것을 살리는 힘은 뼈에게 없고 하나님께 있습니다. 바울도 「허물로 죽은 우리를 그리스도와 함께 살리셨고」라고 썼습니다(엡 2:5). 내 안에서 말라 버린 것을 떠올리며 읽으십시오."}], "questions": ["요즘 내 안에서 「말랐다」고 느끼는 것은 무엇입니까? 하나님 앞에 그대로 내어놓아 보십시오.", "겉은 갖추었지만 생기가 없는 신앙생활은 없습니까? 하나님의 영이 다시 불어 주시기를 구할 일은 무엇입니까?"], "apply": "오늘 「이제는 안 된다」고 포기한 일이나 사람 하나를 적습니다. 그 아래에 「주께서 아시나이다」라고 쓰고 기도합니다.", "prayer": "주 여호와여, 저도 마른 뼈처럼 소망 없이 지낼 때가 있었습니다. 주께서 생기를 불어넣으시면 죽은 것도 살아납니다. 오늘 주의 영으로 제 마음을 다시 살려 주소서. 제가 포기한 이웃에게도 주의 생기가 닿게 하소서. 예수님 이름으로 기도합니다. 아멘."}, "youth": {"title": "숨이 들어가야 산다", "lead": "몸이 다 갖춰져도 숨이 없으면 살지 못합니다. 하나님이 숨을 불어넣으셔야 삽니다.", "explain": [{"k": "", "t": "에스겔은 나라가 망한 뒤 바벨론으로 끌려간 사람입니다. 함께 끌려간 사람들은 「우리 소망이 없어졌다」며 울었어요(11절). 하나님은 에스겔에게 마른 뼈가 가득한 골짜기를 보여 주셨습니다."}, {"k": "", "t": "에스겔이 하나님 말씀대로 외치자 뼈들이 붙고 살이 오르고 피부가 덮였어요. 그런데 아직 숨이 없었습니다(8절). 하나님이 다시 명하시자 숨이 들어갔고, 뼈들이 일어나 큰 군대가 되었습니다(10절). 「생기」는 숨이자 바람이자 하나님의 영을 뜻하는 말이에요."}, {"k": "", "t": "주일 말씀은 우리가 「허물과 죄로 죽었던」 사람이었다고 했습니다(엡 2:1). 우리는 공부도 하고 교회도 다니며 겉을 갖출 수 있어요. 그래도 하나님이 숨을 불어넣으셔야 진짜 삽니다."}], "questions": ["요즘 「이건 끝났다」 싶어 포기한 일이 있나요?", "교회는 다니지만 마음은 말라 있다고 느낀 때가 있었나요? 그때 하나님께 무엇을 구하고 싶나요?"], "apply": "오늘 잠들기 전 1분 동안 폰을 내려놓고 깊이 숨을 쉬어 봐요. 숨을 들이쉴 때마다 「하나님, 제 안에 생기를 주세요」라고 기도해요.", "prayer": "하나님, 저도 마음이 바싹 마를 때가 있어요. 마른 뼈를 살리신 하나님, 제 안에 숨을 불어넣어 주세요. 포기한 일 앞에서 하나님을 다시 바라보게 해 주세요. 예수님 이름으로 기도합니다. 아멘."}, "kids": {"title": "마른 뼈가 살아났어요", "lead": "하나님은 죽은 것도 살리실 수 있어요.", "retell": ["하나님이 에스겔 아저씨를 넓은 골짜기로 데려가셨어요. 골짜기에는 바싹 마른 뼈가 가득했어요. 하나님은 에스겔 아저씨에게 뼈들에게 하나님의 말씀을 전하라고 하셨어요. 에스겔 아저씨가 말씀을 전하자 소리가 났어요. 뼈들이 서로 붙고, 살이 붙고, 피부가 덮였어요.", "그런데 아직 숨을 쉬지 않았어요. 하나님이 다시 말씀하셨어요. “숨아, 사방에서 불어와서 이 사람들을 살게 하라.” 숨이 들어가자 사람들이 살아나 일어났어요. 아주 많은 사람이 큰 군대처럼 섰어요."], "explain": [{"k": "찾아보세요", "t": "뼈들 속에 무엇이 없었나요? 8절에서 찾아 ○표를 해 보세요. 「살아나서 일어나」라는 말을 10절에서 찾아 밑줄을 그어 보세요."}, {"k": "생각해 보세요", "t": "풍선은 모양이 있어도 바람을 넣어야 부풀어요. 우리 몸도 숨을 쉬어야 살아요. 하나님은 마른 뼈에 숨을 넣어 살리셨어요. 하나님은 우리 마음에도 생명을 주세요."}, {"k": "한 가지 더", "t": "주일에 들은 말씀에서 바울 아저씨는 「하나님이 죽었던 우리를 살리셨다」고 했어요. 마른 뼈를 살리신 하나님이 우리도 살리셨어요."}], "questions": ["뼈들이 살아나서 무엇을 했나요? (10절에서 찾아보세요)", "내가 「이제 안 돼」 하고 포기한 일이 있나요?"], "apply": "오늘 숨을 크게 세 번 쉬면서 「하나님, 살게 해 주셔서 감사해요」라고 말해요.", "prayer": "하나님, 마른 뼈를 살리신 하나님을 찬양해요. 저는 ___ 때문에 속상해요. 하나님이 제 마음을 다시 힘나게 해 주세요. 예수님 이름으로 기도합니다. 아멘."}}, {"day_label": "수요일", "ref": "창 50:15-21", "passage": {"ref": "창 50:15-21", "label": "창세기 50:15–21", "source": "개역개정", "verses": [{"v": 15, "text": "요셉의 형제들이 그들의 아버지가 죽었음을 보고 말하되 요셉이 혹시 우리를 미워하여 우리가 그에게 행한 모든 악을 다 갚지나 아니할까 하고"}, {"v": 16, "text": "요셉에게 말을 전하여 이르되 당신의 아버지가 돌아가시기 전에 명령하여 이르시기를"}, {"v": 17, "text": "너희는 이같이 요셉에게 이르라 네 형들이 네게 악을 행하였을지라도 이제 바라건대 그들의 허물과 죄를 용서하라 하셨나니 당신 아버지의 하나님의 종들인 우리 죄를 이제 용서하소서 하매 요셉이 그들이 그에게 하는 말을 들을 때에 울었더라"}, {"v": 18, "text": "그의 형들이 또 친히 와서 요셉의 앞에 엎드려 이르되 우리는 당신의 종들이니이다"}, {"v": 19, "text": "요셉이 그들에게 이르되 두려워하지 마소서 내가 하나님을 대신하리이까"}, {"v": 20, "text": "당신들은 나를 해하려 하였으나 하나님은 그것을 선으로 바꾸사 오늘과 같이 많은 백성의 생명을 구원하게 하시려 하셨나니"}, {"v": 21, "text": "당신들은 두려워하지 마소서 내가 당신들과 당신들의 자녀를 기르리이다 하고 그들을 간곡한 말로 위로하였더라"}]}, "adult": {"title": "하나님은 그것을 선으로 바꾸사", "lead": "형들은 요셉을 해치려 했습니다. 하나님은 그 악을 많은 생명을 살리는 일로 바꾸셨습니다.", "explain": [{"k": "배경(15–18절)", "t": "야곱이 죽자 형들이 두려워졌습니다. 형들은 오래전 동생 요셉을 미워해 애굽에 종으로 팔았습니다. 형들은 아버지가 살아 있는 동안만 요셉이 참았다고 생각했습니다. 형들은 아버지의 말을 전하며 용서를 빌었습니다. 그리고 요셉 앞에 엎드려 「우리는 당신의 종들이니이다」라고 했습니다. 요셉은 형들의 말을 듣고 울었습니다."}, {"k": "19절", "t": "요셉이 답했습니다. 「내가 하나님을 대신하리이까」. 요셉은 애굽의 총리였습니다. 형들에게 갚을 힘이 있었습니다. 그러나 요셉은 심판이 하나님께 속한 일임을 알았습니다."}, {"k": "20절", "t": "「당신들은 나를 해하려 하였으나 하나님은 그것을 선으로 바꾸사」. 원문에는 같은 동사가 두 번 나옵니다. 「꾀하다(חָשַׁב)」입니다. 형들이 악을 꾀했고, 하나님이 선을 꾀하셨습니다. 하나님은 형들의 죄를 없던 일로 치지 않으셨습니다. 하나님은 그 죄 한가운데서 「많은 백성의 생명을 구원」하셨습니다. 큰 흉년에 애굽과 야곱 집안이 살아남았습니다."}, {"k": "오늘 읽는 법", "t": "이 본문은 창세기 37장부터 이어진 요셉 이야기의 맺음말입니다. 「고난은 결국 다 잘된다」는 말로 줄이지 마십시오. 하나님이 일하셨기에 요셉이 형들을 용서할 수 있었습니다. 에베소서 2장의 「그러나 하나님이」도 같은 하나님을 말합니다. 내 삶을 무너뜨린 일 앞에서 요셉의 고백을 붙드십시오."}], "questions": ["나를 아프게 한 사람이나 일이 떠오릅니까? 그 일 가운데서 하나님은 무엇을 하고 계셨을까요?", "요셉은 「내가 하나님을 대신하리이까」라고 말했습니다. 내가 하나님 대신 갚으려 하는 일은 무엇입니까?"], "apply": "용서하기 어려운 사람 한 사람을 위해 오늘 짧게 기도합니다. 그 사람에게 갚을 일을 하나님께 맡긴다고 고백합니다.", "prayer": "하나님, 사람이 악을 꾀할 때에도 주님은 선을 꾀하십니다. 저를 아프게 한 일도 주님의 손 안에 있음을 믿게 하소서. 제가 하나님을 대신해 갚으려 하지 않게 하소서. 요셉처럼 두려워하는 사람을 위로하게 하소서. 예수님 이름으로 기도합니다. 아멘."}, "youth": {"title": "복수 대신 위로", "lead": "요셉에게는 형들에게 갚을 힘이 있었습니다. 그런데 요셉은 형들을 위로했습니다.", "explain": [{"k": "", "t": "요셉의 형들은 질투 때문에 동생을 애굽에 노예로 팔았어요. 세월이 흘러 요셉은 애굽의 총리가 되었습니다. 아버지 야곱이 죽자 형들은 겁이 났어요. 「이제 요셉이 복수하겠지?」 형들은 요셉 앞에 엎드려 용서를 빌었습니다."}, {"k": "", "t": "요셉은 울었습니다. 그리고 말했어요. 「내가 하나님을 대신하리이까」(19절). 갚는 일은 하나님께 맡기겠다는 말입니다. 이어서 요셉은 고백했습니다. 「당신들은 나를 해하려 하였으나 하나님은 그것을 선으로 바꾸사」(20절)."}, {"k": "", "t": "요셉의 고백은 주일 말씀의 「그러나 하나님이」와 같아요. 친구가 나를 아프게 했을 때도 하나님은 그 일을 그냥 버려두지 않으세요. 하나님은 아픈 일 가운데서도 선을 이루십니다."}], "questions": ["친구 때문에 속상했던 일이 있나요? 그 일로 하나님이 내게 가르쳐 주신 것이 있나요?", "복수하고 싶었던 적이 있나요? 요셉의 말 「내가 하나님을 대신하리이까」가 나에게 어떻게 들리나요?"], "apply": "오늘 나를 서운하게 한 친구에게 DM이나 뒷말로 갚지 않아요. 대신 그 친구를 위해 한 문장 기도해요.", "prayer": "하나님, 저를 아프게 한 사람에게 갚아 주고 싶을 때가 있어요. 그 마음을 하나님께 맡기게 해 주세요. 나쁜 일도 선으로 바꾸시는 하나님을 믿게 해 주세요. 예수님 이름으로 기도합니다. 아멘."}, "kids": {"title": "요셉이 형들을 용서했어요", "lead": "하나님은 나쁜 일도 좋은 일로 바꾸실 수 있어요.", "retell": ["요셉의 형들은 오래전에 요셉을 미워해서 먼 나라 애굽에 팔았어요. 요셉은 애굽에서 높은 사람이 되었어요. 아버지 야곱이 돌아가시자 형들은 무서워졌어요. “요셉이 이제 우리를 혼내겠지?” 형들은 요셉 앞에 엎드려 용서해 달라고 빌었어요.", "요셉은 울었어요. 그리고 말했어요. “무서워하지 마세요. 형들은 나를 해치려고 했지만, 하나님은 그 일을 좋은 일로 바꾸셨어요. 하나님이 많은 사람을 살리셨어요. 내가 형들과 형들의 아이들을 돌볼게요.” 요셉은 따뜻한 말로 형들을 위로했어요."], "explain": [{"k": "찾아보세요", "t": "요셉이 형들에게 두 번 한 말이 있어요. 「두려워하지 마소서」를 19절과 21절에서 찾아 ○표를 해 보세요. 「선으로 바꾸사」를 20절에서 찾아 밑줄을 그어 보세요."}, {"k": "생각해 보세요", "t": "친구가 내 그림을 망가뜨리면 속상하지요. 그런데 선생님이 망가진 그림 위에 같이 새 그림을 그려 주시면 더 멋진 그림이 될 수도 있어요. 하나님은 나쁜 일 속에서도 좋은 일을 만드세요."}, {"k": "한 가지 더", "t": "주일에 「그러나 하나님이」라는 말씀을 들었어요. 요셉도 「하나님은 그것을 선으로 바꾸사」라고 말했어요. 하나님은 요셉 때에도, 지금도 일하세요."}], "questions": ["하나님은 형들이 한 나쁜 일을 무엇으로 바꾸셨나요? (20절에서 찾아보세요)", "나를 속상하게 한 친구가 있나요? 그 친구를 용서할 수 있을까요?"], "apply": "오늘 나를 속상하게 한 친구에게 먼저 웃으며 인사해요.", "prayer": "하나님, 나쁜 일도 좋은 일로 바꾸시는 하나님을 믿어요. 저는 ___ 때문에 속상했어요. 요셉처럼 용서하는 마음을 주세요. 예수님 이름으로 기도합니다. 아멘."}}, {"day_label": "금요일", "ref": "롬 5:6-10", "passage": {"ref": "롬 5:6-10", "label": "로마서 5:6–10", "source": "개역개정", "verses": [{"v": 6, "text": "우리가 아직 연약할 때에 기약대로 그리스도께서 경건하지 않은 자를 위하여 죽으셨도다"}, {"v": 7, "text": "의인을 위하여 죽는 자가 쉽지 않고 선인을 위하여 용감히 죽는 자가 혹 있거니와"}, {"v": 8, "text": "우리가 아직 죄인 되었을 때에 그리스도께서 우리를 위하여 죽으심으로 하나님께서 우리에 대한 자기의 사랑을 확증하셨느니라"}, {"v": 9, "text": "그러면 이제 우리가 그의 피로 말미암아 의롭다 하심을 받았으니 더욱 그로 말미암아 진노하심에서 구원을 받을 것이니"}, {"v": 10, "text": "곧 우리가 원수 되었을 때에 그의 아들의 죽으심으로 말미암아 하나님과 화목하게 되었은즉 화목하게 된 자로서는 더욱 그의 살아나심으로 말미암아 구원을 받을 것이니라"}]}, "adult": {"title": "우리가 아직 죄인 되었을 때에", "lead": "하나님은 우리가 나아지기를 기다리지 않으셨습니다. 우리가 원수였을 때 그리스도께서 죽으셨습니다.", "explain": [{"k": "앞 단락(1–5절)", "t": "바울은 로마서 1–4장에서 사람이 믿음으로 의롭다 하심을 받는다고 밝혔습니다. 5장은 그 열매를 말합니다. 우리는 하나님과 화평을 누리고, 환난 중에도 소망을 품습니다. 그 소망은 우리를 부끄럽게 하지 않습니다. 하나님의 사랑이 성령으로 우리 마음에 부어졌기 때문입니다(5절). 6절부터 바울은 하나님의 사랑이 얼마나 큰지 보여 줍니다."}, {"k": "6–8절", "t": "바울은 우리를 세 가지로 부릅니다. 「연약할 때」, 「경건하지 않은 자」, 「죄인」입니다. 의인을 위해 죽는 사람도 드뭅니다(7절). 그런데 그리스도께서는 죄인을 위해 죽으셨습니다. 8절의 「확증하셨느니라」는 헬라어로 「쉬니스테미(συνίστημι)」입니다. 눈앞에 세워 보여 준다는 뜻입니다. 이 동사는 현재형입니다. 십자가는 지금도 하나님의 사랑을 보여 줍니다."}, {"k": "9–10절", "t": "10절은 우리를 「원수」라고까지 부릅니다. 하나님은 아들의 죽으심으로 원수였던 우리와 화목하셨습니다. 바울은 「더욱」이라는 말을 두 번 씁니다(9, 10절). 원수였던 우리를 화목하게 하신 하나님이 화목하게 된 우리를 더욱 끝까지 구원하십니다."}, {"k": "오늘 읽는 법", "t": "이 단락은 작은 것에서 큰 것으로 견주어 말합니다. 하나님은 원수였던 우리를 위해 아들을 내어 주셨습니다. 그러니 자녀가 된 우리를 더욱 지키십니다. 에베소서 2:4–5도 같은 순서로 말합니다. 우리가 죽어 있을 때 하나님이 먼저 사랑하셨습니다. 오늘 「나는 아직 부족하다」는 생각이 들면 8절을 붙드십시오."}], "questions": ["나는 하나님 앞에 자격을 갖춰야 사랑받는다고 여긴 적이 있습니까?", "내가 원수처럼 여기는 사람이 있습니까? 원수였던 나와 화목하신 하나님은 그 사람을 어떻게 보실까요?"], "apply": "오늘 8절을 휴대폰 메모나 종이에 적어 하루 세 번 읽습니다. 사이가 틀어진 사람이 있다면 먼저 안부를 묻습니다.", "prayer": "하나님, 제가 아직 죄인일 때 그리스도께서 저를 위해 죽으셨습니다. 오늘 십자가에서 하나님의 사랑을 다시 봅니다. 자격을 갖추려 애쓰던 마음을 내려놓게 하소서. 원수였던 저와 화목하셨듯이 저도 이웃과 화목하게 하소서. 예수님 이름으로 기도합니다. 아멘."}, "youth": {"title": "준비될 때까지 기다리지 않으신 사랑", "lead": "하나님은 우리가 착해지기를 기다렸다가 사랑하지 않으셨습니다.", "explain": [{"k": "", "t": "보통 우리는 좋은 사람을 위해 희생해요. 바울도 의로운 사람을 위해 죽는 사람조차 드물다고 말합니다(7절). 그런데 예수님은 「경건하지 않은 자」, 「죄인」을 위해 죽으셨습니다(6, 8절)."}, {"k": "", "t": "8절은 십자가가 하나님의 사랑을 「확증」했다고 해요. 확증은 눈앞에 세워 보여 준다는 뜻입니다. 하나님의 사랑은 말로만 있지 않고 십자가로 보입니다. 10절은 우리가 하나님의 「원수」였다고까지 말해요. 하나님은 원수였던 우리와 화해하셨습니다."}, {"k": "", "t": "주일 말씀은 「우리가 하나님을 찾은 것이 아니다」라고 했어요. 하나님이 먼저 오셨습니다. 내가 아직 준비되지 않았어도 하나님은 나를 사랑하십니다."}], "questions": ["「내가 더 잘해야 하나님이 나를 좋아하실 거야」라고 생각한 적이 있나요?", "요즘 사이가 멀어진 친구가 있나요? 하나님이 먼저 다가오신 것처럼 내가 먼저 할 수 있는 일은 무엇일까요?"], "apply": "오늘 사이가 어색한 친구나 가족에게 먼저 짧은 메시지를 보내요.", "prayer": "하나님, 제가 착해지기 전에 먼저 사랑해 주셔서 감사해요. 예수님의 십자가로 그 사랑을 보여 주셨어요. 저도 먼저 다가가는 사람이 되게 해 주세요. 예수님 이름으로 기도합니다. 아멘."}, "kids": {"title": "예수님이 먼저 사랑하셨어요", "lead": "우리가 착해지기 전에 예수님이 먼저 우리를 사랑하셨어요.", "retell": ["바울 아저씨가 로마에 사는 성도들에게 편지를 썼어요. “착한 사람을 위해 대신 죽는 사람도 별로 없어요. 그런데 예수님은 하나님을 모르고 잘못하던 우리를 위해 죽으셨어요.”", "바울 아저씨는 또 썼어요. “우리는 하나님과 멀리 떨어져 있었어요. 하나님은 예수님을 보내셔서 우리와 다시 친하게 지내셨어요. 예수님의 십자가는 하나님이 우리를 얼마나 사랑하시는지 보여 줘요.”"], "explain": [{"k": "찾아보세요", "t": "우리가 어떤 사람이었을 때 예수님이 죽으셨나요? 8절에서 「죄인 되었을 때에」를 찾아 ○표를 해 보세요. 「사랑」이라는 말을 8절에서 찾아 밑줄을 그어 보세요."}, {"k": "생각해 보세요", "t": "엄마 아빠는 아기가 말을 알아듣기 전부터 아기를 사랑해요. 아기가 밤에 울어도 안아 주어요. 하나님도 우리가 착한 일을 하기 전부터 우리를 사랑하셨어요."}, {"k": "한 가지 더", "t": "주일에 「구원은 하나님의 선물」이라는 말씀을 들었어요. 예수님이 우리를 위해 죽으신 일은 하나님이 주신 가장 큰 선물이에요."}], "questions": ["예수님이 누구를 위하여 죽으셨나요? (8절에서 찾아보세요)", "하나님이 나를 사랑하신다고 느낀 때는 언제인가요?"], "apply": "오늘 가족에게 “사랑해요” 하고 먼저 말해요.", "prayer": "하나님, 제가 착해지기 전에 먼저 사랑해 주셔서 고마워요. 예수님을 보내 주셔서 고마워요. 저도 ___에게 먼저 사랑을 전하고 싶어요. 예수님 이름으로 기도합니다. 아멘."}}]};
const AGES = [["adult","청장년"],["youth","청소년"],["kids","어린이"]];
const state = { age: "adult", day: 0 };
const esc = s => String(s ?? "").replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const rich = s => esc(s).replace(/&lt;b&gt;/g,"<b>").replace(/&lt;\/b&gt;/g,"</b>");

function readHash(){
  const m = location.hash.match(/^#(adult|youth|kids)-(\d)$/);
  if (m) { state.age = m[1]; state.day = Math.min(DATA.days.length-1, Math.max(0, +m[2]-1)); return; }
  try { const s = JSON.parse(localStorage.getItem("qt-set-last")||"null"); if (s && AGES.some(a=>a[0]===s.age)) { state.age = s.age; state.day = Math.min(DATA.days.length-1, s.day|0); } } catch(e){}
}
function remember(){ try { localStorage.setItem("qt-set-last", JSON.stringify(state)); } catch(e){} history.replaceState(null,"",`#${state.age}-${state.day+1}`); }
function setAccent(){
  const r = document.documentElement.style;
  r.setProperty("--accent", `var(--a-${state.age})`); r.setProperty("--accent-soft", `var(--a-${state.age}-soft)`);
}
function renderTabs(){
  document.getElementById("ageTabs").innerHTML = AGES.map(([k,l]) => `<button role="tab" id="age-${k}" aria-selected="${state.age===k}" data-age="${k}">${l}</button>`).join("");
  document.getElementById("dayTabs").innerHTML = DATA.days.map((d,i) => `<button role="tab" id="day-${i}" aria-selected="${state.day===i}" data-day="${i}"><span>${esc(d.day_label)}</span><small>${esc(d.ref)}</small></button>`).join("");
}
function section(lbl, inner){ return `<section class="sec"><div class="lbl">${lbl}</div><div class="body">${inner}</div></section>`; }
function renderPanel(){
  const d = DATA.days[state.day]; const c = d[state.age];
  const verses = d.passage.verses.map(v => `<span class="v">${v.v}</span>${esc(v.text)} `).join("");
  let html = `<div class="head"><span class="ref">${esc(d.passage.label)}</span><h2>${esc(c.title)}</h2>${c.lead ? `<div class="lead">${rich(c.lead)}</div>` : ""}</div>`;
  html += `<div class="scripture"><p>${verses}</p><span class="src">${esc(d.passage.source)}</span></div>`;
  // 매일성경처럼 본문을 읽으며 붙드는 두 질문 — 매주 같다(2026-10-24 사용자 요청). 어린이는 쉬운 말로
  const ASK2 = state.age === "kids" ? ["하나님은 어떤 분이세요?", "나에게 무엇을 가르쳐 주세요?"] : ["하나님은 어떤 분이신가?", "나(우리)에게 주시는 교훈은 무엇인가?"];
  html += `<div class="ask2"><span class="lbl">본문을 읽으며</span>${ASK2.map(q=>`<span class="q">${q}</span>`).join("")}</div>`;
  if (c.retell && c.retell.length) html += `<div class="retell"><span class="lbl">쉽게 읽기</span>${c.retell.map(p=>`<p>${rich(p)}</p>`).join("")}</div>`;
  html += section("설명", c.explain.map(p => `<p>${p.k ? `<span class="k">${esc(p.k)}</span>` : ""}${rich(p.t)}</p>`).join(""));
  html += section("묵상 질문", `<ol class="qs">${c.questions.map((q,i)=>`<li><span class="n">${i+1}</span><div>${rich(q)}<div class="fill"></div></div></li>`).join("")}</ol>`);
  html += section("적용", `<div class="apply">${rich(c.apply)}</div>`);
  html += section("기도", `<div class="prayer">${rich(c.prayer).replace(/___+/g,'<span class="blank"></span>')}</div>`);
  const last = state.day === DATA.days.length-1;
  html += `<div class="nav"><button id="prev" ${state.day===0?"disabled":""}>← 이전</button><button id="next" ${last?"disabled":""}>다음 →</button></div>`;
  document.getElementById("panel").innerHTML = html;
}
function render(){ setAccent(); renderTabs(); renderPanel(); remember(); document.title = `${DATA.set_title} · ${AGES.find(a=>a[0]===state.age)[1]}`; }
document.getElementById("eyebrow").textContent = DATA.eyebrow || "";
document.getElementById("setTitle").textContent = DATA.set_title;
document.getElementById("sermonLine").innerHTML = DATA.sermon ? `이번 주 설교 <b>${esc(DATA.sermon.title)}</b> · ${esc(DATA.sermon.ref)}${DATA.sermon.date ? ` · ${esc(DATA.sermon.date)}` : ""}` : "";
document.getElementById("foot").innerHTML = rich(DATA.footer || "");
document.getElementById("app").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.age) state.age = b.dataset.age;
  else if (b.dataset.day) state.day = +b.dataset.day;
  else if (b.id === "prev") state.day--; else if (b.id === "next") state.day++; else return;
  render(); if (b.dataset.day !== undefined || b.id === "prev" || b.id === "next") document.getElementById("panel").scrollIntoView({block:"start", behavior:"smooth"});
});
window.addEventListener("hashchange", () => { readHash(); render(); });
readHash(); render();
</script>
