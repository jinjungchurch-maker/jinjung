<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>함께 지어져 가느니라 · 카드설교</title>
<style>body{margin:0;background:#000;color:#eee;font-family:-apple-system,'Apple SD Gothic Neo',sans-serif}.strip{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;height:100svh;scrollbar-width:none}.strip::-webkit-scrollbar{display:none}.strip img{flex:0 0 100%;width:100%;height:100svh;object-fit:contain;scroll-snap-align:center;scroll-snap-stop:always}.hint{position:fixed;left:0;right:0;bottom:max(14px,env(safe-area-inset-bottom));text-align:center;font-size:12px;color:rgba(255,255,255,.7);pointer-events:none;transition:opacity .6s}.wrap{max-width:720px;margin:0 auto;padding:28px 16px 48px}h1{font-size:18px;font-weight:600;margin:0 0 6px}p{font-size:13px;color:#aaa;margin:0 0 16px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.grid img{width:100%;border-radius:8px;display:block}.credit{margin-top:18px;font-size:11px;line-height:1.7;color:#777}.credit a{color:#999}.stage{position:relative}.cnav{position:absolute;top:50%;transform:translateY(-50%);z-index:2;width:36px;height:36px;padding:0 0 3px;border:0;border-radius:50%;background:rgba(0,0,0,.26);color:rgba(255,255,255,.85);font-size:24px;line-height:1;display:grid;place-items:center;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:opacity .25s,background .2s}.cnav:hover{background:rgba(0,0,0,.55);color:#fff}.cnav.off{opacity:0;pointer-events:none}.cnav.prev{left:max(6px,calc(50% - 28.125svh - 50px))}.cnav.next{right:max(6px,calc(50% - 28.125svh - 50px))}@media(min-width:700px){.cnav{width:44px;height:44px;font-size:28px;background:rgba(255,255,255,.12)}.cnav:hover{background:rgba(255,255,255,.26)}}</style></head>
<body><div class="stage"><div class="strip"><img src="01.jpg" alt="카드 1"><img src="02.jpg" alt="카드 2"><img src="03.jpg" alt="카드 3"><img src="04.jpg" alt="카드 4"><img src="05.jpg" alt="카드 5"><img src="06.jpg" alt="카드 6"><img src="07.jpg" alt="카드 7"><img src="08.jpg" alt="카드 8"><img src="09.jpg" alt="카드 9"></div><button class="cnav prev off" type="button" aria-label="이전 카드">‹</button><button class="cnav next" type="button" aria-label="다음 카드">›</button></div><div class="hint" id="hint">옆으로 넘겨 보세요 · 아래로 내리면 전체 보기</div>
<div class="wrap"><h1>함께 지어져 가느니라 · 카드 9장</h1><p>카드를 길게 누르면 저장할 수 있습니다.</p><div class="grid"><img src="01.jpg" alt="카드 1"><img src="02.jpg" alt="카드 2"><img src="03.jpg" alt="카드 3"><img src="04.jpg" alt="카드 4"><img src="05.jpg" alt="카드 5"><img src="06.jpg" alt="카드 6"><img src="07.jpg" alt="카드 7"><img src="08.jpg" alt="카드 8"><img src="09.jpg" alt="카드 9"></div><p class="credit">사진 1번 <a href="https://unsplash.com/photos/H6zZtkulqN8">Harald Attila</a> · 2번 <a href="https://unsplash.com/photos/X48hkTT1qQc">JOHN TOWNER</a> · 3번 <a href="https://unsplash.com/photos/rhaS97NhnHg">Waldemar Brandt</a> · 4번 <a href="https://unsplash.com/photos/sgdyBq6kheQ">Debby Hudson</a> · 5번 <a href="https://unsplash.com/photos/mX2mdxhc0UM">Dušan veverkolog</a> · 6번 <a href="https://unsplash.com/photos/YSPz1nJE-uU">Clement Souchet</a> · 7번 <a href="https://unsplash.com/photos/UK3vs6Z7PaE">Troy Mortier</a> · 8번 <a href="https://unsplash.com/photos/OKZRUxijthA">Julia Taubitz</a> · 9번 <a href="https://unsplash.com/photos/HVi8hlnYfkw">Jaeyoung Geoffrey Kang</a> / Unsplash</p></div>
<script>addEventListener("scroll",function(){document.getElementById("hint").style.opacity=scrollY>40?0:1},{passive:true});document.querySelector(".strip").addEventListener("scroll",function(){document.getElementById("hint").style.opacity=0},{passive:true,once:true});(function(){var s=document.querySelector(".strip"),p=document.querySelector(".cnav.prev"),n=document.querySelector(".cnav.next");function go(d){s.scrollBy({left:d*s.clientWidth,behavior:"smooth"})}function upd(){var i=Math.round(s.scrollLeft/s.clientWidth),m=s.children.length-1;p.classList.toggle("off",i<=0);n.classList.toggle("off",i>=m)}p.onclick=function(){go(-1)};n.onclick=function(){go(1)};s.addEventListener("scroll",upd,{passive:true});addEventListener("resize",upd);addEventListener("keydown",function(e){if(scrollY>innerHeight/2)return;if(e.key==="ArrowRight")go(1);if(e.key==="ArrowLeft")go(-1)});upd()})();</script></body></html>
