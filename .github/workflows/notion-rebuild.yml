name: 노션 자동 반영

# 노션 게시판에 글을 올린 직후 홈페이지를 다시 빌드한다 (build-board.js가 노션을 읽는다).
# 정해진 시각 자동 실행은 쓰지 않는다(2026-09-17 결정) — notion_upload.py --rebuild 가 진중교회 계정으로 이 워크플로를 실행한다.
# 저장소 Actions 탭의 "Run workflow" 버튼으로 손으로 실행해도 된다.
on:
  workflow_dispatch:

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Netlify 재빌드 요청
        run: curl -fsS -X POST "${{ secrets.NETLIFY_BUILD_HOOK }}"
